name: Build BP Guardian APK

on:
  push:
    branches:
      - claude/android-bp-monitor-watch-phone-vrv9fh
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bp-guardian-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  runtime-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bp-guardian-debug-apk
          path: apk

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install APK, launch, capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c
            adb install apk/app-debug.apk
            adb shell am start -n com.bpguard.monitor/.MainActivity
            sleep 10
            adb logcat -d > logcat_full.txt
            adb shell dumpsys activity activities | grep -A5 "mResumedActivity" > foreground_activity.txt || true
            echo "---- crash-relevant lines ----"
            grep -E "FATAL EXCEPTION|AndroidRuntime|com.bpguard.monitor" logcat_full.txt | tee logcat_crash_excerpt.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-smoke-test-logs
          path: |
            logcat_full.txt
            logcat_crash_excerpt.txt
            foreground_activity.txt

      - name: Fail if a fatal crash was logged
        run: |
          if grep -q "FATAL EXCEPTION" logcat_full.txt; then
            echo "App crashed on launch:"
            grep -A 30 "FATAL EXCEPTION" logcat_full.txt
            exit 1
          fi
