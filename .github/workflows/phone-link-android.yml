name: Phone Link (Android)

on:
  push:
    paths:
      - "phone-link/**"
      - ".github/workflows/phone-link-android.yml"
  pull_request:
    paths:
      - "phone-link/**"
      - ".github/workflows/phone-link-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-link
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: phone-link-apk
          path: phone-link/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
