<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MesureCam</title>
<meta name="description" content="Mesurer une longueur ou une distance avec la caméra du téléphone.">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #0b1118; --panel: #141d27; --panel2: #1b2733; --line: #2a3a4a;
    --text: #e8eef4; --muted: #93a4b5; --accent: #f5b301; --accent-ink: #1a1300;
    --ref: #f5b301; --obj: #22d3ee; --cal: #f472b6; --ok: #34d399; --warn: #fbbf24; --err: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  button, input, select { font: inherit; color: inherit; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 1.15rem; flex: 1; letter-spacing: .2px; }
  header h1 span { color: var(--accent); }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: .85rem; cursor: pointer; }
  nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px 16px; max-width: 760px; margin: 0 auto; }
  nav button { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 4px; cursor: pointer; font-weight: 600; font-size: .92rem; }
  nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  main { max-width: 760px; margin: 0 auto; padding: 0 16px 24px; }
  section[hidden] { display: none; }
  .stage { position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 62vh; background: #000; border-radius: 14px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .stage video, .stage canvas.main { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage video { object-fit: cover; }
  .stage .placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); }
  .stage .placeholder .btn { flex: 0 0 auto; }
  .loupe { position: absolute; top: 10px; left: 10px; width: 130px; height: 130px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 4px 18px rgba(0,0,0,.6); pointer-events: none; display: none; background: #000; }
  .cross { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; transform: translate(-50%, -50%); pointer-events: none; }
  .cross::before, .cross::after { content: ""; position: absolute; background: var(--accent); box-shadow: 0 0 3px #000; }
  .cross::before { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); }
  .cross::after { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%); }
  .hud { position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(0,0,0,.6); border-radius: 10px; padding: 8px 10px; font-size: .9rem; pointer-events: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn { flex: 1 1 auto; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); padding: 9px 14px; cursor: pointer; font-weight: 600; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--panel2); border-radius: 10px; padding: 4px; }
  .seg button { border: 0; background: transparent; border-radius: 8px; padding: 8px 2px; font-size: .82rem; font-weight: 600; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .step { margin-top: 10px; color: var(--muted); }
  .step b { color: var(--text); }
  label.f { display: block; margin-top: 10px; font-size: .88rem; color: var(--muted); }
  label.f input, label.f select { display: block; width: 100%; margin-top: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-height: 42px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .result { margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px dashed var(--line); }
  .result .big { font-size: 1.7rem; font-weight: 700; color: var(--obj); }
  .result .sub { font-size: .85rem; color: var(--muted); }
  .note { font-size: .85rem; color: var(--muted); margin-top: 8px; }
  .warn { color: var(--warn); }
  .err { color: var(--err); }
  .ok { color: var(--ok); }
  details { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  details summary { cursor: pointer; font-weight: 600; }
  details ul { margin: 8px 0 0 18px; color: var(--muted); font-size: .9rem; }
  details li { margin-top: 4px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  ol.list { margin: 8px 0 0 20px; }
  /* AR overlay (WebXR dom-overlay root) */
  #ar-overlay { position: fixed; inset: 0; z-index: 50; background: transparent; }
  #ar-overlay[hidden] { display: none; }
  #ar-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .ar-top { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; background: rgba(0,0,0,.6); border-radius: 12px; padding: 10px 12px; text-align: center; }
  .ar-top .big { font-size: 1.5rem; font-weight: 700; }
  .ar-list { position: absolute; left: 12px; right: 12px; bottom: calc(96px + env(safe-area-inset-bottom)); max-height: 30vh; overflow: auto; background: rgba(0,0,0,.55); border-radius: 12px; padding: 8px 12px; font-size: .9rem; }
  .ar-list:empty { display: none; }
  .ar-bar { position: absolute; left: 12px; right: 12px; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .ar-bar .btn { flex: 1; background: rgba(20,29,39,.85); color: #fff; }
  .ar-bar .add { flex: 0 0 72px; height: 72px; border-radius: 50%; font-size: 2rem; background: var(--accent); color: var(--accent-ink); border: 4px solid #fff; }
</style>
</head>
<body>
<header>
  <h1>Mesure<span>Cam</span></h1>
  <button id="install" class="chip" hidden data-i18n="install">Installer</button>
  <button id="lang" class="chip" aria-label="Language">EN</button>
</header>

<nav role="tablist">
  <button role="tab" data-tab="photo" aria-selected="true" data-i18n="tabPhoto">Photo</button>
  <button role="tab" data-tab="tilt" aria-selected="false" data-i18n="tabTilt">Inclinaison</button>
  <button role="tab" data-tab="ar" aria-selected="false" data-i18n="tabAR">RA 3D</button>
</nav>

<main>
  <!-- ============ PHOTO ============ -->
  <section id="view-photo">
    <div class="stage" id="p-stage">
      <video id="p-video" playsinline muted autoplay></video>
      <canvas id="p-canvas" class="main" hidden></canvas>
      <canvas id="p-loupe" class="loupe"></canvas>
      <div class="placeholder" id="p-ph">
        <div data-i18n="camOff">La caméra est éteinte.</div>
        <button class="btn primary" data-camstart data-i18n="camStart">Activer la caméra</button>
      </div>
    </div>
    <div class="row">
      <button class="btn primary" id="p-capture" data-i18n="capture">Capturer</button>
      <button class="btn" id="p-import" data-i18n="import">Importer une photo</button>
      <button class="btn" id="p-retake" hidden data-i18n="retake">Nouvelle photo</button>
      <input type="file" id="p-file" accept="image/*" hidden>
    </div>
    <div class="card" id="p-panel">
      <div class="seg" id="p-methods">
        <button data-m="ref" data-i18n="mRef">Référence</button>
        <button data-m="dist" data-i18n="mDist">Distance</button>
        <button data-m="size" data-i18n="mSize">Taille</button>
        <button data-m="calib" data-i18n="mCalib">Calibrer</button>
      </div>
      <p class="note" id="p-mdesc"></p>
      <div id="p-inputs"></div>
      <p class="step" id="p-step"></p>
      <div class="result" id="p-result" hidden></div>
      <div class="row">
        <button class="btn" id="p-clear" data-i18n="clearPts">Effacer les points</button>
        <button class="btn" id="p-again" hidden data-i18n="newMeasure">Mesurer un autre objet</button>
      </div>
      <p class="note" id="p-calinfo"></p>
    </div>
    <details>
      <summary data-i18n="tipsTitle">Conseils de précision</summary>
      <ul>
        <li data-i18n="tipP1"></li>
        <li data-i18n="tipP2"></li>
        <li data-i18n="tipP3"></li>
        <li data-i18n="tipP4"></li>
      </ul>
    </details>
  </section>

  <!-- ============ TILT ============ -->
  <section id="view-tilt" hidden>
    <div class="stage" id="t-stage">
      <video id="t-video" playsinline muted autoplay></video>
      <div class="cross"></div>
      <div class="placeholder" id="t-ph">
        <div data-i18n="camOff">La caméra est éteinte.</div>
        <button class="btn primary" data-camstart data-i18n="camStart">Activer la caméra</button>
      </div>
      <div class="hud" id="t-hud">—</div>
    </div>
    <div class="card">
      <p class="note" data-i18n="tiltDesc"></p>
      <label class="f"><span data-i18n="tiltHeight">Hauteur de l'objectif au-dessus du sol (cm)</span>
        <input type="number" id="t-h" inputmode="decimal" min="10" max="1000" step="1">
      </label>
      <div class="row">
        <button class="btn" id="t-perm" hidden data-i18n="sensors">Activer les capteurs</button>
        <button class="btn primary" id="t-base" data-i18n="aimBase">Viser la base → distance</button>
        <button class="btn" id="t-top" disabled data-i18n="aimTop">Viser le sommet → hauteur</button>
      </div>
      <div class="result" id="t-result" hidden></div>
    </div>
    <details>
      <summary data-i18n="tipsTitle">Conseils de précision</summary>
      <ul>
        <li data-i18n="tipT1"></li>
        <li data-i18n="tipT2"></li>
        <li data-i18n="tipT3"></li>
      </ul>
    </details>
  </section>

  <!-- ============ AR ============ -->
  <section id="view-ar" hidden>
    <div class="card">
      <p data-i18n="arDesc"></p>
      <p class="note" id="ar-support"></p>
      <div class="row"><button class="btn primary" id="ar-start" disabled data-i18n="arStart">Démarrer la RA</button></div>
      <div id="ar-results"></div>
    </div>
    <details>
      <summary data-i18n="tipsTitle">Conseils de précision</summary>
      <ul>
        <li data-i18n="tipA1"></li>
        <li data-i18n="tipA2"></li>
        <li data-i18n="tipA3"></li>
      </ul>
    </details>
  </section>
</main>

<div id="ar-overlay" hidden>
  <canvas id="ar-canvas"></canvas>
  <div class="ar-top"><div class="sub" data-i18n="arCamToPoint">Caméra → point visé</div><div class="big" id="ar-dist">—</div><div class="note" id="ar-hint"></div></div>
  <div class="ar-list" id="ar-list"></div>
  <div class="ar-bar">
    <button class="btn" id="ar-undo" data-i18n="undo">Annuler</button>
    <button class="btn add" id="ar-add" aria-label="+">+</button>
    <button class="btn" id="ar-clear" data-i18n="clear">Effacer</button>
    <button class="btn" id="ar-exit" data-i18n="exit">Quitter</button>
  </div>
</div>

<script>

/* ================= Utilities ================= */
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const store = {
  get(k, d) { try { const v = localStorage.getItem("mesurecam." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("mesurecam." + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("mesurecam." + k); } catch {} },
};
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const DEG = Math.PI / 180;
// Uncalibrated default: focal length / long side of the image, for a typical
// 26 mm-equivalent main phone camera (4:3 sensor): f = 26 / 34.6 ≈ 0.75 × long side.

// Computes the current photo result. Lengths in metres.
function computePhoto() {

const tilt = { samples: [], dep: null, std: null, got: false, started: false, d: null, dErr: null, H: null, HErr: null };

  // The rear camera looks along the device's −z axis. With W3C Euler angles,
  // the world-vertical component of +z is cos(beta)·cos(gamma), so the camera's
  // depression below the horizon is asin(cosβ·cosγ). Valid in portrait and landscape.
  const s = Math.cos(e.beta * DEG) * Math.cos((e.gamma || 0) * DEG);

  tilt.std = Math.sqrt(tilt.samples.reduce((a, b) => a + (b - mean) ** 2, 0) / tilt.samples.length);

  if (tilt.dep == null || !h) return;
  const d = groundDist(tilt.dep, h);
  if (!d) { $("#t-hud").innerHTML = t("aimLower"); return; }
  tilt.d = d;
  tilt.dErr = (h / Math.sin(tilt.dep) ** 2) * ANG_ERR; // |∂d/∂δ|·σδ
  tilt.H = null;
  $("#t-top").disabled = false;
  updateTiltResult();
});
$("#t-top").addEventListener("click", () => {
  const h = camH();
  if (tilt.dep == null || !h || tilt.d == null) return;
  const dt = tilt.dep; // depression of the top (negative when aiming up)
  tilt.H = h - tilt.d * Math.tan(dt);
  tilt.HErr = Math.hypot(Math.tan(dt) * tilt.dErr, (tilt.d / Math.cos(dt) ** 2) * ANG_ERR);
  updateTiltResult();
});
function updateTiltResult() {
  const r = $("#t-result");
  if (tilt.d == null) { r.hidden = true; return; }
  r.hidden = false;
  let h = `<div class="sub">${t("tDist")}</div><div class="big">${fmtLen(tilt.d)}</div><div class="sub">${t("tErr", { e: fmtLen(tilt.dErr) })}</div>`;
  if (tilt.H != null) h += `<div class="sub" style="margin-top:10px">${t("tHeight")}</div><div class="big">${fmtLen(tilt.H)}</div><div class="sub">${t("tErr", { e: fmtLen(tilt.HErr) })}</div>`;
  r.innerHTML = h;
}

/* ================= AR MODE (WebXR hit-test) ================= */
let arSupported = null, xr = null, arLast = [];
async function refreshARSupport() {
  const el = $("#ar-support"), btn = $("#ar-start");
  if (arSupported === null) {
    el.textContent = t("arChecking");
    try { arSupported = !!(navigator.xr && await navigator.xr.isSessionSupported("immersive-ar")); } catch { arSupported = false; }
  }
  el.innerHTML = arSupported ? `<span class="ok">${t("arOk")}</span>` : `<span class="warn">${t("arNo")}</span>`;
  btn.disabled = !arSupported;
  renderARResults();
}
function renderARResults() {
  const box = $("#ar-results");
  if (!arLast.length) { box.innerHTML = ""; return; }
  box.innerHTML = `<p class="note">${t("lastResults")}</p><ol class="list">` + arLast.map((m) => `<li>${fmtLen(m)}</li>`).join("") + "</ol>";
}
function mat4mul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0;
    for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
    o[c * 4 + r] = s;
  }
  return o;
}
const v3 = (p) => ({ x: p.x, y: p.y, z: p.z });
const dist3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);

$("#ar-start").addEventListener("click", async () => {
  stopCamera();
  const overlay = $("#ar-overlay");
  overlay.hidden = false;
  try {
    const session = await navigator.xr.requestSession("immersive-ar", {
      requiredFeatures: ["hit-test", "dom-overlay"], domOverlay: { root: overlay },
    });
    const glc = document.createElement("canvas");
    const gl = glc.getContext("webgl", { xrCompatible: true, alpha: true });
    if (gl.makeXRCompatible) await gl.makeXRCompatible();
    session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
    const refSpace = await session.requestReferenceSpace("local");
    const viewerSpace = await session.requestReferenceSpace("viewer");
    const hitSource = await session.requestHitTestSource({ space: viewerSpace });
    xr = { session, gl, refSpace, hitSource, reticle: null, cam: null, pts: [], hud: "" };
    session.addEventListener("end", () => {
      overlay.hidden = true;
      if (xr) { arLast = arSegments(xr.pts).map((s) => s.len); renderARResults(); }
      xr = null;
    });
    session.requestAnimationFrame(onXRFrame);
  } catch (e) {
    overlay.hidden = true;
    $("#ar-support").innerHTML = `<span class="err">${t("arErr", { e: e && e.message ? e.message : String(e) })}</span>`;
  }
});
const overlayEl = $("#ar-overlay");
overlayEl.addEventListener("beforexrselect", (e) => e.preventDefault());
$("#ar-add").addEventListener("click", () => { if (xr && xr.reticle) xr.pts.push(v3(xr.reticle)); });
$("#ar-undo").addEventListener("click", () => { if (xr) xr.pts.pop(); });
$("#ar-clear").addEventListener("click", () => { if (xr) xr.pts = []; });
$("#ar-exit").addEventListener("click", () => { if (xr) xr.session.end(); });

function arSegments(pts) {
  const out = [];
  for (let i = 0; i + 1 < pts.length; i += 2) out.push({ a: pts[i], b: pts[i + 1], len: dist3(pts[i], pts[i + 1]) });
  return out;
}
function onXRFrame(time, frame) {
  if (!xr) return;
  const session = frame.session;
  session.requestAnimationFrame(onXRFrame);
  const gl = xr.gl, layer = session.renderState.baseLayer;
  gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const pose = frame.getViewerPose(xr.refSpace);
  if (!pose) return;
  xr.cam = v3(pose.transform.position);
  const hits = frame.getHitTestResults(xr.hitSource);
  xr.reticle = hits.length ? v3(hits[0].getPose(xr.refSpace).transform.position) : null;
  drawAR(pose.views[0]);
}
function drawAR(view) {
  const cv = $("#ar-canvas"), dpr = window.devicePixelRatio || 1;
  const W = window.innerWidth, H = window.innerHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const M = mat4mul(view.projectionMatrix, view.transform.inverse.matrix);
  const project = (p) => {
    const x = M[0] * p.x + M[4] * p.y + M[8] * p.z + M[12];
    const y = M[1] * p.x + M[5] * p.y + M[9] * p.z + M[13];
    const w = M[3] * p.x + M[7] * p.y + M[11] * p.z + M[15];
    if (w <= 1e-4) return null;
    return { x: (x / w * 0.5 + 0.5) * W, y: (1 - (y / w * 0.5 + 0.5)) * H };
  };
  const line = (a, b, color, label) => {
    const pa = project(a), pb = project(b);
    if (!pa || !pb) return;
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
    if (label) {
      const mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
      ctx.font = "700 16px system-ui, sans-serif"; ctx.textAlign = "center";
      const w = ctx.measureText(label).width + 14;
      ctx.fillStyle = "rgba(0,0,0,.75)"; ctx.fillRect(mx - w / 2, my - 30, w, 24);
      ctx.fillStyle = color; ctx.fillText(label, mx, my - 13);
    }
  };
  const segs = arSegments(xr.pts);
  segs.forEach((s) => line(s.a, s.b, "#22d3ee", fmtLen(s.len)));
  const pending = xr.pts.length % 2 === 1 ? xr.pts[xr.pts.length - 1] : null;
  if (pending && xr.reticle) line(pending, xr.reticle, "#f5b301", fmtLen(dist3(pending, xr.reticle)));
  for (const p of xr.pts) {
    const q = project(p);
    if (!q) continue;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(q.x, q.y, 6, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.stroke();
  }
  // Reticle: the hit-test ray goes through the screen centre.
  const rp = xr.reticle ? project(xr.reticle) : null;
  const cx = rp ? rp.x : W / 2, cy = rp ? rp.y : H / 2;
  ctx.strokeStyle = xr.reticle ? "#34d399" : "rgba(255,255,255,.6)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, 18, 0, 2 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, 2 * Math.PI); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
  // HUD (only touch the DOM when text changes)
  const d = xr.reticle && xr.cam ? fmtLen(dist3(xr.cam, xr.reticle)) : "—";
  const hint = !xr.reticle ? t("arScan") : pending ? t("arPlace2") : t("arPlace1");
  const list = segs.map((s, i) => `${t("seg", { i: i + 1 })} : <b>${fmtLen(s.len)}</b>`).join("<br>");
  const key = d + "|" + hint + "|" + list;
  if (key !== xr.hud) {
    xr.hud = key;
    $("#ar-dist").textContent = d; $("#ar-hint").textContent = hint; $("#ar-list").innerHTML = list;
  }
}

window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; $("#install").hidden = false; });
$("#install").addEventListener("click", async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("#install").hidden = true; });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

applyI18n();
setTab("photo");
</script>
