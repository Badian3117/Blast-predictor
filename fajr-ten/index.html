q:["Avec quoi Jibril lava-t-il le cœur du jeune Prophète ﷺ ?",["L'eau de Zamzam","L'eau de pluie","Du lait"],0]},
{t:"Le jeune homme digne de confiance",
b:"Jeune homme, le Prophète ﷺ fut berger pour les gens de La Mecque. Il a dit : « Allah n'a envoyé aucun prophète qui n'ait gardé des moutons. » Garder un troupeau enseigne la patience, l'attention et la responsabilité envers les faibles. Plus tard, il voyagea avec les caravanes de commerce. Il n'adora jamais les idoles et ne participa jamais à l'ivresse et aux vices de son peuple. Quraysh l'appelait al-Amin, le Digne de confiance, et lui confiait ses biens. Même ses ennemis continuèrent à lui confier leurs dépôts après le début de sa prédication.",
a:"Tenez aujourd'hui toutes vos promesses, même les petites. L'honnêteté était sa réputation bien avant la prophétie.",
q:["Quel surnom Quraysh lui donnait-il avant la prophétie ?",["Al-Amin, le Digne de confiance","Al-Faruq","As-Siddiq"],0]},
{t:"Le mariage avec Khadija",
b:"Khadija bint Khuwaylid était une femme noble et une riche commerçante. Elle engagea Muhammad ﷺ pour commercer en son nom en Syrie et fut impressionnée par son honnêteté et la bénédiction dans ses affaires. Elle le demanda en mariage par l'intermédiaire d'une amie. Selon les sources de la sira, il avait environ 25 ans et elle environ 40. Ce fut un mariage d'amour, de confiance et de soutien. Il n'épousa personne d'autre de son vivant. Leurs enfants furent al-Qasim, 'Abdullah, Zaynab, Ruqayya, Umm Kulthum et Fatima. Les deux garçons moururent jeunes.",
a:"Remerciez votre épouse ou un membre de votre famille pour une chose précise qu'il ou elle fait pour vous.",
q:["Le Prophète ﷺ a-t-il épousé une autre femme du vivant de Khadija ?",["Non","Oui, une","Oui, deux"],0]},
{t:"La dispute de la Pierre noire",
b:"Vers l'âge de 35 ans du Prophète ﷺ, Quraysh reconstruisit la Ka'ba endommagée par une crue. Au moment de replacer la Pierre noire, chaque clan voulut cet honneur et l'on faillit en venir aux armes. Ils convinrent que le premier homme à entrer dans le sanctuaire trancherait. Ce fut Muhammad ﷺ. Il posa la pierre sur un tissu, demanda au chef de chaque clan d'en tenir un bord et de la soulever ensemble, puis la plaça de ses propres mains. Tous furent satisfaits et aucun sang ne fut versé.",
a:"S'il y a une tension entre deux personnes que vous connaissez, cherchez une solution juste où chacun garde sa dignité.",
q:["Comment régla-t-il la dispute ?",["Chaque clan souleva la pierre ensemble sur un tissu","Il tira au sort","Il donna l'honneur à son propre clan"],0]},
{t:"La grotte de Hira",
b:"Dans les années précédant la prophétie, le Prophète ﷺ aimait s'isoler dans la grotte de Hira, sur une montagne près de La Mecque, pour adorer et méditer. À quarante ans, pendant le Ramadan, l'ange Jibril vint et lui dit : « Lis ! » Il répondit : « Je ne sais pas lire. » L'ange le serra trois fois, puis récita les premiers versets jamais révélés : « Lis, au nom de ton Seigneur qui a créé, qui a créé l'homme d'une adhérence. Lis ! Ton Seigneur est le Très Noble, qui a enseigné par la plume, a enseigné à l'homme ce qu'il ne savait pas. »",
a:"Mémorisez les versets 1 à 5 de la sourate al-'Alaq avec leur sens. Ce sont les premières paroles du Coran parvenues à l'humanité.",
q:["Quel fut le premier mot révélé ?",["Iqra' (Lis)","Qul (Dis)","Bismillah"],0]},
{t:"Le réconfort de Khadija et Waraqa",
b:"Le Prophète ﷺ rentra chez lui tremblant et dit : « Couvrez-moi, couvrez-moi ! » Quand sa peur passa, il raconta à Khadija ce qui s'était passé. Elle dit : « Par Allah, Allah ne t'humiliera jamais. Tu maintiens les liens de parenté, tu portes le fardeau du faible, tu aides le pauvre, tu honores l'invité et tu soutiens les gens dans l'épreuve. » Elle l'emmena chez son cousin Waraqa ibn Nawfal, un savant chrétien, qui dit : « C'est le même Ange qu'Allah envoya à Moïse », et souhaita vivre pour le soutenir quand son peuple le chasserait.",
a:"Relisez les cinq qualités citées par Khadija. Choisissez-en une et pratiquez-la aujourd'hui.",
q:["Qui était Waraqa ibn Nawfal ?",["Le cousin de Khadija, un savant chrétien","L'oncle du Prophète","Un chef de Quraysh"],0]},
{t:"Les premiers croyants",
b:"Pendant environ trois ans, l'appel resta discret, auprès de la famille proche et d'amis de confiance. La première à croire fut Khadija. Parmi les hommes, ce fut Abu Bakr ; parmi les garçons, 'Ali ibn Abi Talib, âgé d'environ dix ans ; parmi les affranchis, Zayd ibn Haritha. Abu Bakr amena d'autres personnes à l'islam, dont 'Uthman ibn 'Affan, az-Zubayr, 'Abd ar-Rahman ibn 'Awf, Sa'd ibn Abi Waqqas et Talha. Ils se réunissaient en secret dans la maison d'al-Arqam ibn Abi al-Arqam pour apprendre le Coran.",
a:"Partagez avec un ami ou un proche une chose utile apprise cette semaine. La da'wa d'Abu Bakr commença avec ses amis.",
q:["Qui fut la première personne à embrasser l'islam ?",["Khadija","Abu Bakr","'Ali"],0]},
{t:"L'appel du mont Safa",
b:"Quand Allah révéla « Et avertis les gens qui te sont les plus proches », le Prophète ﷺ monta sur le mont as-Safa et appela les clans de Quraysh. Il demanda : « Si je vous disais qu'une armée derrière cette vallée s'apprête à vous attaquer, me croiriez-vous ? » Ils dirent : « Nous ne t'avons connu que véridique. » Il dit : « Alors je suis pour vous un avertisseur avant un dur châtiment. » Son oncle Abu Lahab dit : « Que tu périsses ! Est-ce pour cela que tu nous as réunis ? » Allah révéla alors la sourate al-Masad.",
a:"Lisez la sourate al-Masad (111). Remarquez que le lien de parenté n'a pas sauvé son oncle ; ce sont la foi et les actes qui comptent.",
q:["Pourquoi Quraysh dit-il qu'il le croirait ?",["Ils ne l'avaient connu que véridique","Il était riche","Il était leur chef"],0]},
{t:"La patience face à la persécution",
b:"Quraysh tortura les musulmans les plus faibles. Bilal, un esclave abyssin, fut couché sur le sable brûlant avec un rocher sur la poitrine par son maître Umayya ibn Khalaf, et répétait : « Ahad, Ahad » (Un, Un). Abu Bakr l'acheta et l'affranchit. Yasir, sa femme Sumayya et leur fils 'Ammar furent torturés ensemble. Le Prophète ﷺ passa près d'eux et dit : « Patience, famille de Yasir, votre rendez-vous est le Paradis. » Sumayya fut tuée par Abu Jahl et devint la première martyre de l'islam.",
a:"Quand une chose vous est difficile aujourd'hui, dites : « Hasbunallahu wa ni'mal-wakil » (Allah nous suffit, Il est le meilleur garant) – Coran 3:173.",
q:["Qui fut la première martyre de l'islam ?",["Sumayya","Bilal","Hamza"],0]},
{t:"L'émigration en Abyssinie",
b:"La cinquième année de la prophétie, le Prophète ﷺ conseilla à un groupe de musulmans d'émigrer en Abyssinie, où régnait un roi chrétien juste, an-Najashi (le Négus). Quraysh envoya 'Amr ibn al-'As pour les ramener. Ja'far ibn Abi Talib parla au nom des musulmans : ils adoraient des idoles, mangeaient la charogne et maltraitaient leurs voisins jusqu'à ce qu'Allah leur envoie un Messager qui enseigna la sincérité, la loyauté, les liens familiaux et l'adoration d'Allah seul. Il récita le début de la sourate Maryam. Le roi pleura et refusa de les livrer.",
a:"Lisez les 36 premiers versets de la sourate Maryam, le passage que Ja'far récita au roi.",
q:["Quelle sourate Ja'far récita-t-il devant le Négus ?",["Maryam","Yusuf","Al-Kahf"],0]},
{t:"Le boycott et l'Année de la tristesse",
b:"Quraysh signa un pacte pour boycotter les Banu Hashim : ni commerce, ni mariage. Pendant environ trois ans, le Prophète ﷺ, sa famille et les musulmans furent confinés dans la vallée d'Abu Talib. Ils mangeaient des feuilles et l'on entendait les pleurs des enfants affamés. Le boycott prit fin, mais peu après, la dixième année de la prophétie, Abu Talib et Khadija moururent tous deux. On l'appelle l'Année de la tristesse. Il perdit en peu de temps son protecteur et son plus proche soutien.",
a:"Appelez ou rendez visite à quelqu'un qui a perdu un proche cette année.",
q:["Qui mourut pendant l'Année de la tristesse ?",["Khadija et Abu Talib","Hamza et Abu Talib","Abu Bakr et Khadija"],0]},
{t:"Le jour de Ta'if",
b:"Le Prophète ﷺ marcha jusqu'à Ta'if pour appeler ses habitants. Ils le rejetèrent et envoyèrent des enfants et des esclaves lui jeter des pierres jusqu'à ce que ses pieds saignent. Il dit plus tard à 'A'isha que ce fut le jour le plus dur qu'il ait connu. Jibril vint avec l'Ange des montagnes, qui proposa d'écraser Ta'if entre deux montagnes. Le Prophète ﷺ répondit : « Non. J'espère qu'Allah fera sortir de leur descendance des gens qui adoreront Allah seul, sans rien Lui associer. »",
a:"Pardonnez aujourd'hui à quelqu'un qui vous a blessé, et priez pour sa guidée plutôt que contre lui.",
q:["Que répondit-il à l'Ange des montagnes ?",["Il espérait que leurs descendants adoreraient Allah","Il demanda leur châtiment","Il demanda à rentrer chez lui"],0]},
{t:"Al-Isra' wal-Mi'raj",
b:"Après l'Année de la tristesse, Allah honora Son Messager par le Voyage nocturne. Il fut transporté sur al-Buraq de La Mecque à la mosquée al-Aqsa à Jérusalem, où il dirigea la prière des prophètes. Puis il monta à travers les cieux, rencontra des prophètes dont Adam, 'Isa, Yusuf, Idris, Harun, Musa et Ibrahim, et atteignit Sidrat al-Muntaha. Là, Allah prescrivit cinquante prières, réduites sur le conseil de Musa à cinq, avec la récompense de cinquante. Abu Bakr y crut immédiatement et fut appelé as-Siddiq.",
a:"Accomplissez aujourd'hui chacune des cinq prières à l'heure. Elles furent le cadeau donné directement dans les cieux.",
q:["Combien de prières furent d'abord prescrites ?",["Cinquante, réduites à cinq","Cinq dès le début","Trois"],0]},
{t:"Les serments d'al-'Aqaba",
b:"Pendant la saison du pèlerinage, le Prophète ﷺ rencontra des hommes de Yathrib (la future Médine). Six d'entre eux embrassèrent l'islam. L'année suivante, douze vinrent prêter le Premier serment d'al-'Aqaba : ne rien associer à Allah, ne pas voler, ne pas commettre l'adultère, ne pas tuer leurs enfants et ne pas lui désobéir dans le bien. Il envoya avec eux Mus'ab ibn 'Umayr, premier enseignant de l'islam. Un an plus tard, 73 hommes et 2 femmes prêtèrent le Second serment, promettant de le protéger comme leurs propres familles.",
a:"Renouvelez votre propre serment : listez les engagements du Premier serment et examinez-vous sur chacun.",
q:["Qui fut envoyé comme premier enseignant à Médine ?",["Mus'ab ibn 'Umayr","Abu Bakr","'Ali"],0]},
{t:"L'Hégire",
b:"Quraysh complota pour tuer le Prophète ﷺ. Il quitta sa maison de nuit pendant que 'Ali dormait dans son lit, et partit avec Abu Bakr. Ils se cachèrent trois nuits dans la grotte de Thawr. Quand les pisteurs se tinrent à l'entrée, Abu Bakr dit : « Si l'un d'eux regarde ses pieds, il nous verra. » Le Prophète ﷺ dit : « Que penses-tu de deux dont Allah est le troisième ? » Suraqa ibn Malik les poursuivit pour la récompense, mais les pattes de son cheval s'enfoncèrent dans le sable. Cette Hégire, en 622, marque le début du calendrier islamique.",
a:"Quand vous êtes inquiet aujourd'hui, rappelez-vous ses paroles : « Ne t'afflige pas, Allah est avec nous » (Coran 9:40).",
q:["Où se cachèrent-ils trois nuits ?",["Dans la grotte de Thawr","Dans la grotte de Hira","Dans la maison d'al-Arqam"],0]},
{t:"La construction de Médine",
b:"Le Prophète ﷺ s'arrêta d'abord à Quba', où il bâtit la première mosquée. À Médine, il construisit sa mosquée de ses propres mains. Puis il associa chaque Muhajir (émigré) à un Ansari (auxiliaire) comme frères. Sa'd ibn ar-Rabi' offrit à 'Abd ar-Rahman ibn 'Awf la moitié de ses biens ; 'Abd ar-Rahman le remercia et lui demanda seulement de lui montrer le marché. 'Abdullah ibn Salam rapporta que les premières paroles qu'il entendit du Prophète ﷺ furent : « Répandez le salam, nourrissez les gens, maintenez les liens de parenté et priez la nuit pendant que les gens dorment, vous entrerez au Paradis en paix. »",
a:"Faites les quatre aujourd'hui : saluez par le salam, nourrissez quelqu'un, contactez un proche et priez deux rak'as la nuit.",
q:["Que demanda 'Abd ar-Rahman ibn 'Awf à son frère ?",["Qu'on lui montre le marché","La moitié de ses biens","Une maison"],0]},
{t:"La bataille de Badr",
b:"Au Ramadan de la deuxième année après l'Hégire, environ 313 musulmans affrontèrent à Badr une armée d'environ 1 000 hommes de Quraysh. Le Prophète ﷺ passa la nuit en prière, levant les mains jusqu'à ce que son manteau tombe de ses épaules, implorant Allah de Son aide promise. Allah envoya des anges et les musulmans remportèrent une victoire décisive. Abu Jahl, le plus féroce ennemi de l'islam, fut tué. Allah l'appelle le Jour du Discernement, le jour qui sépara la vérité du faux.",
a:"Faites aujourd'hui une longue invocation sincère, les mains levées, comme il le fit à Badr.",
q:["Environ combien de musulmans combattirent à Badr ?",["313","1 000","3 000"],0]},
{t:"La leçon d'Uhud",
b:"La troisième année, Quraysh revint se venger avec environ 3 000 hommes. Le Prophète ﷺ plaça 50 archers sur une colline et leur ordonna de ne pas la quitter quoi qu'il arrive. Les musulmans étaient en train de gagner, mais la plupart des archers descendirent ramasser le butin. Khalid ibn al-Walid, pas encore musulman, attaqua par derrière. Soixante-dix musulmans furent tués, dont Hamza, l'oncle du Prophète ﷺ. Le Prophète ﷺ lui-même fut blessé. Allah révéla que le revers venait de la désobéissance à l'ordre, et Il leur pardonna.",
a:"Pensez à une instruction d'Allah que vous ne suivez que lorsqu'elle est facile. Engagez-vous à la respecter aujourd'hui même si elle vous coûte.",
q:["Pourquoi les musulmans subirent-ils des pertes à Uhud ?",["Les archers quittèrent leur position","Ils étaient moins nombreux qu'à Badr","Ils n'avaient pas de chef"],0]},
{t:"La Tranchée",
b:"La cinquième année, une coalition d'environ 10 000 combattants marcha sur Médine. Les livres de sira rapportent que Salman al-Farisi proposa de creuser une tranchée, une méthode perse inconnue des Arabes. Le Prophète ﷺ creusa avec ses compagnons dans le froid et la faim, portant la terre sur son propre dos. Le siège dura environ un mois. Puis Allah envoya un vent froid et violent et des soldats invisibles, et la coalition abandonna. Le Prophète ﷺ dit ensuite : « Désormais c'est nous qui irons vers eux ; ils ne viendront plus à nous. »",
a:"Lisez la sourate al-Ahzab, versets 9 à 12 et 22 : comment hypocrites et croyants réagirent différemment à la même peur.",
q:["Qui aurait proposé la tranchée ?",["Salman al-Farisi","'Umar","Khalid ibn al-Walid"],0]},
{t:"Le traité d'al-Hudaybiya",
b:"La sixième année, le Prophète ﷺ partit avec environ 1 400 compagnons pour la 'Umra. Quraysh les bloqua à al-Hudaybiya. Les compagnons prêtèrent serment sous un arbre de rester avec lui (Bay'at ar-Ridwan). Un traité fut signé dont les termes semblaient injustes : les musulmans devaient rentrer et revenir l'année suivante, et les Mecquois réfugiés à Médine devaient être rendus. 'Umar fut contrarié. Mais Allah l'appela « une victoire éclatante » : pendant les deux années de paix qui suivirent, plus de gens entrèrent en islam que jamais auparavant.",
a:"Quand une chose ne se passe pas comme vous le voulez aujourd'hui, dites : « Il se peut que vous détestiez une chose alors qu'elle est un bien pour vous » (Coran 2:216).",
q:["Comment Allah a-t-Il appelé le traité d'al-Hudaybiya ?",["Une victoire éclatante","Une épreuve","Une défaite"],0]},
{t:"La conquête de La Mecque",
b:"Quraysh rompit le traité. Au Ramadan de la huitième année, le Prophète ﷺ marcha avec 10 000 hommes et entra à La Mecque presque sans combat, la tête inclinée par humilité sur sa chamelle. Il fit le tour de la Ka'ba et abattit les 360 idoles avec un bâton en récitant : « La Vérité est venue et le faux a disparu. » Les sources de la sira rapportent qu'il pardonna à ceux qui l'avaient persécuté pendant 21 ans, en disant : « Allez, vous êtes libres. »",
a:"Lisez la sourate an-Nasr (110). Sa réponse à la victoire est de glorifier Allah et de demander pardon, non l'orgueil.",
q:["Que récitait-il en abattant les idoles ?",["La Vérité est venue et le faux a disparu","Seulement Allahu Akbar","La sourate al-Fatiha"],0]},
{t:"Tabuk et la sincérité de Ka'b",
b:"La neuvième année, le Prophète ﷺ mena une armée vers Tabuk dans une chaleur extrême. Ka'b ibn Malik, un compagnon sincère, remit son départ à plus tard jusqu'à ce que l'armée parte sans lui. Les hypocrites donnèrent de fausses excuses et furent laissés à Allah. Ka'b dit la vérité : il n'avait aucune excuse. Pendant cinquante jours, il fut demandé aux musulmans de ne pas lui parler. Puis Allah révéla son pardon dans le Coran. Ka'b dit : « Allah ne m'a sauvé que par la sincérité. »",
a:"Si vous devez un aveu honnête à quelqu'un, faites-le aujourd'hui sans excuses.",
q:["Qu'est-ce qui sauva Ka'b ibn Malik ?",["Sa sincérité","Une bonne excuse","Sa richesse"],0]},
{t:"Le pèlerinage d'adieu",
b:"La dixième année, le Prophète ﷺ accomplit son unique Hajj, avec plus de 100 000 personnes. À 'Arafa, il prononça un grand sermon : « Votre sang et vos biens vous sont sacrés les uns envers les autres, comme est sacré ce jour-ci. » Il abolit les vendettas et l'usure de la Jahiliyya, ordonna de bien traiter les femmes et dit : « Je vous ai laissé le Livre d'Allah ; si vous vous y attachez, vous ne vous égarerez pas. » Puis fut révélé le verset : « Aujourd'hui, J'ai parachevé pour vous votre religion. »",
a:"Lisez le résumé du sermon d'adieu (Sahih Muslim 1218) et choisissez une instruction à vivre cette semaine.",
q:["Qu'a-t-il dit avoir laissé pour nous éviter l'égarement ?",["Le Livre d'Allah","Son épée","Sa maison"],0]},
{t:"Sa mort",
b:"En Rabi' al-Awwal de la onzième année (632), à 63 ans, le Prophète ﷺ tomba malade. Il resta dans la chambre de 'A'isha et Abu Bakr dirigea les prières. Ses dernières paroles furent : « Ô Allah, le Compagnon le plus élevé. » Les compagnons furent bouleversés ; 'Umar refusa d'y croire. Abu Bakr arriva, embrassa son visage et dit aux gens : « Quiconque adorait Muhammad, Muhammad est mort. Quiconque adore Allah, Allah est Vivant et ne meurt jamais », puis récita le verset 144 de la sourate Al 'Imran. Il fut enterré dans la chambre de 'A'isha, où se trouve sa tombe aujourd'hui.",
a:"Envoyez aujourd'hui 100 salawat sur le Prophète ﷺ. Son message continue à travers ceux qui le suivent.",
q:["Quelles furent ses dernières paroles ?",["Ô Allah, le Compagnon le plus élevé","Priez, priez","Prenez soin du Coran"],0]}
];

const FR_PEOPLE = [
{t:"Khadija bint Khuwaylid",
b:"Khadija fut la première à croire au Prophète ﷺ, et elle dépensa ses biens et ses forces pour le soutenir pendant les années les plus dures à La Mecque. Jibril vint un jour et dit : « Ô Messager d'Allah, voici Khadija qui arrive avec un plat. Quand elle te rejoindra, transmets-lui le salut de son Seigneur et le mien, et annonce-lui une maison au Paradis faite de perle creuse, où il n'y a ni bruit ni fatigue. » Des années après sa mort, le Prophète ﷺ honorait encore ses amies et parlait d'elle avec amour.",
a:"Honorez quelqu'un qui vous a soutenu quand vous n'aviez rien. Dites-le-lui, ou priez pour lui en le nommant.",
q:["Qui envoya le salam à Khadija par Jibril ?",["Son Seigneur, Allah","Les compagnons","Waraqa"],0]},
{t:"Abu Bakr as-Siddiq",

a:"Donnez aujourd'hui une aumône que vous ressentez, pas une dont vous ne remarquez même pas l'absence.",
q:["Quel était le titre d'Abu Bakr ?",["As-Siddiq, celui qui confirme la vérité","Al-Faruq","Dhu an-Nurayn"],0]},
{t:"'Umar ibn al-Khattab",

{t:"'Uthman ibn 'Affan",
b:"'Uthman était un homme doux, généreux et très pudique. Il épousa deux filles du Prophète ﷺ, Ruqayya puis Umm Kulthum, et fut appelé Dhu an-Nurayn, l'homme aux deux lumières. Le Prophète ﷺ dit : « Ne devrais-je pas éprouver de la pudeur envers un homme devant qui les anges éprouvent de la pudeur ? » Il acheta le puits de Ruma et l'offrit aux musulmans, et équipa une grande partie de l'armée de Tabuk. Troisième calife, il unifia les musulmans sur une copie écrite de référence du Coran.",
a:"Soyez attentif aujourd'hui à la pudeur (haya') dans votre parole, votre regard et votre tenue.",
q:["Quel était le titre de 'Uthman ?",["Dhu an-Nurayn, l'homme aux deux lumières","Sayf Allah","Al-Amin"],0]},
{t:"'Ali ibn Abi Talib",
b:"'Ali était le cousin du Prophète ﷺ, élevé dans sa maison, et l'un des premiers musulmans dès l'enfance. La nuit de l'Hégire, il dormit dans le lit du Prophète ﷺ, sachant que des assassins attendaient dehors. Il épousa Fatima et fut le père d'al-Hasan et d'al-Husayn. À Khaybar, le Prophète ﷺ lui remit l'étendard, disant qu'il irait à un homme qui aime Allah et Son Messager et qu'ils aiment. Il lui dit : « Tu es pour moi ce que Harun était pour Musa, sauf qu'il n'y a pas de prophète après moi. » Il devint le quatrième calife.",
a:"Soyez courageux pour la vérité une fois aujourd'hui : parlez avec douceur là où vous vous taisez d'habitude.",
q:["Où 'Ali dormit-il la nuit de l'Hégire ?",["Dans le lit du Prophète ﷺ","Dans la grotte de Thawr","À la mosquée"],0]},
{t:"Bilal ibn Rabah",
b:"Bilal était un esclave abyssin de La Mecque qui endura la torture en répétant « Ahad, Ahad » jusqu'à ce qu'Abu Bakr l'affranchisse. Pour sa belle voix, le Prophète ﷺ le choisit comme premier muezzin de l'islam. Un jour, le Prophète ﷺ lui demanda : « Dis-moi l'acte dont tu espères le plus, car j'ai entendu tes pas devant moi au Paradis. » Bilal dit : « Chaque fois que je fais mes ablutions, à n'importe quelle heure du jour ou de la nuit, je prie avec ce qu'Allah veut. » Un ancien esclave devint l'un des hommes honorés de l'islam.",
a:"Après chaque ablution aujourd'hui, priez deux courtes rak'as, l'habitude de Bilal.",
q:["De quel acte Bilal espérait-il le plus ?",["Prier après chaque ablution","Jeûner tous les jours","Donner tous ses biens"],0]},
{t:"'A'isha bint Abi Bakr",
b:"'A'isha, fille d'Abu Bakr et épouse du Prophète ﷺ, fut l'une des plus grandes savantes de l'histoire de l'islam. Elle rapporta plus de 2 000 hadiths, et les grands compagnons venaient la consulter sur le fiqh, l'héritage et la vie privée du Prophète ﷺ. Le Prophète ﷺ dit : « La supériorité de 'A'isha sur les autres femmes est comme celle du tharid sur les autres plats. » Quand les hypocrites la calomnièrent, Allah proclama son innocence dans des versets de la sourate an-Nur récités jusqu'au Jour dernier.",
a:"Lisez la sourate an-Nur 24:11–20 et remarquez les règles qu'elle pose contre la propagation des rumeurs.",
q:["Où Allah a-t-Il proclamé l'innocence de 'A'isha ?",["Sourate an-Nur","Sourate al-Ahzab","Sourate Maryam"],0]},
{t:"Fatima az-Zahra'",
b:"Fatima était la plus jeune fille du Prophète ﷺ et de Khadija, épouse de 'Ali et mère d'al-Hasan et d'al-Husayn. Elle ressemblait à son père dans sa démarche et sa façon de parler. Il dit : « Fatima est une partie de moi ; qui la met en colère me met en colère », et lui annonça qu'elle serait la maîtresse des femmes du Paradis. Quand elle lui demanda un serviteur, il lui enseigna plutôt de dire avant de dormir : SubhanAllah 33 fois, Alhamdulillah 33 fois et Allahu Akbar 34 fois, en disant que c'était meilleur pour elle qu'un serviteur.",
a:"Ce soir avant de dormir, dites le tasbih de Fatima : 33 SubhanAllah, 33 Alhamdulillah, 34 Allahu Akbar.",
q:["Qu'enseigna le Prophète ﷺ à Fatima au lieu de lui donner un serviteur ?",["Un dhikr avant de dormir","Une invocation pour la richesse","Jeûner le lundi"],0]},
{t:"Hamza ibn 'Abd al-Muttalib",
b:"Hamza était l'oncle du Prophète ﷺ et aussi son frère de lait. Chasseur robuste, il embrassa l'islam après qu'Abu Jahl eut insulté le Prophète ﷺ, et frappa Abu Jahl de son arc devant Quraysh. Sa conversion donna de la force aux musulmans. On l'appela le Lion d'Allah et il combattit vaillamment à Badr. À Uhud, il fut tué par une lance lancée par Wahshi, un esclave à qui l'on avait promis la liberté. Wahshi embrassa plus tard l'islam, et le Prophète ﷺ l'accepta, tout en lui demandant de ne pas se montrer devant lui.",
a:"L'islam efface ce qui le précède. Ne méprisez personne à cause de son passé.",
q:["Qui tua Hamza à Uhud avant de devenir musulman ?",["Wahshi","Khalid ibn al-Walid","Abu Sufyan"],0]},
{t:"Mus'ab ibn 'Umayr",
b:"Mus'ab était le jeune homme le plus élégant de La Mecque, vêtu des plus beaux habits et des meilleurs parfums. Quand il devint musulman, sa mère le déshérita et il devint pauvre. Le Prophète ﷺ l'envoya enseigner l'islam à Médine, et grâce à lui presque chaque foyer y embrassa l'islam avant l'Hégire. Il porta l'étendard à Uhud et fut tué. Khabbab rapporte que son seul vêtement était si court que lorsqu'il couvrait sa tête ses pieds apparaissaient, alors on couvrit ses pieds avec de l'herbe.",
a:"Renoncez aujourd'hui à un confort pour l'amour d'Allah.",
q:["Quelle fut la mission de Mus'ab à Médine ?",["Enseigner l'islam avant l'Hégire","Commercer","Combattre"],0]},
{t:"Salman al-Farisi",
b:"Salman était un Perse qui quitta le culte du feu de sa famille à la recherche de la vérité. Il servit plusieurs moines chrétiens ; le dernier lui parla d'un prophète qui apparaîtrait en Arabie. Il fut vendu comme esclave et arriva à Médine, où il reconnut le Prophète ﷺ aux signes qu'on lui avait décrits. Le Prophète ﷺ l'aida à racheter sa liberté. Quand la sourate al-Jumu'a fut révélée, le Prophète ﷺ posa la main sur Salman et dit : « Si la foi était aux Pléiades, des hommes de ce peuple l'atteindraient. »",
a:"Demandez sincèrement à Allah : « Ô Allah, montre-moi la vérité comme vérité et aide-moi à la suivre. »",
q:["Que cherchait Salman ?",["La vraie religion","La richesse","Une patrie"],0]},
{t:"Abu Hurayra",
b:"Abu Hurayra embrassa l'islam vers la septième année après l'Hégire et resta auprès du Prophète ﷺ, souvent affamé, parmi les pauvres de la mosquée (ahl as-Suffa). En environ quatre ans, il mémorisa plus de hadiths que quiconque, environ 5 000 récits. Il expliqua que les émigrés étaient occupés au marché et les Ansar par leurs champs, tandis que lui restait avec le Prophète ﷺ. Il se plaignit un jour d'oublier ; le Prophète ﷺ lui dit d'étendre son manteau, fit un geste dedans, et depuis il n'oublia plus.",
a:"Choisissez un court hadith de cette application et apprenez-le mot à mot aujourd'hui.",
q:["Pourquoi Abu Hurayra rapporta-t-il autant de hadiths ?",["Il restait constamment auprès du Prophète ﷺ","Il était le plus âgé des compagnons","Il écrivait des livres"],0]},
{t:"'Abdullah ibn Mas'ud",
b:"Ibn Mas'ud était un pauvre berger devenu l'un des plus grands récitateurs et savants du Coran. Il fut le premier à réciter le Coran à voix haute près de la Ka'ba et fut battu pour cela. Le Prophète ﷺ lui demanda : « Récite-moi. » Il dit : « Te réciter alors qu'il t'a été révélé ? » Il répondit : « J'aime l'entendre d'un autre. » Il récita la sourate an-Nisa' jusqu'au verset 41, et le Prophète ﷺ dit « Assez », les yeux pleins de larmes.",
a:"Écoutez une récitation du verset 41 de la sourate an-Nisa' et méditez-le.",
q:["Que se passa-t-il au verset 41 d'an-Nisa' ?",["Les yeux du Prophète ﷺ se remplirent de larmes","Le Prophète ﷺ le corrigea","Les compagnons partirent"],0]},
{t:"'Abdullah ibn 'Abbas",
b:"Ibn 'Abbas était le jeune cousin du Prophète ﷺ. Le Prophète ﷺ pria pour lui : « Ô Allah, enseigne-lui le Livre. » Il devint connu comme l'interprète du Coran. Enfant, monté derrière le Prophète ﷺ, il entendit : « Préserve Allah, Il te préservera. Préserve Allah, tu Le trouveras devant toi. Quand tu demandes, demande à Allah ; quand tu cherches de l'aide, cherche-la auprès d'Allah. Sache que si toute la communauté s'unissait pour te faire du bien, elle ne te ferait que le bien qu'Allah t'a destiné. »",
a:"Mémorisez : « Ihfadh Allaha yahfadhk » (Préserve Allah, Il te préservera).",
q:["Comment Ibn 'Abbas était-il connu ?",["L'interprète du Coran","Le Sabre d'Allah","Le premier muezzin"],0]},
{t:"Mu'adh ibn Jabal",
b:"Mu'adh embrassa l'islam jeune à Médine et devint un grand savant. Le Prophète ﷺ dit qu'il était le plus savant de la communauté sur le licite et l'illicite, et l'envoya au Yémen comme enseignant et juge, lui disant de commencer par le tawhid, puis la prière, puis la zakat. Un jour, le Prophète ﷺ lui prit la main et dit : « Ô Mu'adh, par Allah je t'aime. Ne manque pas de dire après chaque prière : Allahumma a'inni 'ala dhikrika wa shukrika wa husni 'ibadatik. »",
en:"Ô Allah, aide-moi à T'invoquer, à Te remercier et à bien T'adorer.",
a:"Dites cette invocation après chacune des cinq prières d'aujourd'hui.",
q:["Où le Prophète ﷺ envoya-t-il Mu'adh ?",["Au Yémen","En Syrie","En Abyssinie"],0]},
{t:"Khalid ibn al-Walid",
b:"Khalid fut le commandant dont l'attaque renversa la bataille d'Uhud contre les musulmans. Il embrassa l'islam avant la conquête de La Mecque. À la bataille de Mu'ta, après la mort des trois commandants désignés, il prit l'étendard et sauva l'armée. Le Prophète ﷺ l'annonça à Médine : « Puis un sabre parmi les sabres d'Allah prit l'étendard, jusqu'à ce qu'Allah leur donne la victoire. » Il fut connu comme Sayf Allah, le Sabre d'Allah. Allah fit de l'un des plus redoutables adversaires de l'islam l'un de ses grands défenseurs.",
a:"Ne désespérez jamais de la guidée de quiconque, y compris de la vôtre. Invoquez pour une personne éloignée de l'islam.",
q:["Quel titre Khalid reçut-il ?",["Sayf Allah, le Sabre d'Allah","Asad Allah, le Lion d'Allah","Al-Faruq"],0]},
{t:"Abu 'Ubayda ibn al-Jarrah",
b:"Abu 'Ubayda fut l'un des dix à qui le Paradis fut promis. Il était doux, humble et d'une loyauté totale. Quand les gens de Najran demandèrent qu'on leur envoie un homme sûr, le Prophète ﷺ dit : « Je vous enverrai un homme vraiment digne de confiance », et envoya Abu 'Ubayda. Il dit : « Chaque communauté a son homme de confiance, et celui de cette communauté est Abu 'Ubayda. » Il commanda plus tard les armées musulmanes en Syrie et y mourut lors de la peste d'Amwas, refusant de quitter ses soldats.",
a:"Soyez digne de confiance dans une petite chose aujourd'hui : rendez un objet emprunté, gardez un secret ou arrivez à l'heure.",
q:["Comment Abu 'Ubayda était-il appelé ?",["L'homme de confiance de cette communauté","Le savant de la communauté","Le poète de l'islam"],0]},
{t:"'Ammar ibn Yasir",
b:"'Ammar était le fils de Yasir et de Sumayya, les premiers martyrs de l'islam. Sous la torture, on le força à prononcer des paroles contre le Prophète ﷺ. Il vint en pleurant. Le Prophète ﷺ demanda : « Comment trouves-tu ton cœur ? » Il dit : « Apaisé par la foi. » Allah révéla que celui qui est contraint de prononcer la mécréance alors que son cœur reste ferme dans la foi n'est pas blâmé. 'Ammar aida ensuite à construire la mosquée du Prophète ﷺ, portant deux briques quand les autres en portaient une.",
a:"Allah juge le cœur. Renouvelez votre intention pour vos actes quotidiens dès le début de la journée.",
q:["Qu'a-t-il été révélé au sujet de 'Ammar ?",["Celui qui est contraint, le cœur ferme, n'est pas blâmé","Il devait répéter la shahada en public","Il devait émigrer"],0]},
{t:"Asma' bint Abi Bakr",
b:"Asma', fille d'Abu Bakr, aida l'Hégire en secret. Enceinte, elle apportait nourriture et eau à la grotte de Thawr. N'ayant rien pour attacher le sac de provisions, elle déchira sa ceinture en deux et en utilisa une moitié. Le Prophète ﷺ l'appela Dhat an-Nitaqayn, la femme aux deux ceintures. Quand Abu Jahl la gifla pour qu'elle révèle où était son père, elle garda le silence. Elle vécut jusqu'à environ 100 ans, l'esprit vif.",
a:"Aidez aujourd'hui une bonne cause de façon concrète et discrète.",
q:["Comment Asma' était-elle appelée ?",["La femme aux deux ceintures","La mère des croyants","La première savante"],0]},
{t:"Anas ibn Malik",
b:"Anas fut amené par sa mère pour servir le Prophète ﷺ vers l'âge de dix ans. Il le servit dix ans à Médine. Il dit : « Il ne m'a jamais dit 'uff', et il ne m'a jamais demandé, pour une chose que j'avais faite, 'Pourquoi as-tu fait cela ?', ni pour une chose que je n'avais pas faite, 'Pourquoi ne l'as-tu pas faite ?' » Le Prophète ﷺ pria pour qu'il ait beaucoup de biens et d'enfants et qu'ils soient bénis ; il vécut longtemps et devint un grand transmetteur de hadiths.",
a:"Aujourd'hui, ne critiquez personne qui travaille pour vous ou vous aide. Remerciez-le plutôt.",
q:["Combien de temps Anas servit-il le Prophète ﷺ ?",["Dix ans","Trois ans","Vingt ans"],0]},
{t:"Adam, le premier homme",
b:"Allah annonça aux anges qu'Il allait établir un successeur (khalifa) sur terre. Il créa Adam d'argile, lui enseigna les noms de toutes choses et ordonna aux anges de se prosterner. Iblis refusa par orgueil : « Je suis meilleur que lui. » Adam et Hawwa' vécurent au Jardin, mais Shaytan les incita à manger de l'arbre interdit. Contrairement à Iblis, ils ne discutèrent pas. Ils se repentirent aussitôt avec des paroles qu'Allah leur enseigna, et Allah leur pardonna. Première leçon de l'humanité : nous commettons des erreurs, et nous revenons à Allah.",
en:"Notre Seigneur, nous nous sommes fait du tort à nous-mêmes. Si Tu ne nous pardonnes pas et ne nous fais pas miséricorde, nous serons certes parmi les perdants.",
a:"Mémorisez l'invocation d'Adam (Coran 7:23) et dites-la après votre prochaine erreur.",
q:["Quel fut le péché d'Iblis ?",["L'orgueil","Manger de l'arbre","Le mensonge"],0]},
{t:"Nuh et l'Arche",
b:"Nuh appela son peuple à adorer Allah seul pendant 950 ans, de nuit et de jour, en public et en privé. Peu crurent. Allah lui ordonna de construire l'Arche, et son peuple se moqua de lui. Quand vint le déluge, Nuh appela son fils à monter, mais celui-ci dit qu'il grimperait sur une montagne. Une vague les sépara. Nuh interrogea Allah au sujet de son fils, et Allah lui enseigna que la vraie famille est dans la foi et les bonnes œuvres. Leçon : continuez d'appeler au bien avec patience et laissez le résultat à Allah.",
a:"Lisez la sourate Nuh (71) et notez les différentes façons dont il appela son peuple.",
q:["Combien de temps Nuh appela-t-il son peuple ?",["950 ans","40 ans","100 ans"],0]},
{t:"Ibrahim, l'ami intime d'Allah",
b:"Jeune homme, Ibrahim remit en question les idoles de son peuple. Il les brisa, laissant la plus grande, et dit : « Interrogez-les, si elles peuvent parler. » Son peuple le jeta dans un immense feu, et Allah dit : « Ô feu, sois fraîcheur et salut pour Ibrahim. » Plus tard, Allah l'éprouva par l'ordre de sacrifier son fils Isma'il. Tous deux se soumirent, et Allah racheta Isma'il par un sacrifice immense, commémoré chaque Aïd al-Adha (la Tabaski). Allah prit Ibrahim pour khalil, ami intime.",
a:"Renoncez aujourd'hui à une chose que vous aimez pour Allah. Ibrahim était prêt à tout donner.",
q:["Que dit Allah au feu ?",["Sois fraîcheur et salut pour Ibrahim","Éteins-toi","Brûle les idoles"],0]},
{t:"Musa et Pharaon",
b:"Musa naquit quand Pharaon faisait tuer les nouveau-nés garçons des Banu Isra'il. Sa mère le déposa dans un panier sur le fleuve, et il grandit dans le palais même de Pharaon. Plus tard, Allah lui parla près de la montagne et l'envoya vers Pharaon. Musa se sentit faible et demanda à Allah de lui ouvrir la poitrine, de lui faciliter sa tâche et de délier sa langue. Quand l'armée de Pharaon les coinça devant la mer, son peuple dit : « Nous allons être rattrapés ! » Musa dit : « Jamais ! Mon Seigneur est avec moi, Il va me guider. » La mer s'ouvrit.",
en:"Seigneur, ouvre-moi ma poitrine, facilite-moi ma tâche et dénoue le nœud de ma langue, afin qu'ils comprennent mes paroles.",
a:"Dites l'invocation de Musa avant votre conversation ou votre tâche la plus difficile aujourd'hui.",
q:["Que dit Musa, coincé devant la mer ?",["Mon Seigneur est avec moi, Il va me guider","Nous sommes perdus","Rendons-nous"],0]},
{t:"Yusuf, patience et pureté",
b:"Yusuf fut jeté dans un puits par ses frères jaloux, vendu comme esclave en Égypte, tenté par l'épouse de son maître, et emprisonné des années bien qu'innocent. Il préféra la prison au péché. Même en prison, il continua d'appeler à Allah. Allah l'éleva jusqu'à la charge des greniers d'Égypte. Quand ses frères vinrent mendier, il leur pardonna : « Pas de reproche contre vous aujourd'hui. » Son père Ya'qub, qui perdit la vue de chagrin, dit : « Je ne me plains qu'à Allah de mon affliction », et l'appela une belle patience.",
a:"Quand vous êtes triste aujourd'hui, plaignez-vous uniquement à Allah dans l'invocation, pas aux gens.",
q:["Que dit Yusuf à ses frères ?",["Pas de reproche contre vous aujourd'hui","Vous serez punis","Quittez l'Égypte"],0]},
{t:"Maryam et 'Isa",
b:"Maryam se consacra à l'adoration dès l'enfance, et Allah la choisit au-dessus des femmes des mondes. L'ange lui annonça un fils sans père, comme Allah créa Adam sans père ni mère. Le bébé 'Isa parla au berceau : « Je suis le serviteur d'Allah. Il m'a donné le Livre et m'a désigné prophète. » Les musulmans croient que 'Isa est un grand messager et le Messie, non le fils de Dieu, qu'il ne fut pas crucifié mais élevé auprès d'Allah, et qu'il reviendra avant le Jour dernier.",
a:"Lisez la sourate Maryam 19:16–36. C'est le récit islamique de la naissance de 'Isa.",
q:["Quelles furent les premières paroles du bébé 'Isa ?",["Je suis le serviteur d'Allah","Je suis le fils de Dieu","Que la paix soit sur vous"],0]}

const FR_DUA = [
{t:"L'invocation est une adoration",
b:"Le du'a, c'est appeler Allah : demander, remercier, se plaindre, espérer. Le Prophète ﷺ a dit : « L'invocation est l'adoration », puis il a récité : « Votre Seigneur a dit : Invoquez-Moi, Je vous répondrai. » Vous pouvez invoquer dans n'importe quelle langue, à tout moment, pour toute chose licite, grande ou petite. Il n'y a aucun intermédiaire : « Quand Mes serviteurs t'interrogent sur Moi, Je suis tout proche. Je réponds à l'appel de celui qui M'invoque. » Chaque invocation est exaucée de l'une de trois façons : vous obtenez ce que vous avez demandé, un mal est écarté de vous, ou elle vous est gardée pour l'au-delà.",
a:"Faites aujourd'hui une invocation personnelle, dans votre propre langue, pour trois choses précises.",

{t:"Comment invoquer",

a:"Structurez votre invocation aujourd'hui : 1) Louange d'Allah 2) Salawat 3) Vos demandes 4) Salawat de nouveau, puis Amine.",

{t:"Les meilleurs moments pour invoquer",

{t:"Les salawat sur le Prophète ﷺ",

en:"Ô Allah, prie sur Muhammad et sur la famille de Muhammad comme Tu as prié sur Ibrahim et sur la famille d'Ibrahim ; Tu es certes Digne de louange et de gloire. Ô Allah, bénis Muhammad et la famille de Muhammad comme Tu as béni Ibrahim et la famille d'Ibrahim ; Tu es certes Digne de louange et de gloire.",
a:"Mémorisez la salat ibrahimiyya complète et vérifiez que vous la dites correctement dans votre prière.",

{t:"L'invocation la plus complète",
b:"Anas a dit que l'invocation que le Prophète ﷺ faisait le plus souvent était ce verset du Coran. Il demande tout le bien des deux vies en très peu de mots : le bien dans ce monde (santé, famille, subsistance, science, un bon conjoint), le bien dans l'au-delà (pardon, Paradis), et la protection contre le Feu. On le récite aussi entre l'angle yéménite et la Pierre noire pendant le tawaf.",
en:"Notre Seigneur, accorde-nous une belle part ici-bas et une belle part dans l'au-delà, et protège-nous du châtiment du Feu.",

{t:"Le maître des demandes de pardon",
b:"Le Prophète ﷺ a appelé cette invocation Sayyid al-Istighfar, le maître des demandes de pardon. Il a dit : « Celui qui la dit le jour avec une foi ferme et meurt ce jour-là avant le soir sera parmi les gens du Paradis. Celui qui la dit la nuit avec une foi ferme et meurt avant le matin sera parmi les gens du Paradis. » Elle réunit le tawhid, l'engagement envers Allah, la reconnaissance de Ses bienfaits et l'aveu de nos péchés.",
en:"Ô Allah, Tu es mon Seigneur, il n'y a de dieu que Toi. Tu m'as créé et je suis Ton serviteur. Je respecte Ton engagement et Ta promesse autant que je le peux. Je cherche refuge auprès de Toi contre le mal que j'ai commis. Je reconnais Tes bienfaits envers moi et je reconnais mon péché ; pardonne-moi donc, car nul ne pardonne les péchés en dehors de Toi.",
a:"Dites Sayyid al-Istighfar une fois le matin et une fois le soir. Commencez à l'apprendre aujourd'hui, une ligne par jour.",
q:["Que promet-on à celui qui la dit le matin avec foi et meurt avant le soir ?",["D'être parmi les gens du Paradis","La richesse","Une longue vie"],0]},
{t:"La protection du matin et du soir",
b:"'Uthman ibn 'Affan rapporte que le Prophète ﷺ a dit : celui qui dit ceci trois fois le matin ne sera pas frappé d'un malheur soudain jusqu'au soir, et celui qui le dit trois fois le soir ne sera pas frappé d'un malheur soudain jusqu'au matin. Cela prend environ 15 secondes. Cela fait partie des adhkar du matin et du soir, à dire de préférence après le Fajr et après le 'Asr ou le Maghrib.",
en:"Au nom d'Allah, avec le nom de qui rien ne peut nuire sur terre ni dans le ciel, et Il est l'Audient, l'Omniscient.",
a:"Dites-le 3 fois maintenant (le matin), et mettez un rappel pour le dire 3 fois ce soir.",
q:["Combien de fois le dit-on ?",["Trois fois matin et soir","Une fois par jour","Sept fois"],0]},
{t:"Ayat al-Kursi et la fin d'al-Baqara",
b:"Ayat al-Kursi (2:255) est le plus grand verset du Coran. Abu Hurayra gardait la zakat quand un voleur vint trois nuits de suite. Le voleur lui enseigna : récite Ayat al-Kursi en te couchant, un gardien d'Allah restera avec toi et Shaytan ne t'approchera pas jusqu'au matin. Le Prophète ﷺ dit : « Il t'a dit la vérité, bien qu'il soit menteur. C'était Shaytan. » Il dit aussi que celui qui récite les deux derniers versets d'al-Baqara (2:285–286) la nuit, ils lui suffiront.",
a:"Ce soir au lit, récitez Ayat al-Kursi et les deux derniers versets d'al-Baqara. Commencez à les mémoriser si ce n'est pas déjà fait.",
q:["Qui enseigna à Abu Hurayra la lecture d'Ayat al-Kursi avant de dormir ?",["Shaytan, et le Prophète ﷺ l'a confirmé","Un ange","'Umar"],0]},
{t:"Avant de dormir et au réveil",
b:"Hudhayfa rapporte que lorsque le Prophète ﷺ se couchait, il mettait sa main sous sa joue et disait la première invocation ci-dessous. Au réveil, il disait la seconde. Le sommeil est appelé la petite mort ; chaque matin est donc une nouvelle vie qui nous est donnée. Autres sunnas avant de dormir : les ablutions, se coucher sur le côté droit, le tasbih de Fatima, Ayat al-Kursi, et souffler dans ses mains après avoir récité al-Ikhlas, al-Falaq et an-Nas, puis s'essuyer le corps.",
en:"C'est en Ton nom, ô Allah, que je meurs et que je vis. — Louange à Allah qui nous a redonné la vie après nous avoir fait mourir, et c'est vers Lui la résurrection.",
a:"Dites l'invocation du réveil demain avant de toucher votre téléphone.",
q:["À quoi le sommeil est-il comparé ?",["À une petite mort","À un voyage","À une prière"],0]},
{t:"Sortir et entrer chez soi",

en:"Au nom d'Allah, je place ma confiance en Allah, et il n'y a de force ni de puissance qu'en Allah.",

{t:"Entrer aux toilettes et en sortir",

en:"Ô Allah, je cherche refuge auprès de Toi contre le mal et les êtres malfaisants (démons mâles et femelles).",
a:"Utilisez cette invocation à chaque fois aujourd'hui, et dites « Ghufranak » en sortant.",
q:["Que dit-on en sortant des toilettes ?",["Ghufranak","Bismillah","Seulement Alhamdulillah"],0]},
{t:"Les bonnes manières du repas",
b:"Le Prophète ﷺ dit au jeune 'Umar ibn Abi Salama : « Dis Bismillah, mange de ta main droite, et mange de ce qui est devant toi. » Si vous oubliez Bismillah au début, dites : « Bismillahi awwalahu wa akhirahu » (Au nom d'Allah au début et à la fin). Ne critiquez jamais la nourriture : s'il l'aimait il la mangeait, sinon il la laissait. Après le repas, dites l'invocation ci-dessous ; il a dit que celui qui la dit voit ses péchés passés pardonnés.",
en:"Louange à Allah qui m'a nourri de ceci et me l'a accordé sans aucune force ni puissance de ma part.",

{t:"Contre le souci et la tristesse",

en:"Ô Allah, je cherche refuge auprès de Toi contre le souci et la tristesse, contre l'incapacité et la paresse, contre la lâcheté et l'avarice, et contre le poids des dettes et la domination des hommes.",
a:"Mémorisez-la aujourd'hui, paire par paire. Dites-la quand le stress arrive.",

{t:"L'invocation dans la détresse",

en:"Il n'y a de dieu que Toi. Gloire à Toi. J'ai été certes parmi les injustes.",

{t:"La prière de consultation (istikhara)",
b:"Jabir a dit que le Prophète ﷺ leur enseignait l'istikhara pour toutes les affaires comme il leur enseignait une sourate du Coran. Face à une décision (travail, mariage, déménagement, achat), priez deux rak'as surérogatoires, puis faites l'invocation. Vous demandez à Allah de décréter la chose si elle est bonne pour votre religion, votre vie et son issue, et de l'écarter si elle est mauvaise. Puis agissez et faites confiance à Allah. L'istikhara n'est pas l'attente d'un rêve ; Allah facilite ou bloque l'affaire. Consultez aussi des gens sages.",
en:"Ô Allah, je Te demande de me guider par Ta science, de m'en rendre capable par Ta puissance, et je Te demande de Ta grâce immense. Car Tu peux et je ne peux pas, Tu sais et je ne sais pas, et Tu es le Grand Connaisseur de l'invisible... (texte complet dans al-Bukhari 1162).",
a:"Lisez l'invocation complète dans Sahih al-Bukhari 1162 et enregistrez-la sur votre téléphone pour votre prochaine décision.",
q:["Combien de rak'as prie-t-on avant l'invocation de l'istikhara ?",["Deux rak'as surérogatoires","Quatre","Aucune"],0]},
{t:"Quand le malheur frappe",

en:"Nous appartenons à Allah et c'est vers Lui que nous retournons. Ô Allah, récompense-moi dans mon malheur et remplace-le-moi par quelque chose de meilleur.",

q:["Qui Allah donna-t-Il à Umm Salama après cette invocation ?",["Le Prophète ﷺ pour époux","Une grande richesse","Un fils"],0]},
{t:"L'invocation pour ses parents",
b:"Allah nous ordonne d'abaisser l'aile de l'humilité devant nos parents et de prier pour eux. Le Coran enseigne l'invocation ci-dessous. Ibrahim pria aussi : « Notre Seigneur, pardonne-moi, ainsi qu'à mes parents et aux croyants, le Jour où se dressera le compte. » Votre invocation parvient à vos parents, qu'ils soient vivants ou morts : « Quand l'homme meurt, ses œuvres cessent sauf trois : une aumône continue, une science utile, ou un enfant vertueux qui prie pour lui. »",
en:"Seigneur, fais-leur miséricorde comme ils m'ont élevé quand j'étais petit.",
a:"Dites cette invocation pour vos parents après chaque prière aujourd'hui. S'ils sont vivants, appelez-les.",

{t:"Invoquer pour autrui en son absence",

a:"Priez aujourd'hui, en les nommant, pour cinq personnes qui ne savent pas que vous priez pour elles.",
q:["Que dit l'ange quand vous priez pour votre frère en son absence ?",["Amine, et à toi de même","Prie d'abord pour toi","Rien"],0]},
{t:"L'invocation du voyage",

en:"Gloire à Celui qui a mis ceci à notre service, alors que nous n'aurions jamais pu le faire nous-mêmes. Et c'est vers notre Seigneur que nous retournerons.",

{t:"L'éternuement et le bâillement",
b:"Le Prophète ﷺ a dit : « Quand l'un de vous éternue, qu'il dise : Alhamdulillah. Son frère doit lui dire : Yarhamukallah (qu'Allah te fasse miséricorde). Puis il répond : Yahdikumullahu wa yuslihu balakum (qu'Allah vous guide et améliore votre état). » Répondre à l'éternuement est l'un des droits du musulman sur un autre, s'il a loué Allah. Le bâillement vient de Shaytan : retenez-le autant que possible et couvrez votre bouche.",

{t:"Deux paroles légères, lourdes dans la Balance",
b:"Le dernier hadith du Sahih al-Bukhari : « Deux paroles légères sur la langue, lourdes dans la Balance, aimées du Tout Miséricordieux : SubhanAllahi wa bihamdihi, SubhanAllahil-'Azim. » Il a dit aussi : celui qui dit « SubhanAllahi wa bihamdihi » 100 fois par jour voit ses péchés effacés, même s'ils sont comme l'écume de la mer. Le dhikr ne coûte rien et peut se faire en marchant, en conduisant ou en attendant.",

{t:"Un trésor du Paradis",

{t:"Après chaque prière",
b:"Thawban a dit que lorsque le Prophète ﷺ terminait la prière, il disait trois fois Astaghfirullah, puis la première invocation ci-dessous. Abu Hurayra rapporte : celui qui dit SubhanAllah 33 fois, Alhamdulillah 33 fois et Allahu Akbar 33 fois après chaque prière, et complète la centaine par « La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamdu wa huwa 'ala kulli shay'in qadir », ses péchés sont pardonnés même s'ils sont comme l'écume de la mer.",
en:"Je demande pardon à Allah (3 fois). Ô Allah, Tu es la Paix et de Toi vient la paix. Béni sois-Tu, ô Détenteur de la majesté et de la générosité.",

q:["Qu'est-ce qui complète la centaine après les 33/33/33 ?",["La ilaha illallahu wahdahu la sharika lah...","Encore un Allahu Akbar","La sourate al-Fatiha"],0]},
{t:"Les trois Qul pour la protection",
b:"Le Prophète ﷺ a dit que personne n'a cherché refuge avec quelque chose de comparable à al-Falaq et an-Nas. Il dit à 'Abdullah ibn Khubayb de réciter al-Ikhlas, al-Falaq et an-Nas trois fois matin et soir, et qu'elles lui suffiraient contre toute chose. 'A'isha rapporte que chaque nuit avant de dormir, il joignait ses mains, y récitait les trois sourates, et s'essuyait autant de son corps qu'il pouvait, trois fois.",

{t:"L'invocation de Laylat al-Qadr",

en:"Ô Allah, Tu es Celui qui pardonne et Tu aimes le pardon, alors pardonne-moi.",

const FR_WORSHIP = [

{t:"Les cinq piliers",

a:"Écrivez les cinq piliers et notez-vous honnêtement de 1 à 5 sur chacun. Choisissez-en un à améliorer ce mois-ci.",
q:["Sur combien de piliers l'islam est-il bâti ?",["Cinq","Six","Sept"],0]},
{t:"Le tawhid, l'unicité d'Allah",

{t:"Le shirk et l'ostentation",
b:"Le shirk consiste à donner une part de l'adoration à autre qu'Allah : prier les morts, demander secours aux saints, croire qu'une amulette protège, ou jurer par autre qu'Allah. C'est le seul péché qu'Allah ne pardonne pas si l'on meurt dessus sans repentir. Il existe aussi un shirk caché ou mineur : la riya', faire de bonnes œuvres pour être vu. Dans un hadith qudsi, Allah dit : « Je suis Celui qui se passe le plus des associés. Quiconque fait une œuvre en M'associant quelqu'un, Je le laisse, lui et son association. »",
a:"Faites aujourd'hui une bonne action que personne ne connaîtra jamais.",
q:["Qu'est-ce que la riya' ?",["Faire de bonnes œuvres pour être vu des gens","Manquer une prière","Être pauvre"],0]},
{t:"La croyance aux anges",
b:"Les anges sont créés de lumière, ne désobéissent jamais à Allah et font ce qui leur est ordonné. Jibril apporte la révélation. Mika'il est chargé de la pluie et des plantes. Israfil soufflera dans la Trompe. L'Ange de la mort reprend les âmes. Deux anges enregistrent chaque parole et chaque acte. D'autres nous gardent, et Munkar et Nakir interrogent le mort dans la tombe, comme décrit dans le hadith. Savoir que les anges enregistrent doit changer notre façon de parler et d'agir.",
a:"Avant de parler aujourd'hui, pensez aux deux scribes : « Il ne prononce pas une parole sans avoir près de lui un observateur prêt à l'inscrire » (Coran 50:18).",
q:["De quoi les anges sont-ils créés ?",["De lumière","De feu","D'argile"],0]},
{t:"La croyance aux Livres",
b:"Les musulmans croient en tous les livres révélés par Allah : les Feuillets d'Ibrahim, la Tawrah à Musa, le Zabur à Dawud, l'Injil à 'Isa, et le Coran à Muhammad ﷺ. Les livres antérieurs ont été modifiés au fil du temps ; le Coran est protégé par Allah Lui-même : « C'est Nous qui avons fait descendre le Rappel, et c'est Nous qui en sommes les gardiens. » Il est aujourd'hui le même, lettre par lettre, que celui que récitait le Prophète ﷺ, préservé par écrit et dans la mémoire de millions de personnes. Il a dit : « Le meilleur d'entre vous est celui qui apprend le Coran et l'enseigne. »",
a:"Apprenez aujourd'hui un nouveau verset avec son sens, et enseignez-le à quelqu'un.",
q:["Qui protège le Coran de toute altération ?",["Allah Lui-même","Seulement les savants","Personne"],0]},
{t:"La croyance aux messagers",
b:"Allah a envoyé des messagers à chaque peuple, tous avec le même message : adorer Allah seul. Le Coran nomme 25 prophètes, dont Adam, Nuh, Ibrahim, Musa, 'Isa et Muhammad ﷺ. Les cinq « doués de résolution » (ulul-'azm) sont Nuh, Ibrahim, Musa, 'Isa et Muhammad ﷺ. Les musulmans les aiment et les respectent tous et ne font aucune distinction dans la foi en eux. Muhammad ﷺ est le Sceau des prophètes : il n'y a pas de prophète après lui.",
a:"Apprenez les noms des cinq messagers doués de résolution.",
q:["Qui est le Sceau des prophètes ?",["Muhammad ﷺ","'Isa","Ibrahim"],0]},
{t:"Le Jour dernier",
b:"Ce monde prendra fin. On soufflera dans la Trompe, tous mourront, puis chacun sera ressuscité et rassemblé. Chacun recevra son livre des œuvres, dans la main droite ou la gauche. Les œuvres seront pesées sur la Balance (al-Mizan), et personne ne sera lésé, ne serait-ce du poids d'un grain de moutarde. Puis vient le pont (as-Sirat) au-dessus de l'Enfer. « Quiconque fait un bien du poids d'un atome le verra, et quiconque fait un mal du poids d'un atome le verra. »",
a:"Lisez la sourate az-Zalzala (99). Faites aujourd'hui une petite bonne action en vous rappelant qu'un atome compte.",
q:["Quelle taille de bonne action sera vue le Jour dernier ?",["Le poids d'un atome","Seulement les grandes actions","Seulement les obligations"],0]},
{t:"Al-Qadar, le destin",
b:"La croyance au qadar comporte quatre éléments : Allah sait toute chose ; Il a tout écrit dans la Table gardée 50 000 ans avant de créer les cieux et la terre ; rien n'arrive sans Sa volonté ; et Il a tout créé, y compris nos actes. Cela n'annule ni notre choix ni notre responsabilité. Le Prophète ﷺ a dit : « Recherche ce qui t'est utile, demande l'aide d'Allah et ne baisse pas les bras. Si une chose t'atteint, ne dis pas : 'Si seulement j'avais fait...', mais dis : Qaddarallahu wa ma sha'a fa'al (Allah a décrété, et Il a fait ce qu'Il a voulu). »",
a:"Remplacez « si seulement » par « Qaddarallahu wa ma sha'a fa'al » chaque fois que quelque chose tourne mal aujourd'hui.",
q:["Que faut-il dire au lieu de « si seulement j'avais... » ?",["Qaddarallahu wa ma sha'a fa'al","Inshallah","Bismillah"],0]},
{t:"Le Paradis et l'Enfer",
b:"Dans un hadith qudsi, Allah dit : « J'ai préparé pour Mes serviteurs vertueux ce qu'aucun œil n'a vu, ce qu'aucune oreille n'a entendu et ce qu'aucun cœur n'a imaginé. » La plus grande joie du Paradis est de voir Allah. L'Enfer est réel : son feu est soixante-dix fois plus chaud que le feu de ce monde. Allah décrit les deux pour nous donner espoir et crainte en équilibre, comme les deux ailes d'un oiseau. Le Prophète ﷺ a dit : « Le Paradis est entouré de choses pénibles et l'Enfer est entouré de désirs. »",
a:"Lisez la sourate al-Insan 76:11–22, une description du Paradis.",
q:["De quoi le Paradis est-il entouré ?",["De choses pénibles","De désirs","De murs d'or"],0]},
{t:"Les actes ne valent que par les intentions",
b:"Le premier hadith du Sahih al-Bukhari : « Les actes ne valent que par les intentions, et chacun n'aura que ce qu'il a eu l'intention de faire. » Un même acte peut être une adoration ou ne rien valoir selon l'intention. Manger, dormir et travailler deviennent adoration quand on les fait pour obéir à Allah et prendre des forces pour le bien. Renouveler son intention ne coûte rien et multiplie la récompense. Les savants disent que ce hadith représente un tiers de l'islam.",
a:"Avant chacune de vos tâches ordinaires aujourd'hui (travail, repas, sommeil), formulez consciemment une intention pour Allah.",
q:["Quel hadith ouvre le Sahih al-Bukhari ?",["Les actes ne valent que par les intentions","L'islam est bâti sur cinq","La religion est le bon conseil"],0]},
{t:"Comment faire les ablutions (wudu')",
b:"Les ablutions sont exigées pour la prière. Actes obligatoires selon le Coran : laver le visage, laver les bras jusqu'aux coudes inclus, passer les mains mouillées sur la tête, et laver les pieds jusqu'aux chevilles incluses. Méthode de la Sunna telle que montrée par 'Uthman : intention, Bismillah, laver les mains 3 fois, rincer la bouche et le nez 3 fois, le visage 3 fois, le bras droit puis le gauche 3 fois, essuyer la tête une fois (d'avant en arrière puis retour), essuyer les oreilles, puis le pied droit et le gauche 3 fois. Les péchés partent avec l'eau. Dites ensuite la shahada.",
en:"J'atteste qu'il n'y a de dieu qu'Allah, Seul, sans associé, et j'atteste que Muhammad est Son serviteur et Son messager.",
a:"Faites vos prochaines ablutions lentement selon la Sunna, et dites la shahada ensuite.",
q:["Jusqu'où lave-t-on les bras ?",["Jusqu'aux coudes inclus","Jusqu'aux poignets","Jusqu'aux épaules"],0]},
{t:"Le grand lavage (ghusl) et le tayammum",
b:"Le ghusl (lavage rituel complet) est obligatoire après un rapport sexuel ou une éjaculation, après les règles et les lochies, et il est sunna le vendredi et pour les deux Aïds. 'A'isha a décrit le ghusl du Prophète ﷺ : laver les mains, laver les parties intimes, faire les ablutions, verser de l'eau sur la tête trois fois en passant les doigts dans les cheveux, puis verser de l'eau sur tout le corps. S'il n'y a pas d'eau, ou si son usage vous nuirait, faites le tayammum : frapper de la terre propre avec les mains, puis essuyer le visage et les mains.",
a:"Révisez les étapes du ghusl. En cas de doute sur les règles de purification, interrogez un savant de confiance près de chez vous.",
q:["Quand le tayammum est-il permis ?",["Quand il n'y a pas d'eau ou que l'eau nuirait","Quand on est pressé","Quand on le préfère"],0]},
{t:"La prière, première jugée",
b:"Le Prophète ﷺ a dit : « La première chose sur laquelle le serviteur sera jugé le Jour de la Résurrection est sa prière. Si elle est bonne, le reste de ses œuvres sera bon. » Il a dit aussi : « Si une rivière coulait devant la porte de l'un de vous et qu'il s'y lavait cinq fois par jour, lui resterait-il de la saleté ? Il en est ainsi des cinq prières ; Allah efface par elles les péchés. » La prière a des horaires fixes ; la retarder sans excuse est un péché grave.",
a:"Accomplissez aujourd'hui chaque prière au début de son temps. Mettez des alarmes pour les heures de prière si nécessaire.",
q:["Quel est le premier acte jugé ?",["La prière","L'aumône","Le jeûne"],0]},
{t:"Prier comme il priait",
b:"Le Prophète ﷺ a dit : « Priez comme vous m'avez vu prier. » Parties principales : se tenir debout face à la qibla, le takbir d'ouverture (Allahu Akbar), la récitation d'al-Fatiha à chaque rak'a (« Pas de prière pour qui ne récite pas al-Fatiha »), l'inclinaison (ruku'), le redressement, deux prosternations, la position assise, le tashahhud et le taslim. Dans un hadith qudsi, Allah partage al-Fatiha entre Lui et Son serviteur, répondant à chaque verset. Les détails diffèrent légèrement entre les quatre écoles ; au Mali, la plupart suivent l'école malikite. Suivez les savants de votre communauté.",
a:"Lisez le hadith du partage d'al-Fatiha (Muslim 395). Marquez une pause après chaque verset dans votre prochaine prière.",
q:["Que faut-il réciter à chaque rak'a ?",["Al-Fatiha","Ayat al-Kursi","Al-Ikhlas"],0]},
{t:"Le khushu', la présence dans la prière",
b:"« Bienheureux sont les croyants, ceux qui sont humbles dans leur prière. » Un homme pria rapidement à la mosquée, et le Prophète ﷺ lui dit trois fois : « Retourne prier, car tu n'as pas prié », puis lui enseigna à rester immobile dans chaque position (tuma'nina). Conseils pratiques : faire ses ablutions avec soin, connaître le sens de ce que l'on récite, regarder l'endroit de la prosternation, réciter lentement, varier les sourates, et se dire que cette prière pourrait être la dernière.",
a:"Dans chaque position de votre prochaine prière, restez immobile le temps de dire calmement SubhanAllah trois fois.",
q:["Qu'est-ce qui n'allait pas dans la prière de l'homme ?",["Il ne restait pas immobile dans chaque position","Il priait seul","Sa récitation était trop longue"],0]},
{t:"Les prières surérogatoires",
b:"Umm Habiba entendit le Prophète ﷺ dire : « Celui qui prie douze rak'as surérogatoires par jour et par nuit, une maison lui sera bâtie au Paradis. » Ce sont : 2 avant le Fajr, 4 avant le Dhuhr, 2 après le Dhuhr, 2 après le Maghrib, 2 après le 'Isha'. Il a dit que les deux avant le Fajr valent mieux que le monde et ce qu'il contient. Abu Hurayra dit avoir reçu le conseil de prier le Witr avant de dormir et deux rak'as de Duha. Les prières surérogatoires comblent les manques des prières obligatoires.",
a:"Priez aujourd'hui les douze rak'as de la sunna, plus le Witr avant de dormir.",
q:["Que promet-on pour les douze rak'as quotidiennes ?",["Une maison au Paradis","La richesse","Une longue vie"],0]},
{t:"Le vendredi, le meilleur jour",
b:"« Le meilleur jour où le soleil se lève est le vendredi. Ce jour-là Adam fut créé, ce jour-là il entra au Paradis et ce jour-là il en sortit, et l'Heure aura lieu un vendredi. » Pour les hommes, la prière du Jumu'a est obligatoire. Sunnas : le ghusl, les plus beaux habits, le parfum, venir tôt, écouter le sermon en silence, multiplier les salawat, et rechercher l'heure où l'invocation est exaucée. Beaucoup de savants recommandent aussi de réciter la sourate al-Kahf.",
a:"Préparez une liste pour le vendredi : ghusl, habits, arrivée tôt, al-Kahf, salawat, invocation avant le Maghrib.",
q:["Qu'ordonne Allah quand on appelle à la prière du vendredi ?",["Se hâter vers le rappel d'Allah et laisser le commerce","Continuer de travailler","Prier chez soi"],0]},
{t:"La prière en commun",
b:"« La prière en commun est supérieure de vingt-sept degrés à la prière seul. » Pour les hommes, prier à la mosquée est fortement recommandé ; beaucoup de savants le jugent obligatoire. Le Prophète ﷺ a dit : « Celui qui prie le 'Isha' en commun, c'est comme s'il avait prié la moitié de la nuit. Celui qui prie le Fajr en commun, c'est comme s'il avait prié toute la nuit. » Chaque pas vers la mosquée élève d'un degré et efface un péché.",
a:"Priez au moins une prière en commun aujourd'hui, le Fajr si vous le pouvez.",
q:["De combien la prière en commun est-elle supérieure ?",["27 degrés","10 degrés","2 degrés"],0]},
{t:"La zakat et la sadaqa",
b:"La zakat est une aumône annuelle obligatoire de 2,5 % sur l'épargne détenue pendant une année lunaire au-dessus du seuil (nisab), soit la valeur de 85 g d'or (ou 595 g d'argent selon de nombreux savants). Allah cite ses huit catégories de bénéficiaires dans la sourate at-Tawba. La sadaqa est l'aumône volontaire, sans limite. Le Prophète ﷺ a dit : « L'aumône ne diminue pas la richesse. » Allah compare l'aumône à un grain qui produit sept épis, chacun de cent grains.",
a:"Calculez si vous devez la zakat cette année, avec un calculateur fiable d'un organisme islamique reconnu. Donnez une sadaqa aujourd'hui, même petite.",
q:["Quel est le taux de la zakat sur l'épargne ?",["2,5 %","10 %","20 %"],0]},
{t:"Le jeûne du Ramadan",
b:"« Ô vous qui croyez, le jeûne vous a été prescrit comme il a été prescrit à ceux d'avant vous, afin que vous atteigniez la piété (taqwa). » Le jeûne consiste à s'abstenir de nourriture, de boisson et de relations intimes de l'aube au coucher du soleil, avec l'intention. Dans un hadith qudsi : « Toute œuvre du fils d'Adam est pour lui, sauf le jeûne ; il est pour Moi et c'est Moi qui en récompense. » « Celui qui jeûne le Ramadan avec foi et en espérant la récompense, ses péchés passés sont pardonnés. » Un jeûne qui n'abandonne pas le mensonge et les mauvaises actions manque son but.",
a:"Notez la date du prochain Ramadan et commencez à préparer : quelles habitudes allez-vous entraîner avant ?",
q:["Quel est le but du jeûne selon le Coran 2:183 ?",["Atteindre la taqwa","Perdre du poids","Avoir faim"],0]},
{t:"Les jeûnes surérogatoires",
b:"Interrogé sur le jeûne du lundi, le Prophète ﷺ dit : « C'est le jour où je suis né et le jour où la révélation m'est venue. » Les œuvres sont présentées à Allah le lundi et le jeudi, et il aimait que les siennes le soient pendant qu'il jeûnait. Jeûner le jour de 'Arafa expie les péchés de l'année précédente et de l'année suivante ; jeûner 'Ashura' (10 Muharram) expie l'année précédente. Jeûner six jours de Shawwal après le Ramadan équivaut à jeûner toute l'année. Aussi trois jours chaque mois.",
a:"Jeûnez un lundi ou un jeudi ce mois-ci. Notez-le dans votre calendrier maintenant.",
q:["Jeûner le jour de 'Arafa expie les péchés de :",["L'année précédente et l'année suivante","Une semaine","Un mois"],0]},
{t:"Le Hajj et la 'Umra",
b:"Le Hajj est obligatoire une fois dans la vie pour tout musulman adulte qui en a la capacité physique et financière. Il a lieu du 8 au 13 Dhul-Hijja : l'ihram, le tawaf, la station à 'Arafa (« Le Hajj, c'est 'Arafa »), Muzdalifa, la lapidation à Mina, le sacrifice, le rasage et le sa'i. « Celui qui accomplit le Hajj sans obscénité ni transgression revient comme au jour où sa mère l'a mis au monde. » La 'Umra peut se faire à tout moment de l'année.",
a:"Si vous n'avez pas fait le Hajj, fixez-vous aujourd'hui un objectif d'épargne et une intention. L'intention est récompensée.",
q:["Quel rite du Hajj le Prophète ﷺ a-t-il appelé « le Hajj lui-même » ?",["La station à 'Arafa","Le tawaf","La lapidation"],0]},
{t:"La tawba, le retour à Allah",
b:"« Dis : Ô Mes serviteurs qui avez commis des excès à votre propre détriment, ne désespérez pas de la miséricorde d'Allah. Allah pardonne tous les péchés. » Allah se réjouit plus du repentir de Son serviteur qu'un homme qui a perdu dans le désert son chameau portant sa nourriture et son eau, puis le retrouve. Les savants citent les conditions d'un repentir sincère : cesser le péché, le regretter, être résolu à ne jamais y revenir, et, s'il touche les droits d'autrui, les restituer ou demander pardon.",
a:"Faites aujourd'hui un repentir sincère pour un péché précis, en suivant les quatre conditions.",
q:["Laquelle n'est PAS une condition de la tawba ?",["Annoncer publiquement le péché","Cesser le péché","Le regretter"],0]},
{t:"Les plus beaux noms d'Allah",
b:"« Allah a quatre-vingt-dix-neuf noms. Celui qui les dénombre (les apprend, les comprend et les vit) entrera au Paradis. » « C'est à Allah qu'appartiennent les plus beaux noms ; invoquez-Le par eux. » Exemples : ar-Rahman, ar-Rahim (le Tout Miséricordieux, le Très Miséricordieux), al-Ghafur (Celui qui pardonne), ar-Razzaq (Celui qui pourvoit), al-Hakim (le Sage), al-Wadud (le Bienveillant, Celui qui aime). Connaître un nom change la manière de vivre : connaître al-Basir (Celui qui voit tout) mène à l'ihsan ; connaître ar-Razzaq ôte l'inquiétude pour la subsistance.",
a:"Apprenez un nom par jour à partir de maintenant. Aujourd'hui : al-Wadud, Celui qui aime (Coran 85:14).",
q:["Combien de noms d'Allah le célèbre hadith mentionne-t-il ?",["Quatre-vingt-dix-neuf","Trente-trois","Mille"],0]},
{t:"Vivre avec le Coran",
b:"« Récitez le Coran, car il viendra le Jour de la Résurrection intercéder pour ses compagnons. » « Celui qui lit une lettre du Livre d'Allah obtient une bonne action, et une bonne action est multipliée par dix. Je ne dis pas que Alif-Lam-Mim est une lettre, mais Alif est une lettre, Lam est une lettre et Mim est une lettre. » Celui qui récite avec difficulté a une double récompense. Lire une page par jour permet de terminer le Coran en environ 20 mois ; quatre pages par jour, en environ cinq mois.",
a:"Commencez dès aujourd'hui un programme quotidien de Coran. Un minimum réaliste : une page après le Fajr, avec sa traduction.",
q:["Quelle récompense a celui qui récite avec difficulté ?",["Une double récompense","Aucune récompense","La moitié de la récompense"],0]}
];

{t:"Le bon caractère",

{t:"La sincérité",
