q:["What was revealed about 'Ammar's situation?",["A forced person with a firm heart is not blamed","He had to repeat his shahadah publicly","He must migrate"],0]},
{t:"Asma' bint Abi Bakr",
b:"Asma', daughter of Abu Bakr, helped the Hijrah in secret. She carried food and water to the Cave of Thawr while pregnant. When she had nothing to tie the food bag with, she tore her waistband in two and used one half. The Prophet ﷺ called her Dhat an-Nitaqayn, the woman of the two waistbands. When Abu Jahl slapped her for not revealing where her father was, she stayed silent. She lived to about 100, with her mind sharp and her teeth intact.",
s:["B:3907","B:2979"],
a:"Help a good cause in a practical, behind-the-scenes way today.",
q:["What was Asma' called?",["The woman of the two waistbands","The mother of the believers","The first scholar"],0]},
{t:"Anas ibn Malik",
b:"Anas was brought by his mother to serve the Prophet ﷺ when he was about ten. He served him for ten years in Madinah. He said: \"He never once said 'uff' to me, and he never asked me about something I had done, 'Why did you do that?', or about something I had not done, 'Why did you not do that?'\" The Prophet ﷺ prayed for him to have much wealth and children and blessing in them, and he lived long and became a major narrator of hadith.",
s:["B:6038","M:2309","B:6334"],
a:"Today, do not criticise anyone who works for you or helps you. Thank them instead.",
q:["How long did Anas serve the Prophet ﷺ?",["Ten years","Three years","Twenty years"],0]},
{t:"Adam, the First Human",
b:"Allah told the angels He would place a successor (khalifah) on earth. He created Adam from clay, taught him the names of all things, and commanded the angels to prostrate. Iblis refused out of arrogance: \"I am better than him.\" Adam and Hawwa' lived in the Garden, but Shaytan tempted them to eat from the forbidden tree. Unlike Iblis, they did not argue. They repented immediately with words Allah taught them, and Allah forgave them. Our first lesson as humans: we make mistakes, and we return to Allah.",
ar:"رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ",
tl:"Rabbana zalamna anfusana wa in lam taghfir lana wa tarhamna lanakunanna mina al-khasirin",
en:"Our Lord, we have wronged ourselves. If You do not forgive us and have mercy on us, we will surely be among the losers.",
s:["Q:2:30-37","Q:7:11-23"],
a:"Memorise the du'a of Adam (Q 7:23) and say it after your next mistake.",
q:["What was the sin of Iblis?",["Arrogance","Eating from the tree","Lying"],0]},
{t:"Nuh and the Ark",
b:"Nuh called his people to worship Allah alone for 950 years, by night and by day, in public and in private. Only a few believed. Allah told him to build the Ark, and his people mocked him. When the flood came, Nuh called to his son to board, but his son said he would climb a mountain. A wave came between them. Nuh asked Allah about his son, and Allah taught him that true family is in faith and righteous deeds. Lesson: keep calling to good with patience, and leave results to Allah.",
s:["Q:29:14","Q:11:36-48","Q:71:1-28"],
a:"Read Surah Nuh (71) and note the different ways he invited his people.",
q:["How long did Nuh call his people?",["950 years","40 years","100 years"],0]},
{t:"Ibrahim, the Friend of Allah",
b:"Ibrahim questioned the idols of his people as a young man. He broke them, leaving the largest, and said: \"Ask them, if they can speak.\" His people threw him into a great fire, and Allah said: \"O fire, be cool and safe for Ibrahim.\" Later Allah tested him with the command to sacrifice his son Isma'il. Both submitted, and Allah ransomed Isma'il with a great sacrifice, remembered every Eid al-Adha. Allah took Ibrahim as a khalil, a close friend.",
s:["Q:21:51-70","Q:37:99-111","Q:4:125"],
a:"Give up one thing you love today for Allah's sake. Ibrahim was willing to give everything.",
q:["What did Allah say to the fire?",["Be cool and safe for Ibrahim","Go out","Burn the idols"],0]},
{t:"Musa and Pharaoh",
b:"Musa was born when Pharaoh was killing the baby boys of Bani Isra'il. His mother put him in a basket on the river, and he grew up in Pharaoh's own palace. Later Allah spoke to him at the mountain and sent him to Pharaoh. Musa felt weak and asked Allah to open his chest, ease his task and untie his tongue. When Pharaoh's army trapped them at the sea, his people said, \"We will be caught!\" Musa said: \"No! My Lord is with me; He will guide me.\" The sea split.",
ar:"رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي يَفْقَهُوا قَوْلِي",
tl:"Rabbi ishrah li sadri, wa yassir li amri, wahlul 'uqdatan min lisani, yafqahu qawli",
en:"My Lord, open my chest for me, ease my task for me, and untie the knot from my tongue so they understand my speech.",
s:["Q:20:25-28","Q:28:7-13","Q:26:61-63"],
a:"Say Musa's du'a before your hardest conversation or task today.",
q:["What did Musa say when trapped at the sea?",["My Lord is with me; He will guide me","We are lost","Let us surrender"],0]},
{t:"Yusuf, Patience and Purity",
b:"Yusuf was thrown into a well by his jealous brothers, sold as a slave in Egypt, tempted by the wife of his master, and jailed for years though innocent. He chose prison over sin. He kept calling to Allah even in prison. Allah raised him to be in charge of Egypt's storehouses. When his brothers came begging, he forgave them: \"No blame on you today.\" His father Ya'qub, who lost his sight from grief, said: \"I complain of my grief only to Allah\" and called it beautiful patience.",
s:["Q:12:4-101","Q:12:18","Q:12:86","Q:12:92"],
a:"When you feel sad today, complain only to Allah in du'a, not to people.",
q:["What did Yusuf say to his brothers?",["No blame on you today","You will be punished","Leave Egypt"],0]},
{t:"Maryam and 'Isa",
b:"Maryam was devoted to worship from childhood, and Allah chose her above the women of the worlds. The angel announced to her a son without a father, as Allah created Adam without father or mother. The baby 'Isa spoke from the cradle: \"I am the servant of Allah. He has given me the Book and made me a prophet.\" Muslims believe 'Isa is a great messenger and the Messiah, not the son of God, that he was not crucified but raised to Allah, and that he will return before the Last Day.",
s:["Q:3:42-47","Q:19:16-36","Q:4:157-158","Q:3:59"],
a:"Read Surah Maryam 19:16–36. It is the Islamic account of 'Isa's birth.",
q:["What were the first words of baby 'Isa?",["I am the servant of Allah","I am the son of God","Peace be upon you"],0]}
];
// Track D — Du'a and dhikr. Day 3 of each week.
const DUA = [
{t:"Du'a Is Worship",
b:"Du'a means calling on Allah: asking, thanking, complaining, hoping. The Prophet ﷺ said: \"Du'a is worship,\" then recited: \"Your Lord says: Call upon Me, I will respond to you.\" You can make du'a in any language, at any time, for anything halal, big or small. There is no intermediary: \"When My servants ask you about Me, I am near. I answer the call of the caller when he calls Me.\" Every du'a is answered in one of three ways: you get what you asked, a harm is turned away, or it is saved for you in the Hereafter.",
s:["AD:1479","T:2969","Q:40:60","Q:2:186","Musnad Ahmad (Abu Sa'id al-Khudri; the three outcomes of du'a; graded sahih)"],
a:"Make a personal du'a today in your own language for three specific things.",
q:["What did the Prophet ﷺ call du'a?",["Worship","Optional","Only for hardship"],0]},
{t:"How to Make Du'a",
b:"The Prophet ﷺ heard a man make du'a without praising Allah or sending salawat and said: \"He was hasty.\" Then he taught: begin by praising Allah, then send salawat on the Prophet ﷺ, then ask what you wish. Recommended etiquette from the Sunnah: face the qiblah if you can, raise your hands (\"Allah is too shy to return them empty\"), ask with certainty and a present heart, use Allah's names that fit your request, admit your sins, repeat your request, and do not give up saying: \"I prayed and was not answered.\"",
s:["T:3477","AD:1481","AD:1488","B:6340","M:2735"],
a:"Structure today's du'a: 1) Praise Allah 2) Salawat 3) Your requests 4) Salawat again, and end with Ameen.",
q:["What should come before your request?",["Praise of Allah and salawat","Nothing","Your list of sins only"],0]},
{t:"The Best Times for Du'a",
b:"Some moments are especially blessed. The last third of the night: Allah descends to the lowest heaven and says: \"Who is calling Me that I may answer him?\" In sujud: \"The closest a servant is to his Lord is when he is prostrating, so make much du'a.\" Between the adhan and the iqamah: du'a then is not rejected. A special hour on Friday, which many scholars place in the last hour before Maghrib. Also when fasting, while travelling, when it rains, and the du'a of a parent for a child.",
s:["B:1145","M:758","M:482","AD:521","B:935"],
a:"Today, make a short du'a in your last sujud of each prayer, and one between adhan and iqamah.",
q:["When is a servant closest to Allah?",["In prostration (sujud)","While standing","After the prayer"],0]},
{t:"Salawat on the Prophet ﷺ",
b:"Allah says: \"Allah and His angels send blessings on the Prophet. O you who believe, send blessings on him and greet him with peace.\" The Prophet ﷺ said: \"Whoever sends one salawat on me, Allah sends ten on him.\" When the companions asked how, he taught them the Ibrahimiyyah salawat, which we recite in the final tashahhud of every prayer. Short form: \"Allahumma salli 'ala Muhammad\" or \"Sallallahu 'alayhi wa sallam\".",
ar:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ",
tl:"Allahumma salli 'ala Muhammadin wa 'ala ali Muhammad, kama sallayta 'ala Ibrahima wa 'ala ali Ibrahim, innaka Hamidun Majid. Allahumma barik 'ala Muhammadin wa 'ala ali Muhammad, kama barakta 'ala Ibrahima wa 'ala ali Ibrahim, innaka Hamidun Majid.",
en:"O Allah, send prayers on Muhammad and the family of Muhammad as You sent prayers on Ibrahim and the family of Ibrahim; You are Praiseworthy, Glorious. O Allah, bless Muhammad and the family of Muhammad as You blessed Ibrahim and the family of Ibrahim; You are Praiseworthy, Glorious.",
s:["Q:33:56","M:408","B:3370"],
a:"Memorise the full Ibrahimiyyah salawat and check that you say it correctly in your prayer.",
q:["How many blessings does Allah send for one salawat?",["Ten","One","Seventy"],0]},
{t:"The Most Complete Du'a",
b:"Anas said the du'a the Prophet ﷺ made most often was this verse of the Qur'an. It asks for all good in both lives in very few words: good in this world (health, family, provision, knowledge, a good spouse), good in the Hereafter (forgiveness, Paradise), and protection from the Fire. It is also recited between the Yemeni corner and the Black Stone during tawaf.",
ar:"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",
tl:"Rabbana atina fid-dunya hasanatan wa fil-akhirati hasanatan wa qina 'adhaban-nar",
en:"Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.",
s:["Q:2:201","B:6389","M:2690"],
a:"Use this du'a at the end of every prayer today.",
q:["Which du'a did the Prophet ﷺ make most often?",["Rabbana atina fid-dunya hasanah...","Rabbi zidni 'ilma","Ya Hayyu ya Qayyum"],0]},
{t:"The Master of Seeking Forgiveness",
b:"The Prophet ﷺ called this du'a Sayyid al-Istighfar, the master of seeking forgiveness. He said: \"Whoever says it during the day with firm faith in it and dies that day before evening will be among the people of Paradise. Whoever says it at night with firm faith and dies before morning will be among the people of Paradise.\" It combines tawhid, the covenant with Allah, admitting His blessings and admitting our sins.",
ar:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",
tl:"Allahumma anta Rabbi, la ilaha illa ant, khalaqtani wa ana 'abduk, wa ana 'ala 'ahdika wa wa'dika mastata't, a'udhu bika min sharri ma sana't, abu'u laka bi ni'matika 'alayy, wa abu'u bi dhanbi faghfir li, fa innahu la yaghfirudh-dhunuba illa ant.",
en:"O Allah, You are my Lord; there is no god but You. You created me and I am Your servant. I keep Your covenant and promise as much as I can. I seek refuge in You from the evil I have done. I acknowledge Your favour upon me and I acknowledge my sin, so forgive me, for none forgives sins except You.",
s:["B:6306"],
a:"Say Sayyid al-Istighfar once in the morning and once in the evening. Start memorising it today, one line per day.",
q:["What is promised for saying it with faith in the morning and dying before evening?",["Being among the people of Paradise","Wealth","Long life"],0]},
{t:"Morning and Evening Protection",
b:"'Uthman ibn 'Affan reported that the Prophet ﷺ said: whoever says this three times in the morning will not be struck by sudden calamity until evening, and whoever says it three times in the evening will not be struck by sudden calamity until morning. It takes about 15 seconds. It is part of the morning and evening adhkar, best said after Fajr and after 'Asr or Maghrib.",
ar:"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",
tl:"Bismillahil-ladhi la yadurru ma'asmihi shay'un fil-ardi wa la fis-sama'i wa Huwas-Sami'ul-'Alim",
en:"In the name of Allah, with whose name nothing on earth or in heaven can cause harm, and He is the All-Hearing, the All-Knowing.",
s:["AD:5088","T:3388"],
a:"Say it 3 times right now (morning), and set a reminder to say it 3 times this evening.",
q:["How many times is it said?",["Three times morning and evening","Once a day","Seven times"],0]},
{t:"Ayat al-Kursi and the End of al-Baqarah",
b:"Ayat al-Kursi (2:255) is the greatest verse of the Qur'an. Abu Hurayrah was guarding the zakat when a thief came three nights in a row. The thief taught him: recite Ayat al-Kursi when you go to bed and a guardian from Allah will stay with you and Shaytan will not come near you until morning. The Prophet ﷺ said: \"He told you the truth, though he is a liar. That was Shaytan.\" He also said whoever recites the last two verses of al-Baqarah (2:285–286) at night, they will be enough for him.",
s:["Q:2:255","B:2311","M:810","B:5009","M:807"],
a:"Tonight in bed, recite Ayat al-Kursi and the last two verses of al-Baqarah. Begin memorising them if you have not yet.",
q:["Who taught Abu Hurayrah about Ayat al-Kursi before sleep?",["Shaytan, and the Prophet ﷺ confirmed it","An angel","'Umar"],0]},
{t:"Before Sleeping and on Waking",
b:"Hudhayfah reported that when the Prophet ﷺ lay down to sleep, he put his hand under his cheek and said the first du'a below. When he woke he said the second. Sleep is called the minor death, so each morning is a new life given to us. Other Sunnahs before sleep: wudu', lying on the right side, the tasbih of Fatimah, Ayat al-Kursi, and blowing into the hands after reciting al-Ikhlas, al-Falaq and an-Nas, then wiping the body.",
ar:"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا — الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ",
tl:"Bismika Allahumma amutu wa ahya. — Alhamdu lillahil-ladhi ahyana ba'da ma amatana wa ilayhin-nushur.",
en:"In Your name, O Allah, I die and I live. — Praise be to Allah who gave us life after He caused us to die, and to Him is the resurrection.",
s:["Bukhari, Book of Invocations (Hudhayfah, du'a on sleeping and waking)","B:5017","Q:39:42"],
a:"Say the waking du'a tomorrow before you touch your phone.",
q:["What is sleep compared to?",["A minor death","A journey","A prayer"],0]},
{t:"Leaving and Entering the Home",
b:"When leaving home, say the du'a below. The Prophet ﷺ said that whoever says it is told: \"You are guided, defended and protected,\" and Shaytan turns away from him. When entering, mention Allah: the Prophet ﷺ said that if a man mentions Allah on entering his house and at his meal, Shaytan says to his followers: \"No place to stay and no dinner for you tonight.\" Then greet your family with salam.",
ar:"بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ",
tl:"Bismillah, tawakkaltu 'alallah, wa la hawla wa la quwwata illa billah",
en:"In the name of Allah, I place my trust in Allah, and there is no power and no strength except with Allah.",
s:["AD:5095","T:3426","M:2018"],
a:"Say it every time you leave home today, and say Bismillah and salam when you come back.",
q:["What does Shaytan say when you mention Allah entering home and eating?",["No place to stay and no dinner tonight","I will wait outside","I will try again"],0]},
{t:"Entering and Leaving the Toilet",
b:"Islam covers even the most private moments. Before entering the toilet, the Prophet ﷺ said the du'a below, seeking refuge from male and female devils (or from evil and evil things). Enter with the left foot, do not take the Qur'an or Allah's name inside openly, and leave with the right foot saying \"Ghufranak\" (I ask Your forgiveness). Cleanliness after using the toilet (istinja') with water is part of purity required for prayer.",
ar:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ",
tl:"Allahumma inni a'udhu bika minal-khubuthi wal-khaba'ith",
en:"O Allah, I seek refuge in You from evil and from evil beings (male and female devils).",
s:["B:142","M:375","AD:30"],
a:"Use this du'a every time today, and say \"Ghufranak\" when leaving.",
q:["What do you say when leaving the toilet?",["Ghufranak","Bismillah","Alhamdulillah only"],0]},
{t:"The Etiquette of Eating",
b:"The Prophet ﷺ told young 'Umar ibn Abi Salamah: \"Say Bismillah, eat with your right hand, and eat from what is in front of you.\" If you forget Bismillah at the start, say: \"Bismillahi awwalahu wa akhirahu\" (In the name of Allah at its beginning and its end). Never criticise food: if he liked it he ate it, otherwise he left it. After eating, say the du'a below; he said whoever says it, his past sins are forgiven.",
ar:"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ",
tl:"Alhamdu lillahil-ladhi at'amani hadha wa razaqanihi min ghayri hawlin minni wa la quwwah",
en:"Praise be to Allah who fed me this and provided it for me without any power or strength from me.",
s:["B:5376","M:2022","AD:3767","AD:4023","T:3458","B:5409"],
a:"At every meal today: Bismillah, right hand, no complaining about food, and this du'a at the end.",
q:["What do you say if you forgot Bismillah at the start?",["Bismillahi awwalahu wa akhirahu","Astaghfirullah","Nothing, the meal is lost"],0]},
{t:"Against Worry and Sadness",
b:"Anas served the Prophet ﷺ and often heard him say this du'a. It asks protection from eight things in four pairs: worry about the future and grief over the past; inability and laziness; cowardice and stinginess; heavy debt and being overpowered by people. It is a complete du'a for modern stress, burnout and pressure.",
ar:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ",
tl:"Allahumma inni a'udhu bika minal-hammi wal-hazan, wal-'ajzi wal-kasal, wal-jubni wal-bukhl, wa dala'id-dayni wa ghalabatir-rijal",
en:"O Allah, I seek refuge in You from worry and grief, from inability and laziness, from cowardice and stinginess, and from the burden of debt and being overpowered by men.",
s:["B:6369","B:2893"],
a:"Memorise it today, pair by pair. Say it when stress comes.",
q:["How many things does this du'a seek refuge from?",["Eight","Three","Five"],0]},
{t:"Du'a in Distress",
b:"Yunus called out from the darkness of the whale's belly, at night, under the sea: \"There is no god but You, glory be to You, I was among the wrongdoers.\" Allah saved him and said: \"And thus We save the believers.\" The Prophet ﷺ said that no Muslim calls with it for anything except that Allah answers him. In great distress the Prophet ﷺ also used to say: \"La ilaha illallahul-'Azimul-Halim, la ilaha illallahu Rabbul-'arshil-'azim, la ilaha illallahu Rabbus-samawati wa Rabbul-ardi wa Rabbul-'arshil-karim.\"",
ar:"لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ",
tl:"La ilaha illa anta subhanaka inni kuntu minaz-zalimin",
en:"There is no god but You. Glory be to You. Indeed, I have been among the wrongdoers.",
s:["Q:21:87-88","T:3505","B:6346","M:2730"],
a:"Say the du'a of Yunus 100 times today for something that weighs on you.",
q:["Where was Yunus when he made this du'a?",["In the belly of the whale","In a cave","On a ship"],0]},
{t:"Salat al-Istikharah",
b:"Jabir said the Prophet ﷺ taught them istikharah for all matters as he taught them a surah of the Qur'an. When you face a decision (job, marriage, move, purchase), pray two voluntary rak'ahs, then make the du'a. You ask Allah to decree it if it is good for your religion, life and outcome, and to turn it away if it is bad. Then act and trust Allah. Istikharah is not waiting for a dream; Allah eases or blocks the matter. Also consult wise people.",
ar:"اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ، فَإِنَّكَ تَقْدِرُ وَلَا أَقْدِرُ، وَتَعْلَمُ وَلَا أَعْلَمُ، وَأَنْتَ عَلَّامُ الْغُيُوبِ ...",
tl:"Allahumma inni astakhiruka bi 'ilmik, wa astaqdiruka bi qudratik, wa as'aluka min fadlikal-'azim, fa innaka taqdiru wa la aqdir, wa ta'lamu wa la a'lam, wa anta 'allamul-ghuyub ...",
en:"O Allah, I seek Your guidance through Your knowledge, Your power through Your might, and I ask You from Your great bounty. You are able and I am not; You know and I do not; You are the Knower of the unseen... (full text in Bukhari 1162).",
s:["B:1162","B:6382"],
a:"Read the full du'a in Sahih al-Bukhari 1162 and save it on your phone for your next decision.",
q:["How many rak'ahs are prayed before the istikharah du'a?",["Two voluntary rak'ahs","Four","None"],0]},
{t:"When Calamity Strikes",
b:"Umm Salamah heard the Prophet ﷺ say: no Muslim is struck by a calamity and says what Allah commanded, \"Inna lillahi wa inna ilayhi raji'un\", and then this du'a, except that Allah gives him something better. When her husband Abu Salamah died, she said it, thinking: who could be better than Abu Salamah? Allah then gave her the Prophet ﷺ himself as a husband. Allah promises those who say it blessings, mercy and guidance.",
ar:"إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي وَأَخْلِفْ لِي خَيْرًا مِنْهَا",
tl:"Inna lillahi wa inna ilayhi raji'un. Allahumma'jurni fi musibati wa akhlif li khayran minha",
en:"We belong to Allah and to Him we return. O Allah, reward me in my calamity and replace it for me with something better.",
s:["M:918","Q:2:155-157"],
a:"Memorise it now, before you need it. Use it even for small losses.",
q:["Who did Allah give Umm Salamah after she said this du'a?",["The Prophet ﷺ as a husband","Great wealth","A son"],0]},
{t:"Du'a for Your Parents",
b:"Allah commands us to lower the wing of humility to our parents and to pray for them. The Qur'an teaches the du'a below. Ibrahim also prayed: \"Our Lord, forgive me and my parents and the believers on the Day the account is established.\" Your du'a reaches your parents whether they are alive or dead: \"When a person dies, his deeds end except three: ongoing charity, beneficial knowledge, or a righteous child who prays for him.\"",
ar:"رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا",
tl:"Rabbir-hamhuma kama rabbayani saghira",
en:"My Lord, have mercy on them as they raised me when I was small.",
s:["Q:17:23-24","Q:14:41","M:1631"],
a:"Say this du'a for your parents after each prayer today. If they are alive, call them.",
q:["Does your du'a benefit your parents after their death?",["Yes","No","Only on Fridays"],0]},
{t:"Du'a for Others in Their Absence",
b:"The Prophet ﷺ said: \"The du'a of a Muslim for his brother in his absence is answered. At his head is an appointed angel; every time he prays for good for his brother, the angel says: Ameen, and for you the same.\" So when you pray for someone else secretly, an angel prays for you with the same. It also purifies the heart from envy, because you sincerely ask good for others.",
s:["M:2733","M:2732","Q:59:10"],
a:"Pray today, by name, for five people who do not know you are praying for them.",
q:["What does the angel say when you pray for your brother in his absence?",["Ameen, and for you the same","Pray for yourself first","Nothing"],0]},
{t:"The Travel Du'a",
b:"When the Prophet ﷺ mounted his camel for a journey, he said Allahu Akbar three times, then the verse below from Surah az-Zukhruf, then asked Allah for righteousness, taqwa and ease in the journey. It is used today in cars, trains and planes. The du'a of the traveller is also among the du'as that are answered, so use the journey for du'a.",
ar:"سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ",
tl:"Subhanal-ladhi sakhkhara lana hadha wa ma kunna lahu muqrinin, wa inna ila Rabbina lamunqalibun",
en:"Glory be to Him who has subjected this to us; we could never have done it ourselves. And to our Lord we will surely return.",
s:["M:1342","Q:43:13-14"],
a:"Say it next time you get in a car or on a train.",
q:["How many times is Allahu Akbar said first?",["Three","One","Seven"],0]},
{t:"Sneezing and Yawning",
b:"The Prophet ﷺ said: \"When one of you sneezes, let him say: Alhamdulillah. His brother should say to him: Yarhamukallah (may Allah have mercy on you). Then he replies: Yahdikumullahu wa yuslihu balakum (may Allah guide you and set your affairs right).\" Answering a sneeze is one of the rights of a Muslim on another, if he praised Allah. Yawning is from Shaytan, so hold it back as much as you can and cover your mouth.",
s:["B:6224","M:2162","B:6223"],
a:"Respond correctly to every sneeze you hear today, and teach it to a child.",
q:["What does the sneezer reply to 'Yarhamukallah'?",["Yahdikumullahu wa yuslihu balakum","Ameen","Jazakallahu khayran"],0]},
{t:"Two Light Words, Heavy on the Scale",
b:"The final hadith of Sahih al-Bukhari: \"Two words are light on the tongue, heavy on the Scale, and beloved to the Most Merciful: SubhanAllahi wa bihamdihi, SubhanAllahil-'Azim.\" He also said: whoever says \"SubhanAllahi wa bihamdihi\" 100 times a day has his sins wiped away even if they are like the foam of the sea. Dhikr costs nothing and can be done while walking, driving or waiting.",
ar:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ",
tl:"SubhanAllahi wa bihamdihi, SubhanAllahil-'Azim",
en:"Glory be to Allah and praise be to Him; glory be to Allah, the Most Great.",
s:["B:6406","M:2694","B:7563","B:6405"],
a:"Say \"SubhanAllahi wa bihamdihi\" 100 times today, while commuting or waiting.",
q:["Where is this hadith placed in Sahih al-Bukhari?",["It is the last hadith","It is the first hadith","In the chapter on fasting"],0]},
{t:"A Treasure of Paradise",
b:"Abu Musa al-Ash'ari reported that the Prophet ﷺ said to him: \"Shall I not tell you of a treasure from the treasures of Paradise? La hawla wa la quwwata illa billah.\" It means: no change of state and no strength except through Allah. It frees you from relying on yourself. Say it when you face a task larger than you, when you feel weak, or when you hear bad news.",
ar:"لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ",
tl:"La hawla wa la quwwata illa billah",
en:"There is no power and no strength except with Allah.",
s:["B:6384","M:2704"],
a:"Say it before each difficult task today.",
q:["What did the Prophet ﷺ call 'La hawla wa la quwwata illa billah'?",["A treasure of Paradise","A cure for illness","A pillar of faith"],0]},
{t:"After Every Prayer",
b:"Thawban said that when the Prophet ﷺ finished the prayer he said Astaghfirullah three times, then the first du'a below. Abu Hurayrah reported: whoever says SubhanAllah 33 times, Alhamdulillah 33 times and Allahu Akbar 33 times after each prayer, and completes 100 with \"La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamdu wa huwa 'ala kulli shay'in qadir\", his sins are forgiven even if they are like the foam of the sea.",
ar:"أَسْتَغْفِرُ اللَّهَ (٣) — اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ",
tl:"Astaghfirullah (3x). Allahumma antas-salamu wa minkas-salam, tabarakta ya Dhal-jalali wal-ikram",
en:"I seek Allah's forgiveness (3x). O Allah, You are Peace and from You comes peace. Blessed are You, O Possessor of majesty and honour.",
s:["M:591","M:597"],
a:"Do not stand up after any prayer today until you finish these adhkar (about 3 minutes).",
q:["What completes the count to 100 after the 33/33/33?",["La ilaha illallahu wahdahu la sharika lah...","Allahu Akbar once more","Surah al-Fatihah"],0]},
{t:"The Three Quls for Protection",
b:"The Prophet ﷺ said that no one has sought refuge with anything like al-Falaq and an-Nas. He told 'Abdullah ibn Khubayb to recite al-Ikhlas, al-Falaq and an-Nas three times in the morning and evening, saying they would suffice him against everything. 'Aishah reported that every night before sleeping, he cupped his hands, recited the three surahs into them, and wiped over as much of his body as he could, three times.",
s:["M:814","AD:5082","T:3575","B:5017"],
a:"Recite the three Quls 3 times this morning and evening, and do the Sunnah of wiping before sleep.",
q:["How many times are the three Quls recited morning and evening?",["Three","Once","Ten"],0]},
{t:"The Du'a of Laylat al-Qadr",
b:"'Aishah asked: \"O Messenger of Allah, if I knew which night is Laylat al-Qadr, what should I say?\" He said: say the du'a below. Al-'Afuww is the One who erases sins completely, not just covers them. Laylat al-Qadr is better than a thousand months and is sought in the odd nights of the last ten of Ramadan. This du'a is not limited to Ramadan; you can say it any time.",
ar:"اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي",
tl:"Allahumma innaka 'afuwwun tuhibbul-'afwa fa'fu 'anni",
en:"O Allah, You are the One who pardons and You love to pardon, so pardon me.",
s:["T:3513","IM:3850","Q:97:1-5","B:2017"],
a:"Say this du'a 33 times today, and forgive one person, since Allah loves pardon.",
q:["What does al-'Afuww mean?",["The One who erases sins completely","The Most Generous","The All-Seeing"],0]},
{t:"Du'a for a Firm Heart",
b:"Anas said the Prophet ﷺ often said the du'a below. He asked: \"O Messenger of Allah, we believe in you and what you brought; do you fear for us?\" He said: \"Yes, hearts are between two fingers of the fingers of Allah; He turns them as He wills.\" If the Prophet ﷺ asked for steadfastness, we need it more. The Qur'an teaches a similar du'a: \"Our Lord, do not let our hearts deviate after You have guided us.\"",
ar:"يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ",
tl:"Ya Muqallibal-qulub, thabbit qalbi 'ala dinik",
en:"O Turner of hearts, keep my heart firm on Your religion.",
s:["T:2140","Q:3:8"],
a:"Make this du'a your daily habit for the rest of your life. Start today, after every prayer.",
q:["What did the Prophet ﷺ say about hearts?",["They are between two fingers of Allah; He turns them as He wills","They never change","They are fixed at birth"],0]}
];
// Track W — Belief ('aqidah) and worship ('ibadah). Day 4 of each week.
const WORSHIP = [
{t:"Islam, Iman and Ihsan",
b:"A man in very white clothes, with very black hair and no sign of travel, sat knee to knee with the Prophet ﷺ and asked about Islam, Iman, Ihsan and the Hour. Islam: the shahadah, prayer, zakat, fasting Ramadan and Hajj. Iman: to believe in Allah, His angels, His books, His messengers, the Last Day, and divine decree, its good and its bad. Ihsan: \"To worship Allah as if you see Him, and if you do not see Him, He sees you.\" Afterwards the Prophet ﷺ said: \"That was Jibril, who came to teach you your religion.\"",
s:["M:8","B:50"],
a:"In one prayer today, practise ihsan: pray as if you see Allah, and remember that He sees you.",
q:["What is ihsan?",["To worship Allah as if you see Him","To give charity","To believe in angels"],0]},
{t:"The Five Pillars",
b:"The Prophet ﷺ said: \"Islam is built on five: testifying that there is no god but Allah and that Muhammad is the Messenger of Allah, establishing the prayer, giving zakat, Hajj to the House, and fasting Ramadan.\" A building stands on its pillars. The shahadah is the foundation. Prayer is the pillar Muslims practise five times a day, and the Prophet ﷺ called it the dividing line between a person and disbelief. Check yourself honestly: which pillar is weakest in your life right now?",
s:["B:8","M:16","M:82"],
a:"Write down the five pillars and rate yourself honestly from 1 to 5 on each. Choose one to improve this month.",
q:["How many pillars is Islam built on?",["Five","Six","Seven"],0]},
{t:"Tawhid, the Oneness of Allah",
b:"Tawhid is the core of Islam: Allah is One in His lordship (He alone creates, provides and controls), One in His right to be worshipped (all worship goes only to Him), and One in His names and attributes (nothing is like Him). Surah al-Ikhlas sums it up, and the Prophet ﷺ said it equals a third of the Qur'an. La ilaha illallah means: nothing deserves worship except Allah. It is the key to Paradise.",
s:["Q:112:1-4","B:5013","Q:42:11","Q:21:25"],
a:"Recite al-Ikhlas three times today with its meaning in mind. The reward equals reciting the whole Qur'an.",
q:["Surah al-Ikhlas equals what part of the Qur'an?",["One third","One half","One quarter"],0]},
{t:"Shirk and Showing Off",
b:"Shirk is giving any part of worship to other than Allah: praying to the dead, asking saints for help, believing an amulet protects you, or swearing by other than Allah. It is the only sin Allah does not forgive if a person dies upon it without repentance. There is also hidden or minor shirk: riya', doing good deeds to be seen. In a hadith qudsi Allah says: \"I am the most free of need of partners. Whoever does a deed associating another with Me, I leave him and his shirk.\"",
s:["Q:4:48","Q:31:13","M:2985","Q:18:110"],
a:"Do one good deed today that no one will ever know about.",
q:["What is riya'?",["Doing good deeds to be seen by people","Missing a prayer","Being poor"],0]},
{t:"Belief in the Angels",
b:"Angels are created from light, never disobey Allah and do what they are commanded. Jibril brings revelation. Mika'il is entrusted with rain and plants. Israfil will blow the Trumpet. The Angel of Death takes souls. Two angels record every word and deed. Others guard us, and Munkar and Nakir question the dead in the grave, as described in the hadith. Knowing that angels are recording should change how we speak and act.",
s:["M:2996","Q:66:6","Q:50:17-18","Q:2:97-98","Q:32:11","M:770"],
a:"Before speaking today, remember the two recorders: \"Not a word he utters but there is a watcher ready\" (Q 50:18).",
q:["What are angels created from?",["Light","Fire","Clay"],0]},
{t:"Belief in the Books",
b:"Muslims believe in all the books Allah revealed: the Scrolls of Ibrahim, the Tawrah to Musa, the Zabur to Dawud, the Injil to 'Isa, and the Qur'an to Muhammad ﷺ. Earlier books were changed over time; the Qur'an is protected by Allah Himself: \"Indeed it is We who sent down the Reminder, and indeed We will guard it.\" It is the same today, letter by letter, as recited by the Prophet ﷺ, preserved in writing and in the memories of millions. He said: \"The best of you are those who learn the Qur'an and teach it.\"",
s:["Q:15:9","Q:3:3-4","Q:87:18-19","B:5027"],
a:"Learn one new ayah today with its meaning, and teach it to someone.",
q:["Who guards the Qur'an from change?",["Allah Himself","The scholars only","No one"],0]},
{t:"Belief in the Messengers",
b:"Allah sent messengers to every nation, all calling to the same message: worship Allah alone. The Qur'an names 25 prophets, including Adam, Nuh, Ibrahim, Musa, 'Isa and Muhammad ﷺ. The five \"of firm resolve\" (ulul-'azm) are Nuh, Ibrahim, Musa, 'Isa and Muhammad ﷺ. Muslims love and respect all of them and make no distinction in believing in them. Muhammad ﷺ is the Seal of the Prophets: there is no prophet after him.",
s:["Q:16:36","Q:2:285","Q:33:40","Q:46:35","Q:4:164"],
a:"Learn the names of the five messengers of firm resolve.",
q:["Who is the Seal of the Prophets?",["Muhammad ﷺ","'Isa","Ibrahim"],0]},
{t:"The Last Day",
b:"This world will end. The Trumpet will be blown, all will die, then everyone will be resurrected and gathered. Each person will receive their book of deeds, in the right hand or the left. Deeds will be weighed on the Scale (al-Mizan), and no one will be wronged even by the weight of a mustard seed. Then comes the bridge (as-Sirat) over Hell. \"Whoever does an atom's weight of good will see it, and whoever does an atom's weight of evil will see it.\"",
s:["Q:99:1-8","Q:21:47","Q:69:19-29","Q:39:68"],
a:"Read Surah az-Zalzalah (99). Do one small good deed today and remember: an atom's weight counts.",
q:["How small a good deed will be seen on the Last Day?",["An atom's weight","Only large deeds","Only obligatory deeds"],0]},
{t:"Al-Qadar, Divine Decree",
b:"Belief in qadar has four parts: Allah knows everything; He wrote everything in the Preserved Tablet 50,000 years before creating the heavens and earth; nothing happens except by His will; and He created everything, including our actions. This does not remove our choice or responsibility. The Prophet ﷺ said: \"Strive for what benefits you, seek help from Allah, and do not give up. If something befalls you, do not say 'If only I had done...', but say: Qaddarallahu wa ma sha'a fa'al (Allah decreed and did what He willed).\"",
s:["M:8","M:2653","M:2664","Q:54:49","Q:57:22-23"],
a:"Replace \"if only\" with \"Qaddarallahu wa ma sha'a fa'al\" every time something goes wrong today.",
q:["What should you say instead of 'if only I had...'?",["Qaddarallahu wa ma sha'a fa'al","Inshallah","Bismillah"],0]},
{t:"Paradise and Hell",
b:"In a hadith qudsi Allah says: \"I have prepared for My righteous servants what no eye has seen, no ear has heard, and no heart has imagined.\" The greatest joy of Paradise is seeing Allah. Hell is real: its fire is seventy times hotter than the fire of this world. Allah describes both to give us hope and fear in balance, like the two wings of a bird. The Prophet ﷺ said: \"Paradise is surrounded by hardships and Hell is surrounded by desires.\"",
s:["B:3244","M:2824","Q:32:17","M:2843","M:2822","M:181"],
a:"Read Surah al-Insan 76:11–22, a description of Paradise.",
q:["What surrounds Paradise?",["Hardships","Desires","Walls of gold"],0]},
{t:"Actions Are by Intentions",
b:"The first hadith in Sahih al-Bukhari: \"Actions are only by intentions, and each person will have only what he intended.\" The same action can be worship or nothing at all depending on intention. Eating, sleeping and working become worship when done to obey Allah and gain strength for good. Renewing your intention costs nothing and multiplies reward. Scholars say this hadith is one third of Islam.",
s:["B:1","M:1907"],
a:"Before each of today's ordinary tasks (work, food, sleep), make a conscious intention for Allah.",
q:["Which hadith opens Sahih al-Bukhari?",["Actions are by intentions","Islam is built on five","The religion is sincerity"],0]},
{t:"How to Make Wudu'",
b:"Wudu' is required for prayer. Obligatory acts from the Qur'an: wash the face, wash the arms up to and including the elbows, wipe the head, and wash the feet up to and including the ankles. Sunnah method as shown by 'Uthman: intention, Bismillah, wash the hands 3 times, rinse the mouth and nose 3 times, face 3 times, right arm then left 3 times, wipe the head once (front to back and back), wipe the ears, then right foot then left 3 times. Sins leave with the water. Say the shahadah afterwards.",
ar:"أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ",
tl:"Ash-hadu an la ilaha illallahu wahdahu la sharika lah, wa ash-hadu anna Muhammadan 'abduhu wa rasuluh",
en:"I bear witness that there is no god but Allah alone, without partner, and that Muhammad is His servant and Messenger.",
s:["Q:5:6","B:159","M:226","M:244","M:234"],
a:"Make your next wudu' slowly using the Sunnah method, and say the shahadah after it.",
q:["Up to where are the arms washed?",["Including the elbows","The wrists","The shoulders"],0]},
{t:"Ghusl and Tayammum",
b:"Ghusl (full ritual bath) is required after sexual intercourse or ejaculation, after menstruation and post-natal bleeding, and is Sunnah on Fridays and for the two Eids. 'Aishah described the Prophet's ﷺ ghusl: wash the hands, wash the private parts, make wudu', pour water over the head three times running fingers through the hair, then pour water over the whole body. If there is no water or using it would harm you, do tayammum: strike clean earth with the hands, then wipe the face and hands.",
s:["Q:5:6","Q:4:43","B:248","M:316","B:347"],
a:"Review the steps of ghusl. If you have doubts about purity rules, ask a trusted local scholar.",
q:["When is tayammum allowed?",["When there is no water or water would cause harm","When you are in a hurry","Whenever you prefer"],0]},
{t:"The Prayer: First to Be Judged",
b:"The Prophet ﷺ said: \"The first thing a servant will be held accountable for on the Day of Resurrection is his prayer. If it is sound, the rest of his deeds will be sound.\" He also said: \"If there were a river at the door of one of you and he bathed in it five times a day, would any dirt remain on him? That is like the five prayers; Allah wipes away sins with them.\" The prayer has fixed times; delaying it without excuse is a serious sin.",
s:["T:413","B:528","M:667","Q:4:103","Q:107:4-5"],
a:"Pray every prayer today within its first part of time. Set prayer-time alarms if needed.",
q:["What is the first deed to be judged?",["The prayer","Charity","Fasting"],0]},
{t:"Praying as He Prayed",
b:"The Prophet ﷺ said: \"Pray as you have seen me pray.\" Main parts: standing facing the qiblah, opening takbir (Allahu Akbar), reciting al-Fatihah in every rak'ah (\"There is no prayer for one who does not recite al-Fatihah\"), bowing (ruku'), rising, two prostrations, sitting, the tashahhud, and the taslim. In a hadith qudsi Allah divides al-Fatihah between Himself and His servant, answering each verse. Details differ slightly between the four schools; follow your local scholars.",
s:["B:631","B:756","M:394","M:395","B:757"],
a:"Read the hadith of al-Fatihah being divided (Muslim 395). Pause after each verse in your next prayer.",
q:["What must be recited in every rak'ah?",["Al-Fatihah","Ayat al-Kursi","Al-Ikhlas"],0]},
{t:"Khushu', Presence in Prayer",
b:"\"The believers have succeeded, those who are humble in their prayers.\" A man prayed quickly in the mosque, and the Prophet ﷺ told him three times: \"Go back and pray, for you have not prayed,\" then taught him to be still in each position (tuma'ninah). Practical tips: make wudu' carefully, know the meaning of what you recite, look at the place of prostration, recite slowly, vary the surahs, and remember that this could be your last prayer.",
s:["Q:23:1-2","B:757","M:397","Q:2:45-46"],
a:"In each position of your next prayer, stay still long enough to say SubhanAllah three times calmly.",
q:["What was wrong with the man's prayer?",["He was not still in each position","He prayed alone","He recited too long"],0]},
{t:"Sunnah Prayers",
b:"Umm Habibah heard the Prophet ﷺ say: \"Whoever prays twelve voluntary rak'ahs in a day and night, a house will be built for him in Paradise.\" They are: 2 before Fajr, 4 before Dhuhr, 2 after Dhuhr, 2 after Maghrib, 2 after 'Isha'. He said the two before Fajr are better than the world and everything in it. Abu Hurayrah said he was advised to pray Witr before sleeping and two rak'ahs of Duha. Voluntary prayers fill gaps in the obligatory ones.",
s:["M:728","T:415","M:725","B:1981","M:721"],
a:"Pray all twelve sunnah rak'ahs today, plus Witr before sleep.",
q:["What is promised for the twelve daily sunnah rak'ahs?",["A house in Paradise","Wealth","Long life"],0]},
{t:"Friday, the Best Day",
b:"\"The best day on which the sun rises is Friday. On it Adam was created, on it he entered Paradise, and on it he was taken out of it, and the Hour will happen on a Friday.\" For men the Jumu'ah prayer is obligatory. Sunnahs: ghusl, best clothes, perfume, going early, listening silently to the khutbah, much salawat, and seeking the hour of answered du'a. Many scholars also recommend reciting Surah al-Kahf.",
s:["M:854","Q:62:9-10","B:883","B:935","AD:1047"],
a:"Prepare a Friday list: ghusl, clothes, early arrival, al-Kahf, salawat, du'a before Maghrib.",
q:["What does Allah command when the call for Friday prayer is made?",["Hasten to the remembrance of Allah and leave trade","Continue working","Pray at home"],0]},
{t:"The Congregation",
b:"\"Prayer in congregation is twenty-seven times better than prayer alone.\" For men, praying in the mosque is strongly emphasised; many scholars hold it is obligatory. The Prophet ﷺ said: \"Whoever prays 'Isha' in congregation, it is as if he prayed half the night. Whoever prays Fajr in congregation, it is as if he prayed the whole night.\" Every step to the mosque raises a rank and removes a sin.",
s:["B:645","M:650","M:656","M:666"],
a:"Pray at least one prayer in congregation today, Fajr if you can.",
q:["How much better is prayer in congregation?",["27 times","10 times","2 times"],0]},
{t:"Zakat and Sadaqah",
b:"Zakat is an obligatory annual charity of 2.5% on savings held for a lunar year above the nisab threshold (the value of 85 g of gold, or 595 g of silver according to many scholars). Allah lists its eight categories of recipients in Surah at-Tawbah. Sadaqah is voluntary charity, without limit. The Prophet ﷺ said: \"Charity does not decrease wealth.\" Allah compares charity to a grain that grows seven ears, each with a hundred grains.",
s:["Q:9:60","Q:2:261","M:2588","B:1395"],
a:"Calculate whether you owe zakat this year, using a reliable calculator from a recognised Islamic body. Give a sadaqah today, however small.",
q:["What is the rate of zakat on savings?",["2.5%","10%","20%"],0]},
{t:"Fasting Ramadan",
b:"\"O you who believe, fasting is prescribed for you as it was prescribed for those before you, so that you may attain taqwa.\" Fasting is abstaining from food, drink and intercourse from dawn to sunset, with intention. In a hadith qudsi: \"Every deed of the son of Adam is for him except fasting; it is for Me and I reward it.\" \"Whoever fasts Ramadan with faith and hoping for reward, his past sins are forgiven.\" A fast without leaving lying and bad deeds misses its purpose.",
s:["Q:2:183-185","B:1904","B:38","B:1903"],
a:"Note the date of the next Ramadan and start planning: which habits will you train before it?",
q:["What is the purpose of fasting according to Q 2:183?",["To attain taqwa","To lose weight","To feel hungry"],0]},
{t:"Voluntary Fasts",
b:"Asked about fasting on Monday, the Prophet ﷺ said: \"That is the day I was born and the day revelation came to me.\" Deeds are presented to Allah on Monday and Thursday, and he loved for his deeds to be presented while fasting. Fasting the day of 'Arafah expiates the sins of the previous and coming year; fasting 'Ashura' (10 Muharram) expiates the previous year. Fasting six days of Shawwal after Ramadan is like fasting the whole year. Also three days each month.",
s:["M:1162","T:747","M:1164","B:1981"],
a:"Fast one Monday or Thursday this month. Put it in your calendar now.",
q:["Fasting the day of 'Arafah expiates the sins of:",["The previous and the coming year","One week","One month"],0]},
{t:"Hajj and 'Umrah",
b:"Hajj is obligatory once in a lifetime for every adult Muslim who is physically and financially able. It takes place from the 8th to the 13th of Dhul-Hijjah: ihram, tawaf, standing at 'Arafah (\"Hajj is 'Arafah\"), Muzdalifah, stoning at Mina, sacrifice, shaving, and sa'i. \"Whoever performs Hajj without obscenity or wrongdoing returns like the day his mother gave birth to him.\" 'Umrah can be done any time of the year.",
s:["Q:3:97","Q:2:196-203","B:1521","B:1773","T:889"],
a:"If you have not done Hajj, set a savings goal and an intention today. Intention is rewarded.",
q:["What is the pillar of Hajj the Prophet ﷺ called 'Hajj itself'?",["Standing at 'Arafah","Tawaf","Stoning"],0]},
{t:"Tawbah, Returning to Allah",
b:"\"Say: O My servants who have transgressed against themselves, do not despair of the mercy of Allah. Indeed Allah forgives all sins.\" Allah is happier with the repentance of His servant than a man who lost his camel with his food and water in the desert, then found it. Scholars list the conditions of sincere tawbah: stop the sin, regret it, resolve never to return, and if it involved another person's rights, return them or seek their forgiveness.",
s:["Q:39:53","Q:66:8","B:6309","M:2747","M:2759"],
a:"Make sincere tawbah today for one specific sin, using the four conditions.",
q:["Which is NOT a condition of tawbah?",["Announcing the sin publicly","Stopping the sin","Regretting it"],0]},
{t:"The Beautiful Names of Allah",
b:"\"Allah has ninety-nine names. Whoever ihsaha (learns, understands and lives by) them will enter Paradise.\" \"To Allah belong the most beautiful names, so call on Him by them.\" Examples: ar-Rahman, ar-Rahim (the Most Merciful), al-Ghafur (the Forgiving), ar-Razzaq (the Provider), al-Hakim (the Wise), al-Wadud (the Loving). Knowing a name changes how you live: knowing al-Basir (the All-Seeing) brings ihsan; knowing ar-Razzaq removes worry about provision.",
s:["B:2736","M:2677","Q:7:180","Q:59:22-24"],
a:"Learn one name per day from now on. Today: al-Wadud, the Loving (Q 85:14).",
q:["How many names of Allah are mentioned in the famous hadith?",["Ninety-nine","Thirty-three","One thousand"],0]},
{t:"Living with the Qur'an",
b:"\"Recite the Qur'an, for it will come on the Day of Resurrection as an intercessor for its companions.\" \"Whoever reads a letter from the Book of Allah gets a good deed, and a good deed is multiplied by ten. I do not say Alif-Lam-Mim is a letter, but Alif is a letter, Lam is a letter and Mim is a letter.\" The one who recites with difficulty gets a double reward. Reciting one page a day finishes the Qur'an in about 20 months; four pages a day finishes it in about five months.",
s:["M:804","T:2910","M:798","Q:38:29"],
a:"Start a daily Qur'an plan from today. A realistic minimum is one page after Fajr, with its translation.",
q:["What reward does the one who recites with difficulty get?",["A double reward","No reward","Half reward"],0]}
];
// Track L — Character and life, including illness, death, funerals and the cemetery. Day 5 of each week.
const LIFE = [
{t:"Good Character",
b:"Allah praised His Prophet ﷺ: \"Indeed you are of a great moral character.\" When 'Aishah was asked about his character she said: \"His character was the Qur'an.\" He said: \"Nothing is heavier on the believer's Scale on the Day of Judgment than good character,\" and \"I was sent to perfect good character.\" Good character (husn al-khuluq) is part of the religion itself, not an extra. A person can pray and fast much and still be ruined by a sharp tongue.",
s:["Q:68:4","M:746","T:2002","AD:4799","Musnad Ahmad (Abu Hurayrah: \"I was sent to perfect good character\"; graded sahih)"],
a:"Choose one bad trait you know you have. Watch it all day and replace it with its opposite.",
q:["How did 'Aishah describe his character?",["His character was the Qur'an","He was strict","He was quiet"],0]},
{t:"Truthfulness",
b:"\"Truthfulness leads to righteousness, and righteousness leads to Paradise. A man keeps telling the truth until he is written with Allah as a truthful one. Lying leads to wickedness, and wickedness leads to the Fire.\" The signs of a hypocrite are three: when he speaks he lies, when he promises he breaks it, and when he is trusted he betrays. Lying includes jokes meant to deceive, exaggeration in sales, and false excuses.",
s:["B:6094","M:2607","B:33","M:59","Q:9:119"],
a:"Tell no lie today, not even a small one or a joke. Notice how often you are tempted.",
q:["What are the three signs of a hypocrite?",["Lying, breaking promises, betraying trust","Missing prayers, fasting, zakat","Anger, pride, envy"],0]},
{t:"Guarding the Tongue",
b:"\"Whoever believes in Allah and the Last Day, let him speak good or remain silent.\" The Prophet ﷺ defined backbiting (ghibah): \"Mentioning your brother with what he dislikes.\" If it is true, it is backbiting; if it is false, it is slander. Allah compares it to eating the flesh of your dead brother. Spreading tales between people (namimah) is also a major sin. Most of the sins people commit are through the tongue.",
s:["B:6018","M:47","M:2589","Q:49:12","B:6056"],
a:"Today, when a conversation turns into backbiting, change the subject or defend the absent person.",
q:["What is ghibah?",["Mentioning your brother with what he dislikes, even if true","Only lying about someone","Praising someone"],0]},
{t:"Controlling Anger",
b:"A man asked the Prophet ﷺ for advice. He said: \"Do not become angry.\" The man repeated his request several times and each time he said: \"Do not become angry.\" He also said: \"The strong one is not the one who wrestles others down, but the one who controls himself when angry.\" When angry: say A'udhu billahi minash-shaytanir-rajim, stay silent, sit down if standing, and make wudu'.",
s:["B:6116","B:6114","M:2609","B:3282","Q:3:134"],
a:"At the first sign of anger today, say \"A'udhu billahi minash-shaytanir-rajim\" and stay silent.",
q:["Who is truly strong according to the hadith?",["The one who controls himself when angry","The best wrestler","The richest man"],0]},
{t:"Honouring Parents",
b:"Allah placed kindness to parents right after His own worship: \"Your Lord has decreed that you worship none but Him, and that you be good to parents. If one or both reach old age with you, do not say to them 'uff', do not repel them, and speak to them with honour.\" A man asked who most deserves his good company. The Prophet ﷺ said: \"Your mother,\" three times, then: \"Your father.\" Disobeying parents is one of the major sins.",
s:["Q:17:23-24","Q:31:14","B:5971","M:2548","B:5976"],
a:"Do something for your mother or father today without being asked. If they have died, give charity or make du'a for them.",
q:["How many times did he say 'your mother' before 'your father'?",["Three","Once","Twice"],0]},
{t:"The Best to Their Family",
b:"\"The best of you are those who are best to their families, and I am the best of you to my family.\" 'Aishah was asked what he did at home: \"He was in the service of his family,\" and when the prayer came he went out to pray. He mended his own clothes, helped with work, raced 'Aishah, and played with his grandchildren. He kissed his grandson al-Hasan, and when a man said he never kissed his children, he said: \"Whoever does not show mercy will not be shown mercy.\"",
s:["T:3895","B:676","B:5997","Q:30:21","Q:4:19"],
a:"Help with a household task today and play with or hug a child in your family.",
q:["What was he doing at home according to 'Aishah?",["Serving his family","Only praying","Teaching only"],0]},
{t:"The Neighbour",
b:"\"Jibril kept advising me about the neighbour until I thought he would make him an heir.\" \"By Allah he does not believe, by Allah he does not believe, by Allah he does not believe: the one whose neighbour is not safe from his harm.\" Rights of a neighbour include greeting, helping, sharing food (\"when you cook a stew, add more water and share it with your neighbours\"), not causing noise or harm, and patience with their faults. This applies to non-Muslim neighbours too.",
s:["B:6014","M:2625","B:6016","M:2626","Q:4:36"],
a:"Bring something small to a neighbour today: food, a greeting, or an offer of help.",
q:["Who does not truly believe according to the hadith?",["One whose neighbour is not safe from his harm","One who does not visit his neighbour daily","One who has no neighbours"],0]},
{t:"Spreading Salam",
b:"\"You will not enter Paradise until you believe, and you will not believe until you love one another. Shall I tell you something that, if you do it, you will love one another? Spread salam among you.\" The full greeting is: As-salamu 'alaykum wa rahmatullahi wa barakatuh, worth 30 rewards. Replying is obligatory: \"When you are greeted, reply with something better or at least the same.\" The one riding greets the one walking, the walker greets the one sitting, the small group greets the large.",
s:["M:54","Q:4:86","AD:5195","B:6232"],
a:"Greet everyone you meet today with the full salam, including people you do not know.",
q:["Is replying to salam obligatory?",["Yes","No, it is optional","Only for scholars"],0]},
{t:"Rights of a Muslim",
b:"\"The rights of a Muslim on a Muslim are six: when you meet him, greet him; when he invites you, accept; when he asks your advice, advise him sincerely; when he sneezes and praises Allah, say Yarhamukallah; when he is sick, visit him; and when he dies, follow his funeral.\" These six turn a community into a family. They are simple, but most of us neglect at least one.",
s:["M:2162","B:1240"],
a:"Of the six rights, pick the one you neglect most and do it today.",
q:["Which is one of the six rights?",["Following his funeral","Lending him money","Praying behind him"],0]},
{t:"Visiting the Sick",
b:"In a hadith qudsi, Allah will say: \"O son of Adam, I was sick and you did not visit Me.\" He will say: \"How could I visit You when You are the Lord of the worlds?\" Allah says: \"Did you not know My servant was sick? Had you visited him you would have found Me with him.\" When visiting, the Prophet ﷺ would say: \"La ba'sa, tahurun in sha Allah\" (No harm, it is purification if Allah wills). Keep visits short, bring hope, and make du'a below seven times.",
ar:"أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ",
tl:"As'alullahal-'Azim, Rabbal-'arshil-'azim, an yashfiyak (7x)",
en:"I ask Allah the Mighty, Lord of the Mighty Throne, to heal you.",
s:["M:2569","B:3616","AD:3106","T:2083"],
a:"Visit or call a sick person this week, and say this du'a for them seven times.",
q:["What did the Prophet ﷺ say to the sick?",["La ba'sa, tahurun in sha Allah","Be patient, you will die","Nothing"],0]},
{t:"When Someone Is Dying",
b:"The Prophet ﷺ said: \"Prompt your dying ones to say La ilaha illallah,\" and \"Whoever's last words are La ilaha illallah will enter Paradise.\" Say it gently near them so they remember it; do not pressure them. When death comes, close the eyes, as the Prophet ﷺ did for Abu Salamah, saying: \"When the soul is taken, the sight follows it.\" Say only good, because the angels say Ameen to what you say. Then cover the body and prepare it for washing quickly.",
ar:"اللَّهُمَّ اغْفِرْ لِـ(فلان) وَارْفَعْ دَرَجَتَهُ فِي الْمَهْدِيِّينَ، وَاخْلُفْهُ فِي عَقِبِهِ فِي الْغَابِرِينَ، وَاغْفِرْ لَنَا وَلَهُ يَا رَبَّ الْعَالَمِينَ، وَافْسَحْ لَهُ فِي قَبْرِهِ وَنَوِّرْ لَهُ فِيهِ",
tl:"Allahummaghfir li (name), warfa' darajatahu fil-mahdiyyin, wakhlufhu fi 'aqibihi fil-ghabirin, waghfir lana wa lahu ya Rabbal-'alamin, wafsah lahu fi qabrihi wa nawwir lahu fih",
en:"O Allah, forgive (name), raise his rank among the guided, be his successor for those he left behind, forgive us and him, O Lord of the worlds, widen his grave and give him light in it.",
s:["M:916","AD:3116","M:920"],
a:"Learn this du'a. It is the du'a the Prophet ﷺ made when closing the eyes of Abu Salamah.",
q:["What should the dying person be gently reminded to say?",["La ilaha illallah","Their will","Surah Yasin"],0]},
{t:"The Funeral Prayer (Salat al-Janazah)",
b:"Salat al-Janazah is a communal obligation: if some perform it, the rest are freed of sin. It is prayed standing, without ruku' or sujud, with four takbirs. After the 1st takbir: al-Fatihah. After the 2nd: the Ibrahimiyyah salawat. After the 3rd: du'a for the deceased (below). After the 4th: a short pause or du'a, then taslim. \"Whoever attends a funeral until the prayer gets one qirat of reward, and until the burial, two qirats.\" Asked what two qirats are, he said: \"Like two great mountains.\"",
ar:"اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ، وَعَافِهِ وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ، وَوَسِّعْ مُدْخَلَهُ، وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ، وَنَقِّهِ مِنَ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الْأَبْيَضَ مِنَ الدَّنَسِ",
tl:"Allahummaghfir lahu warhamhu, wa 'afihi wa'fu 'anhu, wa akrim nuzulahu, wa wassi' mudkhalahu, waghsilhu bil-ma'i wath-thalji wal-barad, wa naqqihi minal-khataya kama naqqaytath-thawbal-abyada minad-danas",
en:"O Allah, forgive him and have mercy on him, give him well-being and pardon him, honour his arrival, widen his entrance, wash him with water, snow and hail, and cleanse him of sins as a white garment is cleansed of dirt.",
s:["M:963","B:1333","B:1325","M:945","B:1335"],
a:"Memorise the first line of the janazah du'a today: \"Allahummaghfir lahu warhamhu, wa 'afihi wa'fu 'anhu\". For a woman say: lahā, warhamhā, 'āfihā, 'anhā.",
q:["How many takbirs are in the funeral prayer?",["Four","Two","Six"],0]},
{t:"The Burial",
b:"When placing the body in the grave, on its right side facing the qiblah, say: \"Bismillah wa 'ala millati Rasulillah\" (In the name of Allah and upon the religion of the Messenger of Allah). Graves should be simple and level, not built up high. After the burial the Prophet ﷺ stood by the grave and said: \"Ask forgiveness for your brother and ask Allah to make him firm, for he is now being questioned.\"",
ar:"بِسْمِ اللَّهِ وَعَلَى مِلَّةِ رَسُولِ اللَّهِ",
tl:"Bismillahi wa 'ala millati Rasulillah",
en:"In the name of Allah and upon the religion of the Messenger of Allah.",
s:["AD:3213","T:1046","AD:3221","M:969"],
a:"At the next burial you attend, stay after it and make du'a: \"Allahummaghfir lahu, Allahumma thabbithu\" (O Allah forgive him, O Allah make him firm).",
q:["Why did the Prophet ﷺ ask people to pray for the deceased right after burial?",["He is being questioned now","To finish the ceremony","It is a cultural custom"],0]},
{t:"Visiting the Cemetery",
b:"\"I had forbidden you from visiting graves, but now visit them, for they remind you of the Hereafter.\" When entering the cemetery, the Prophet ﷺ taught the greeting below. Etiquette: visit to remember death and pray for the dead; do not sit or walk on graves (\"Do not sit on graves and do not pray towards them\"); do not wail; and never ask the dead for help or make du'a to them. Du'a is made to Allah, for them.",
ar:"السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَلَاحِقُونَ، أَسْأَلُ اللَّهَ لَنَا وَلَكُمُ الْعَافِيَةَ",
tl:"As-salamu 'alaykum ahlad-diyari minal-mu'minina wal-muslimin, wa inna in sha Allahu bikum lalahiqun, as'alullaha lana wa lakumul-'afiyah",
en:"Peace be upon you, people of the dwellings, from among the believers and the Muslims. We will, if Allah wills, join you. I ask Allah for well-being for us and for you.",
s:["M:977","M:975","M:972","M:974"],
a:"Memorise this greeting today. Plan a visit to a cemetery this month to remember death and pray for the deceased.",
q:["Which of these is forbidden at the cemetery?",["Asking the dead for help","Greeting the dead with salam","Making du'a for them"],0]},
{t:"Condolence and Grief",
b:"When his grandson was dying, the Prophet ﷺ sent this message to his daughter: \"To Allah belongs what He took and to Him belongs what He gave, and everything with Him has an appointed term, so be patient and hope for reward.\" When his son Ibrahim died, his eyes filled with tears and he said: \"The eye sheds tears and the heart grieves, but we say only what pleases our Lord.\" Crying is allowed; wailing, tearing clothes and complaining against Allah are not. Mourning is up to three days, and four months and ten days for a widow.",
ar:"إِنَّ لِلَّهِ مَا أَخَذَ، وَلَهُ مَا أَعْطَى، وَكُلُّ شَيْءٍ عِنْدَهُ بِأَجَلٍ مُسَمًّى، فَلْتَصْبِرْ وَلْتَحْتَسِبْ",
tl:"Inna lillahi ma akhadha wa lahu ma a'ta, wa kullu shay'in 'indahu bi ajalin musamma, faltasbir waltahtasib",
en:"To Allah belongs what He took and to Him belongs what He gave, and everything with Him has an appointed term, so be patient and seek reward.",
s:["B:1284","M:923","B:1303","B:1280","B:1294"],
a:"Learn this condolence phrase so you have the right words when someone loses a loved one.",
q:["Is crying over a death permitted?",["Yes, but not wailing or complaining against Allah","No, never","Only for women"],0]},
{t:"What Benefits the Dead",
b:"\"When a person dies, his deeds end except three: ongoing charity (sadaqah jariyah), knowledge that benefits others, or a righteous child who prays for him.\" A man told the Prophet ﷺ his mother died suddenly and asked if she would be rewarded if he gave charity for her. He said: \"Yes.\" Du'a, istighfar, charity, paying their debts, and Hajj on their behalf benefit the dead, as established in authentic hadith. Examples of sadaqah jariyah today: a water well, a mosque, sharing beneficial knowledge, planting a tree.",
s:["M:1631","B:1388","M:1004","B:1852","Q:59:10"],
a:"Start a sadaqah jariyah for yourself or a deceased relative: contribute to a well, a mosque, or a copy of the Qur'an.",
q:["Which of these continues after death?",["A righteous child who prays for you","Your house","Your job title"],0]},
{t:"Halal Earnings",
b:"\"Allah is Good and accepts only what is good.\" The Prophet ﷺ mentioned a man on a long journey, dishevelled, raising his hands to the sky saying \"O Lord, O Lord,\" while his food, drink and clothing were haram, and asked: \"How can he be answered?\" He also said: \"No one has eaten better food than what he eats from the work of his own hands; the Prophet Dawud ate from the work of his hands.\" Halal income is a condition for answered du'a.",
s:["M:1015","B:2072","B:52","M:1599"],
a:"Review your sources of income. If any part is doubtful, ask a qualified scholar and make a plan to clean it.",
q:["What prevented the traveller's du'a from being answered?",["His food, drink and clothing were haram","He did not raise his hands","He was travelling"],0]},
{t:"Riba and Honest Trade",
b:"Allah forbade riba (interest/usury) in the strongest terms, declaring war from Allah and His Messenger on those who persist in it. The Prophet ﷺ cursed the one who takes it, the one who pays it, the one who writes it, and the two witnesses. Honest trade is blessed: \"The buyer and seller have the option as long as they have not separated. If they are truthful and make things clear, their sale is blessed; if they hide and lie, the blessing of their sale is erased.\"",
s:["Q:2:275-279","M:1598","B:2079","M:1532"],
a:"Check your loans, cards and savings for interest. Learn about the Islamic alternatives available where you live.",
q:["What is declared on those who persist in riba?",["War from Allah and His Messenger","A small fine","Nothing"],0]},
{t:"Your Time",
b:"\"There are two blessings in which many people are cheated: health and free time.\" Ibn 'Umar reported that the Prophet ﷺ took him by the shoulder and said: \"Be in this world as if you were a stranger or a traveller.\" Ibn 'Umar used to say: \"In the evening do not wait for the morning, and in the morning do not wait for the evening. Take from your health for your sickness and from your life for your death.\" Allah swears by time in Surah al-'Asr.",
s:["B:6412","B:6416","Q:103:1-3"],
a:"Read Surah al-'Asr. Track your screen time today and move 10 minutes of it to Qur'an or dhikr.",
q:["Which two blessings are many people cheated in?",["Health and free time","Wealth and children","Food and sleep"],0]},
{t:"Small and Consistent",
b:"\"The most beloved deeds to Allah are the most consistent, even if they are small.\" 'Aishah said that when the Prophet ﷺ did a deed he made it constant. He also said: \"This religion is easy. No one makes it too hard for himself except that it overcomes him. So be balanced, come close, and have glad tidings.\" This is why your 10 minutes every morning matter more than one long session that you cannot keep.",
s:["B:6464","M:783","B:39"],
a:"Pick one small deed you will do every day for life (e.g., 10 verses, or Sayyid al-Istighfar). Start today.",
q:["Which deeds are most beloved to Allah?",["The most consistent, even if small","The longest","Those done in Ramadan only"],0]},
{t:"Mercy to All Creation",
b:"\"Those who are merciful will be shown mercy by the Most Merciful. Be merciful to those on earth, and the One above the heavens will be merciful to you.\" Allah made mercy into one hundred parts; He kept ninety-nine and sent one part to the earth, and from that one part creatures are merciful to each other, so that a mare lifts her hoof away from her foal. The Prophet ﷺ was sent as a mercy to all the worlds, including animals and non-Muslims.",
s:["T:1924","AD:4941","B:6000","M:2752","Q:21:107"],
a:"Show mercy to an animal or a stranger today in a practical way.",
q:["Into how many parts did Allah divide mercy?",["One hundred","Ten","Seven"],0]},
{t:"Seeking Knowledge",
b:"\"Whoever takes a path to seek knowledge, Allah makes easy for him a path to Paradise.\" \"When Allah wants good for someone, He gives him understanding of the religion.\" The only thing Allah told His Prophet ﷺ to ask for more of is knowledge: \"My Lord, increase me in knowledge.\" Learn from reliable teachers with sound chains of learning, and be careful with social media content without sources.",
ar:"رَبِّ زِدْنِي عِلْمًا",
tl:"Rabbi zidni 'ilma",
en:"My Lord, increase me in knowledge.",
s:["M:2699","B:71","Q:20:114","Q:39:9"],
a:"Find one qualified local teacher or a reliable course to continue after these 6 months.",
q:["What is the only thing the Prophet ﷺ was told to ask more of?",["Knowledge","Wealth","Children"],0]},
{t:"Haya', Modesty",
b:"\"Faith has over seventy branches, and haya' is a branch of faith.\" The Prophet ﷺ was more modest than a virgin girl behind her curtain. Haya' is a feeling of shyness before Allah and people that stops you from what is shameful. It includes lowering the gaze, which Allah commands to both men and women, modest dress, and clean speech. \"Haya' brings nothing but good.\"",
s:["B:9","M:35","B:3562","Q:24:30-31","B:6117"],
a:"Lower your gaze today, on the street and on your screen.",
q:["Haya' is described as a branch of what?",["Faith","Knowledge","Wealth"],0]},
{t:"Gratitude and Patience",
b:"\"How amazing is the affair of the believer! All of it is good, and this is only for the believer. If something good happens he is grateful, and that is good for him. If something bad happens he is patient, and that is good for him.\" Allah promises: \"If you are grateful, I will surely increase you.\" Gratitude is in the heart (recognising the blessing comes from Allah), on the tongue (Alhamdulillah), and in action (using the blessing to obey Him).",
s:["M:2999","Q:14:7","Q:2:152","Q:39:10"],
a:"Write down 5 specific blessings from today and say Alhamdulillah for each.",
q:["What does Allah promise the grateful?",["Increase","Nothing more","A test"],0]},
{t:"Forgiveness and Mending Ties",
b:"\"It is not lawful for a Muslim to cut off his brother for more than three days, each turning away when they meet. The better of them is the one who gives the greeting first.\" Deeds are presented on Mondays and Thursdays, and Allah forgives everyone except two people who are in a dispute; it is said: \"Leave these two until they reconcile.\" Allah asks: \"Let them pardon and overlook. Do you not love that Allah should forgive you?\"",
s:["B:6077","M:2560","M:2565","Q:24:22","B:5984"],
a:"Send salam to someone you are on bad terms with. Be the one who greets first.",
q:["Who is the better of two people in a dispute?",["The one who greets first","The one who was right","The older one"],0]},
{t:"Remembering Death, Living Well",
b:"\"Remember often the destroyer of pleasures,\" meaning death. Remembering death is not meant to make you sad; it puts life in order. The Prophet ﷺ was asked who is the wisest of believers. He said: \"Those who remember death most and prepare best for what comes after it.\" You have finished six months. The goal was never to finish an app, but to keep these habits until you meet Allah. Keep praying on time, keep your morning adhkar, and keep learning with a qualified teacher.",
s:["T:2307","IM:4259","Q:3:185","Q:15:99"],
a:"Write your plan for the next six months: which habits will you keep, and who will you learn from next?",
q:["Why do we remember death?",["To prepare and put life in order","To be sad","It is not recommended"],0]}
];
// Traductions françaises — Parcours S (Vie du Prophète ﷺ)
const FR_SEERAH = [
{t:"L'Arabie avant le Message",
b:"La Mecque était une ville commerçante bâtie autour de la Ka'ba, la Maison qu'Ibrahim et son fils Isma'il élevèrent pour l'adoration d'Allah seul. Au fil des siècles, les Arabes la remplirent d'idoles, environ 360. Les tribus se battaient pour de petites offenses, les pauvres n'avaient aucune protection, et certaines familles enterraient vivantes leurs petites filles. Les musulmans appellent cette époque al-Jahiliyya, l'âge de l'ignorance. Quelques personnes, les hunafa', restaient attachées à la foi d'Ibrahim. L'année de la naissance du Prophète ﷺ, Abraha vint du Yémen avec un éléphant pour détruire la Ka'ba, et Allah anéantit son armée.",
a:"Lisez lentement la sourate al-Fil (105) avec sa traduction. Pensez à la manière dont Allah a protégé Sa Maison avant même la naissance du Prophète ﷺ.",
q:["Quel événement a marqué l'année de naissance du Prophète ﷺ ?",["L'armée de l'Éléphant fut anéantie","La Ka'ba fut reconstruite","La première révélation descendit"],0]},
{t:"Naissance et orphelinat",

a:"Faites aujourd'hui un geste de bonté envers un orphelin ou une personne seule, même un message ou un petit cadeau. Lisez la sourate ad-Duha (93).",
q:["Qui éleva le Prophète ﷺ après la mort de son grand-père ?",["Son oncle Abu Talib","Son oncle Abu Lahab","Halima as-Sa'diyya"],0]},
{t:"Halima et l'ouverture de la poitrine",
