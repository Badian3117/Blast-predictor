<style>
/* Layout: one reading column, like a pocket book opened at dawn. A horizon band tops the page; the day's lesson is the page. */
:root{
  --bg:#ECEFF3; --surface:#FBFCFD; --sunk:#E2E7ED; --ink:#141D2B; --muted:#566273; --line:#D3DAE2;
  --accent:#A9561F; --accent-soft:#F3E3D6; --on-accent:#FFFFFF;
  --ok:#2C7656; --ok-soft:#DCEFE6; --bad:#A93838; --bad-soft:#F6E0E0;
  --t1:#A9561F; --t2:#2D6886; --t3:#71508F; --t4:#2C7656; --t5:#8C6516;
  --night:#1B2540; --dawn:#D98A4E;
  --f-display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ar:"Amiri", "Traditional Arabic", "Geeza Pro", serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1320; --surface:#151D2D; --sunk:#1C2638; --ink:#E8EBF1; --muted:#9AA4B5; --line:#273247;
  --accent:#E59A5F; --accent-soft:#3A2A20; --on-accent:#1A1008;
  --ok:#5FC195; --ok-soft:#173326; --bad:#EE8080; --bad-soft:#3A1E22;
  --t1:#E59A5F; --t2:#6FB3D6; --t3:#B596D6; --t4:#5FC195; --t5:#D9B25E;
  --night:#070B14; --dawn:#C47A40; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1320; --surface:#151D2D; --sunk:#1C2638; --ink:#E8EBF1; --muted:#9AA4B5; --line:#273247;
  --accent:#E59A5F; --accent-soft:#3A2A20; --on-accent:#1A1008;
  --ok:#5FC195; --ok-soft:#173326; --bad:#EE8080; --bad-soft:#3A1E22;
  --t1:#E59A5F; --t2:#6FB3D6; --t3:#B596D6; --t4:#5FC195; --t5:#D9B25E;
  --night:#070B14; --dawn:#C47A40; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;margin:0}
.horizon{background:linear-gradient(180deg,var(--night) 0%,var(--night) 55%,var(--dawn) 135%);color:#F2EEE8}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{padding-block:20px 18px;display:grid;gap:14px}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;line-height:1}
.brand small{font-family:var(--f-ui);font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-left:8px}
.clock{font-family:var(--f-ui);font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
.meter{display:grid;gap:6px}
.meter-line{display:flex;justify-content:space-between;font-family:var(--f-ui);font-size:12.5px;letter-spacing:.04em;opacity:.9;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#E8B07F,#F6D9A8);border-radius:3px;transition:width .4s}
nav.tabs{display:flex;gap:4px;font-family:var(--f-ui)}
nav.tabs button{flex:1;background:transparent;border:0;color:#F2EEE8;opacity:.7;padding:9px 6px;font:inherit;font-size:14px;font-weight:500;border-bottom:2px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:#F0BE8C}
nav.tabs button:focus-visible{outline:2px solid #F0BE8C;outline-offset:2px}
main{padding-block:22px 64px;display:grid;gap:18px}
.eyebrow{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-family:var(--f-ui);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--sunk);color:var(--tc,var(--ink))}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tc,var(--muted))}
h2.title{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,6vw,40px);line-height:1.08;margin:6px 0 0;text-wrap:balance}
.body p{margin:0 0 12px;max-width:65ch}
.arabic{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px;display:grid;gap:10px}
.arabic .ar{font-family:var(--f-ar);font-size:27px;line-height:1.9;text-align:right;direction:rtl}
.arabic .tl{font-family:var(--f-ui);font-size:14.5px;color:var(--muted);font-style:italic}
.arabic .en{font-size:16px}
.act{background:var(--accent-soft);border-radius:10px;padding:14px 16px;display:grid;gap:4px}
.act b{font-family:var(--f-ui);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sec-h{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sources{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-family:var(--f-ui);font-size:14px}
.sources li{display:flex;gap:10px;align-items:baseline}
.tier{flex:none;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--muted);min-width:64px;text-align:center}
.tier.q{color:var(--t4)} .tier.s{color:var(--t2)} .tier.h{color:var(--t3)} .tier.b{color:var(--t5)}
a{color:var(--accent);text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.quiz{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:10px}
.quiz .qq{font-weight:600;margin:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:inherit;font-family:var(--f-ui);font-size:15px;padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.opt[disabled]{cursor:default}
.fb{font-family:var(--f-ui);font-size:14px;margin:0}
.btn{font:inherit;font-family:var(--f-ui);font-weight:600;font-size:15px;border-radius:8px;padding:12px 18px;border:1px solid transparent;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px}
.panel h3{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.15}
.muted{color:var(--muted)}
.small{font-family:var(--f-ui);font-size:13.5px}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:var(--f-ui)}
.timer .t{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer .lbl{font-size:13px;color:var(--muted)}
.banner{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:16px;display:grid;gap:10px;font-family:var(--f-ui);font-size:15px}
.banner input,.panel input{font:inherit;font-family:var(--f-ui);padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.weeks{display:grid;gap:6px}
.wk{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;font-family:var(--f-ui);font-size:12.5px}
.wk .lab{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.cells{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1;max-width:100%;border-radius:5px;border:1px solid var(--line);background:var(--surface);cursor:pointer;padding:0;font:inherit;font-size:11px;color:var(--muted);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cell.done{background:var(--tc);border-color:var(--tc);color:var(--surface)}
.cell.today{outline:2px solid var(--accent);outline-offset:1px}
.cell.locked{opacity:.38;cursor:not-allowed}
.cell.pr,.cell.rv{border-style:dashed}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--f-ui);font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--tc)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--f-ui)}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.card .ar{font-family:var(--f-ar);font-size:24px;line-height:1.8;direction:rtl;text-align:right}
.card .hide{color:var(--muted);font-family:var(--f-ui);font-size:13px}
.check{display:flex;gap:10px;align-items:flex-start;font-family:var(--f-ui);font-size:15px;line-height:1.45}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--ok);flex:none}
.list{display:grid;gap:10px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:left}
.prose p{margin:0 0 10px;max-width:65ch}
.prose ul{margin:0 0 10px;padding-left:20px}
.status{font-family:var(--f-ui);font-size:12.5px;color:var(--muted)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.score{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1}
@media (max-width:420px){ .stats{grid-template-columns:repeat(3,minmax(0,1fr))} .stat b{font-size:20px} body{font-size:16.5px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:999px;overflow:hidden;font-family:var(--f-ui)}
.lang button{background:transparent;border:0;color:#F2EEE8;font:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;padding:4px 10px;cursor:pointer;opacity:.7}
.lang button[aria-pressed="true"]{background:rgba(255,255,255,.18);opacity:1}
.brandright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.passage summary{cursor:pointer;padding:12px 14px;display:grid;gap:2px;font-family:var(--f-ui);font-size:15px}
.passage .sar{font-family:var(--f-ar);font-size:18px;margin-left:6px}
.pbody{padding:4px 14px 14px;display:grid;gap:14px;border-top:1px solid var(--line)}
.verse{display:grid;gap:4px;padding-top:10px}
.qar{font-family:"Amiri Quran",var(--f-ar);font-size:26px;line-height:2.1;text-align:right;direction:rtl}
.vno{font-size:.8em;color:var(--accent)}
.qtl{font-family:var(--f-ui);font-size:14.5px;font-style:italic;color:var(--muted)}
.vn{font-style:normal;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;margin-right:4px}
.qtr{font-size:16px}
.pctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:12px}
.pstate{font-family:var(--f-ui);color:var(--accent);font-weight:600;min-height:1.2em}
.pchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--f-ui)}
.plab{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-left:4px;display:inline-flex;gap:6px;align-items:center}
.pchip{font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.pchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.psel{font:inherit;font-size:13px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
.verse{border-radius:8px;padding:10px 8px 8px;margin:0 -8px;transition:background .25s}
.verse.playing{background:var(--accent-soft)}
.verse.playing .qtl{color:var(--ink)}
.vplay{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:11px;cursor:pointer;margin-right:8px;vertical-align:middle;padding:0}
.hidetr .qtr{display:none}
.hidetr .qtl{font-size:16px}
</style>
</head>

 <div class="brandrow"><h1 class="brand">Fajr Ten<small id="tagline">Six mois · dix minutes par jour</small></h1><div class="brandright"><span class="clock" id="clock"></span><div class="lang" role="group" aria-label="Langue / Language"><button data-act="lang" data-l="fr" aria-pressed="false">FR</button><button data-act="lang" data-l="en" aria-pressed="false">EN</button></div></div></div>

<script>
// Track S — The life of the Prophet ﷺ (chronological). One lesson per week, day 1.
const SEERAH = [
{t:"Arabia before the Message",
b:"Mecca was a trading town built around the Ka'bah, the House that Ibrahim and his son Isma'il raised for the worship of Allah alone. Over the centuries the Arabs filled it with idols, about 360 of them. Tribes fought over small insults, the poor had no protection, and some families buried baby girls alive. Muslims call this time al-Jahiliyyah, the age of ignorance. Some people, called hunafa', still held on to the faith of Ibrahim. In the year the Prophet ﷺ was born, Abrahah came from Yemen with an elephant to destroy the Ka'bah, and Allah destroyed his army.",
s:["Q:2:127","Q:105:1-5","Q:81:8-9","RM"],
a:"Read Surah al-Fil (105) slowly with its meaning. Think about how Allah protected His House before the Prophet ﷺ was even born.",
q:["What was the event in the year of the Prophet's ﷺ birth?",["The army of the Elephant was destroyed","The Ka'bah was rebuilt","The first revelation came"],0]},
{t:"Birth and Orphanhood",
b:"Muhammad ibn 'Abdillah ﷺ was born in Mecca in the Year of the Elephant (about 570 CE), into the clan of Banu Hashim of Quraysh. He said he was born on a Monday. His father 'Abdullah died before he was born. His mother Aminah died when he was about six, at al-Abwa'. His grandfather 'Abd al-Muttalib cared for him until he died two years later, and then his uncle Abu Talib raised him. Allah later reminded him of this: \"Did He not find you an orphan and give you shelter?\"",
s:["M:1162","Q:93:6-11","IH","RM"],
a:"Do one kind act for an orphan or for someone alone today, even a message or a small gift. Read Surah ad-Duha (93).",
q:["Who raised the Prophet ﷺ after his grandfather died?",["His uncle Abu Talib","His uncle Abu Lahab","Halimah as-Sa'diyyah"],0]},
{t:"Halimah and the Opening of the Chest",
b:"Meccan families sent babies to the desert to grow strong and learn pure Arabic. The Prophet ﷺ was nursed by Halimah of Banu Sa'd, whose household was blessed while he lived with them. As a young boy, Jibril came to him while he played, opened his chest, took out a clot and said: \"This was Shaytan's share of you.\" He washed his heart with Zamzam water in a golden basin and returned it. The other boys ran to his nurse saying Muhammad had been killed. Anas said he later saw the trace of the stitching on his chest.",
s:["M:162","IH"],
a:"Ask Allah today to purify your heart: \"Allahumma tahhir qalbi\" (O Allah, purify my heart).",
q:["What did Jibril use to wash the young Prophet's ﷺ heart?",["Zamzam water","Rain water","Milk"],0]},
{t:"The Trustworthy Young Man",
b:"As a young man the Prophet ﷺ worked as a shepherd for the people of Mecca. He said: \"Allah did not send any prophet who did not herd sheep.\" Shepherding teaches patience, care and responsibility for the weak. Later he travelled with trade caravans. He never worshipped idols and never joined the drinking and vice of his people. Quraysh called him al-Amin, the Trustworthy, and left their valuables with him. Even his enemies kept their deposits with him after he began preaching.",
s:["B:2262","IH","RM"],
a:"Keep every promise you make today, even small ones. Honesty was his reputation long before prophethood.",
q:["What title did Quraysh give him before prophethood?",["Al-Amin, the Trustworthy","Al-Faruq","As-Siddiq"],0]},
{t:"Marriage to Khadijah",
b:"Khadijah bint Khuwaylid was a noble and wealthy businesswoman. She hired Muhammad ﷺ to trade for her in Syria and was impressed by his honesty and the blessing in his trade. She proposed marriage through a friend. According to the seerah sources he was about 25 and she was about 40. It was a marriage of love, trust and support. He did not marry anyone else while she lived. Their children were al-Qasim, 'Abdullah, Zaynab, Ruqayyah, Umm Kulthum and Fatimah. Both sons died young.",
s:["IH","RM","B:3818"],
a:"Thank your spouse or a family member for one specific thing they do for you.",
q:["Did the Prophet ﷺ marry another wife while Khadijah was alive?",["No","Yes, one","Yes, two"],0]},
{t:"The Black Stone Dispute",
b:"When the Prophet ﷺ was about 35, Quraysh rebuilt the Ka'bah after it was damaged by a flood. When it came time to put the Black Stone back in place, each clan wanted that honour, and they nearly fought. They agreed that the first man to enter the sanctuary would judge. It was Muhammad ﷺ. He placed the stone on a cloth, asked the chief of each clan to hold an edge and lift it together, and then set it in place with his own hands. Everyone was satisfied and no blood was spilled.",
s:["IH","RM"],
a:"If there is tension between two people you know, look for a fair solution where both sides keep their dignity.",
q:["How did he settle the dispute?",["Each clan lifted the stone on a cloth together","He drew lots","He gave the honour to his own clan"],0]},
{t:"The Cave of Hira",
b:"In the years before prophethood, the Prophet ﷺ loved to be alone in the cave of Hira, on a mountain near Mecca, to worship and reflect. At age forty, during Ramadan, the angel Jibril came to him and said: \"Read!\" He answered: \"I am not a reader.\" The angel pressed him three times, then recited the first verses ever revealed: \"Read in the name of your Lord who created, created man from a clinging clot. Read, and your Lord is the Most Generous, who taught by the pen, taught man what he did not know.\"",
s:["B:3","Q:96:1-5","Q:97:1"],
a:"Memorise Surah al-'Alaq verses 1–5 with their meaning. These were the first words of the Qur'an to reach mankind.",
q:["What was the first word revealed?",["Iqra' (Read)","Qul (Say)","Bismillah"],0]},
{t:"Khadijah's Comfort and Waraqah",
b:"The Prophet ﷺ returned home shaking and said: \"Cover me, cover me!\" When his fear passed he told Khadijah what happened. She said: \"By Allah, Allah will never disgrace you. You keep ties of kinship, you carry the burden of the weak, you help the poor, you honour guests and you support people in times of hardship.\" She took him to her cousin Waraqah ibn Nawfal, a Christian scholar, who said: \"This is the same Angel whom Allah sent to Musa,\" and wished he would live to support him when his people drove him out.",
s:["B:3","Q:74:1-5"],
a:"Look at the five qualities Khadijah listed. Choose one and practise it today.",
q:["Who was Waraqah ibn Nawfal?",["Khadijah's cousin, a Christian scholar","The Prophet's uncle","A chief of Quraysh"],0]},
{t:"The First Believers",
b:"For about three years the call was quiet, to close family and trusted friends. The first to believe was Khadijah. Among men it was Abu Bakr, among boys 'Ali ibn Abi Talib, then about ten years old, and among freed slaves Zayd ibn Harithah. Abu Bakr brought others to Islam, including 'Uthman ibn 'Affan, az-Zubayr, 'Abd ar-Rahman ibn 'Awf, Sa'd ibn Abi Waqqas and Talhah. They met secretly in the house of al-Arqam ibn Abi al-Arqam to learn the Qur'an.",
s:["IH","RM"],
a:"Share one beneficial thing you learned this week with a friend or relative. Abu Bakr's da'wah started with his friends.",
q:["Who was the first person to accept Islam?",["Khadijah","Abu Bakr","'Ali"],0]},
{t:"The Call from Mount Safa",
b:"When Allah revealed \"And warn your nearest relatives\", the Prophet ﷺ climbed Mount as-Safa and called the clans of Quraysh. He asked: \"If I told you that an army was behind this valley about to attack you, would you believe me?\" They said: \"We have only known you to tell the truth.\" He said: \"Then I am a warner to you before a severe punishment.\" His uncle Abu Lahab said: \"May you perish! Is this why you gathered us?\" Allah then revealed Surah al-Masad about Abu Lahab.",
s:["B:4770","Q:26:214","Q:111:1-5"],
a:"Read Surah al-Masad (111). Notice that his uncle's family tie did not save him; faith and deeds do.",
q:["Why did Quraysh say they would believe him?",["They had only known him to tell the truth","He was rich","He was their chief"],0]},
{t:"Patience under Persecution",
b:"Quraysh tortured the weak Muslims. Bilal, an Abyssinian slave, was laid on burning sand with a rock on his chest by his master Umayyah ibn Khalaf, and kept saying: \"Ahad, Ahad\" (One, One). Abu Bakr bought him and freed him. Yasir, his wife Sumayyah and their son 'Ammar were tortured together. The Prophet ﷺ passed by and said: \"Patience, family of Yasir, your appointment is Paradise.\" Sumayyah was killed by Abu Jahl and became the first martyr of Islam.",
s:["IH","RM","Q:29:2-3"],
a:"When something is hard for you today, say \"Hasbunallahu wa ni'mal-wakil\" (Allah is enough for us and the best Protector) - Q 3:173.",
q:["Who was the first martyr in Islam?",["Sumayyah","Bilal","Hamzah"],0]},
{t:"The Migration to Abyssinia",
b:"In the fifth year of prophethood, the Prophet ﷺ advised a group of Muslims to migrate to Abyssinia, where a just Christian king, an-Najashi, ruled. Quraysh sent 'Amr ibn al-'As to bring them back. Ja'far ibn Abi Talib spoke for the Muslims: they had worshipped idols, eaten dead animals and wronged neighbours until Allah sent a Messenger who taught truthfulness, trust, kinship and worship of Allah alone. He recited the beginning of Surah Maryam. The king wept and refused to hand them over.",
s:["Ahmad 1740 (Umm Salamah; graded hasan)","Q:19:16-36","IH"],
a:"Read the first 36 verses of Surah Maryam, the passage Ja'far recited to the king.",
q:["Which surah did Ja'far recite to an-Najashi?",["Maryam","Yusuf","Al-Kahf"],0]},
{t:"The Boycott and the Year of Sorrow",
b:"Quraysh signed a pact to boycott Banu Hashim: no trade, no marriage. For about three years the Prophet ﷺ, his family and the Muslims were confined to the valley of Abu Talib. They ate leaves and the cries of hungry children could be heard. The boycott ended, but soon after, in the tenth year of prophethood, both Abu Talib and Khadijah died. This is called the Year of Sorrow. He lost his protector and his closest support within a short time.",
s:["IH","RM","B:3884"],
a:"Call or visit someone who has lost a loved one this year.",
q:["Who died in the Year of Sorrow?",["Khadijah and Abu Talib","Hamzah and Abu Talib","Abu Bakr and Khadijah"],0]},
{t:"The Day of Ta'if",
b:"The Prophet ﷺ walked to Ta'if to invite its people. They rejected him and sent children and slaves to throw stones at him until his feet bled. He later told 'Aishah this was the hardest day he faced. Jibril came with the Angel of the Mountains, who offered to crush Ta'if between two mountains. The Prophet ﷺ said: \"No. I hope that Allah will bring from their descendants people who worship Allah alone without partners.\"",
s:["B:3231","M:1795"],
a:"Forgive someone who hurt you today, and pray for their guidance instead of against them.",
q:["What did he answer the Angel of the Mountains?",["He hoped their descendants would worship Allah","He asked for their punishment","He asked to go home"],0]},
{t:"Al-Isra' wal-Mi'raj",
b:"After the Year of Sorrow, Allah honoured His Messenger with the Night Journey. He was taken on al-Buraq from Mecca to al-Masjid al-Aqsa in Jerusalem, where he led the prophets in prayer. Then he ascended through the heavens, met prophets including Adam, 'Isa, Yusuf, Idris, Harun, Musa and Ibrahim, and reached Sidrat al-Muntaha. There Allah prescribed fifty prayers, which were reduced, at Musa's advice, to five, with the reward of fifty. Abu Bakr believed it immediately and was called as-Siddiq.",
s:["Q:17:1","B:3887","M:162"],
a:"Pray each of today's five prayers on time. They were the gift given directly in the heavens.",
q:["How many daily prayers were first prescribed?",["Fifty, reduced to five","Five from the start","Three"],0]},
{t:"The Pledges of 'Aqabah",
b:"During the pilgrimage season the Prophet ﷺ met men from Yathrib (later Madinah). Six of them accepted Islam. The next year twelve came and gave the First Pledge of 'Aqabah: not to associate partners with Allah, not to steal, not to commit adultery, not to kill their children and not to disobey him in good. He sent Mus'ab ibn 'Umayr with them as the first teacher of Islam. A year later 73 men and 2 women gave the Second Pledge, promising to protect him as they protected their own families.",
s:["B:18","IH","RM"],
a:"Renew your own pledge: list the commitments of the First Pledge and check yourself against each.",
q:["Who was sent as the first teacher to Madinah?",["Mus'ab ibn 'Umayr","Abu Bakr","'Ali"],0]},
{t:"The Hijrah",
b:"Quraysh plotted to kill the Prophet ﷺ. He left his house at night while 'Ali slept in his bed, and left with Abu Bakr. They hid three nights in the Cave of Thawr. When the trackers stood at the cave entrance, Abu Bakr said: \"If one of them looks at his feet, he will see us.\" The Prophet ﷺ said: \"What do you think of two, when Allah is their third?\" Suraqah ibn Malik chased them for the reward, but his horse's legs sank into the sand. This Hijrah in 622 CE is the start of the Islamic calendar.",
s:["Q:9:40","B:3653","B:3906"],
a:"When you feel worried today, remember his words: \"Do not grieve, Allah is with us\" (Q 9:40).",
q:["Where did they hide for three nights?",["The Cave of Thawr","The Cave of Hira","The house of al-Arqam"],0]},
{t:"Building Madinah",
b:"The Prophet ﷺ stopped first at Quba', where he built the first mosque. In Madinah he built his Mosque with his own hands. Then he paired each Muhajir (emigrant) with an Ansari (helper) as brothers. Sa'd ibn ar-Rabi' offered 'Abd ar-Rahman ibn 'Awf half his wealth; 'Abd ar-Rahman thanked him and asked only to be shown the market. 'Abdullah ibn Salam said the first words he heard from the Prophet ﷺ were: \"Spread the greeting of peace, feed people, keep family ties, and pray at night while people sleep, and you will enter Paradise in peace.\"",
s:["Q:9:108","B:2049","T:2485"],
a:"Do all four today: greet people with salam, feed someone, contact a relative, and pray two rak'ahs at night.",
q:["What did 'Abd ar-Rahman ibn 'Awf ask from his brother?",["To be shown the market","Half his wealth","A house"],0]},
{t:"The Battle of Badr",
b:"In Ramadan of the second year after Hijrah, about 313 Muslims faced an army of about 1,000 from Quraysh at Badr. The Prophet ﷺ spent the night in prayer, raising his hands until his cloak fell from his shoulders, begging Allah for His promised help. Allah sent angels and the Muslims won a decisive victory. Abu Jahl, the fiercest enemy of Islam, was killed. Allah calls it the Day of Criterion, the day that separated truth from falsehood.",
s:["Q:3:123","Q:8:9-12","Q:8:41","M:1763"],
a:"Make a long, sincere du'a today with raised hands, as he did at Badr.",
q:["About how many Muslims fought at Badr?",["313","1,000","3,000"],0]},
{t:"The Lesson of Uhud",
b:"In the third year, Quraysh came for revenge with about 3,000 men. The Prophet ﷺ placed 50 archers on a hill and told them not to leave it whatever happened. The Muslims were winning, but most archers came down to collect the spoils. Khalid ibn al-Walid, not yet Muslim, attacked from behind. Seventy Muslims were killed, including Hamzah, the Prophet's ﷺ uncle. The Prophet ﷺ himself was wounded. Allah revealed that the setback came from disobeying the order, and He forgave them.",
s:["B:3039","Q:3:152-155"],
a:"Think of one instruction from Allah you follow only when it is easy. Commit to it today even when it costs you.",
q:["Why did the Muslims suffer losses at Uhud?",["The archers left their position","They were outnumbered at Badr","They had no leader"],0]},
{t:"The Trench",
b:"In the fifth year, a coalition of about 10,000 fighters marched on Madinah. The seerah books report that Salman al-Farisi suggested digging a trench, a Persian method unknown to the Arabs. The Prophet ﷺ dug with his companions in cold and hunger, carrying earth on his own back. The siege lasted about a month. Then Allah sent a violent cold wind and unseen soldiers, and the coalition gave up and left. After this, the Prophet ﷺ said: \"Now we will go to them; they will not come to us.\"",
s:["Q:33:9-22","Sahih al-Bukhari, Book of Military Expeditions (the Trench)","RM"],
a:"Read Surah al-Ahzab verses 9–12 and 22, how hypocrites and believers reacted differently to the same fear.",
q:["Who is reported to have suggested the trench?",["Salman al-Farisi","'Umar","Khalid ibn al-Walid"],0]},
{t:"The Treaty of Hudaybiyyah",
b:"In the sixth year, the Prophet ﷺ set out with about 1,400 companions for 'Umrah. Quraysh blocked them at al-Hudaybiyyah. The companions pledged under a tree to stand with him (Bay'at ar-Ridwan). A treaty was signed whose terms seemed unfair: the Muslims had to go home and return next year, and Meccans who fled to Madinah had to be returned. 'Umar was upset. But Allah called it \"a clear victory\": in the two years of peace that followed, more people entered Islam than ever before.",
s:["Q:48:1","Q:48:18","B:2731"],
a:"When something does not go your way today, say: \"Perhaps you dislike a thing and it is good for you\" (Q 2:216).",
q:["What did Allah call the Treaty of Hudaybiyyah?",["A clear victory","A test","A defeat"],0]},
{t:"The Conquest of Mecca",
b:"Quraysh broke the treaty. In Ramadan of the eighth year the Prophet ﷺ marched with 10,000 men and entered Mecca almost without fighting, his head bowed in humility on his camel. He went around the Ka'bah and knocked down the 360 idols with a stick while reciting: \"Truth has come and falsehood has vanished.\" The seerah sources report that he forgave the people who had persecuted him for 21 years, saying: \"Go, you are free.\"",
s:["B:4287","M:1781","Q:17:81","Q:110:1-3","IH"],
a:"Read Surah an-Nasr (110). Its response to victory is to glorify Allah and seek forgiveness, not pride.",
q:["What did he recite while removing the idols?",["Truth has come and falsehood has vanished","Allahu Akbar only","Surah al-Fatihah"],0]},
{t:"Tabuk and the Honesty of Ka'b",
b:"In the ninth year the Prophet ﷺ led an army to Tabuk in extreme heat. Ka'b ibn Malik, a sincere companion, kept delaying until the army left without him. The hypocrites gave false excuses and were left to Allah. Ka'b told the truth: he had no excuse. For fifty days the Muslims were told not to speak to him. Then Allah revealed his forgiveness in the Qur'an. Ka'b said: \"Allah saved me only through truthfulness.\"",
s:["B:4418","M:2769","Q:9:118-119"],
a:"If you owe someone an honest admission, give it today without excuses.",
q:["What saved Ka'b ibn Malik?",["His truthfulness","A good excuse","His wealth"],0]},
{t:"The Farewell Pilgrimage",
b:"In the tenth year, the Prophet ﷺ performed his only Hajj, with over 100,000 people. At 'Arafah he gave a great sermon: \"Your blood and your property are sacred to one another, like the sacredness of this day.\" He abolished the blood feuds and usury of the Jahiliyyah, ordered good treatment of women, and said: \"I have left among you the Book of Allah; if you hold to it you will not go astray.\" Then the verse was revealed: \"Today I have perfected your religion for you.\"",
s:["M:1218","Q:5:3","B:45"],
a:"Read the summary of the Farewell Sermon in Sahih Muslim 1218 and pick one instruction to live by this week.",
q:["What did he say he left that would keep us from going astray?",["The Book of Allah","His sword","His house"],0]},
{t:"His Passing",
b:"In Rabi' al-Awwal of the eleventh year (632 CE), at age 63, the Prophet ﷺ fell ill. He stayed in 'Aishah's room and Abu Bakr led the prayers. His last words were: \"O Allah, the Highest Companion.\" The companions were shocked; 'Umar refused to believe it. Abu Bakr came, kissed his face, and told the people: \"Whoever worshipped Muhammad, Muhammad has died. Whoever worshipped Allah, Allah is Ever-Living and never dies,\" and recited verse 144 of Al 'Imran. He was buried in 'Aishah's room, where his grave is today.",
s:["B:4463","B:3668","Q:3:144"],
a:"Send salawat on the Prophet ﷺ 100 times today. His message continues through the people who follow it.",
q:["What were his last words?",["O Allah, the Highest Companion","Pray, pray","Take care of the Qur'an"],0]}
];

const PEOPLE = [
{t:"Khadijah bint Khuwaylid",

s:["B:3820","M:2432"],

{t:"Abu Bakr as-Siddiq",

{t:"Bilal ibn Rabah",
b:"Bilal was an Abyssinian slave in Mecca who endured torture repeating \"Ahad, Ahad\" until Abu Bakr freed him. Because of his beautiful voice, the Prophet ﷺ chose him as the first mu'adhdhin of Islam. One day the Prophet ﷺ asked him: \"Tell me the deed you hope most from, for I heard your footsteps ahead of me in Paradise.\" Bilal said: \"Whenever I make wudu' at any hour of the day or night, I pray with it what Allah wills.\" A former slave became one of the honoured men of Islam.",
s:["B:1149","M:2458"],
a:"After every wudu' today, pray two short rak'ahs, Bilal's habit.",
q:["What deed did Bilal hope most from?",["Praying after every wudu'","Fasting every day","Giving all his wealth"],0]},
{t:"'Aishah bint Abi Bakr",
b:"'Aishah, daughter of Abu Bakr and wife of the Prophet ﷺ, was one of the greatest scholars in Islamic history. She narrated more than 2,000 hadiths and senior companions came to her with questions on fiqh, inheritance and the Prophet's ﷺ private life. The Prophet ﷺ said: \"The superiority of 'Aishah over other women is like the superiority of tharid over other food.\" When hypocrites slandered her, Allah declared her innocence in verses of Surah an-Nur that are recited until the Last Day.",

{t:"Fatimah az-Zahra'",

s:["B:3714","B:3624","B:3705"],
a:"Tonight before sleeping, say the tasbih of Fatimah: 33 SubhanAllah, 33 Alhamdulillah, 34 Allahu Akbar.",
q:["What did the Prophet ﷺ teach Fatimah instead of giving her a servant?",["Dhikr before sleep","A new du'a for wealth","To fast Mondays"],0]},
{t:"Hamzah ibn 'Abd al-Muttalib",
b:"Hamzah was the Prophet's ﷺ uncle and also his milk-brother. A strong hunter, he accepted Islam after Abu Jahl insulted the Prophet ﷺ, and struck Abu Jahl with his bow in front of Quraysh. His conversion gave the Muslims strength. He was called the Lion of Allah and fought bravely at Badr. At Uhud he was killed by a spear thrown by Wahshi, a slave promised his freedom. Wahshi later accepted Islam, and the Prophet ﷺ accepted him, though he asked Wahshi not to appear before him.",
s:["B:4072","IH"],
a:"Islam erases what came before it. Do not look down on anyone because of their past.",
q:["Who killed Hamzah at Uhud, later becoming Muslim?",["Wahshi","Khalid ibn al-Walid","Abu Sufyan"],0]},
{t:"Mus'ab ibn 'Umayr",
b:"Mus'ab was the most elegant young man of Mecca, wearing the finest clothes and perfume. When he became Muslim, his mother cut him off and he became poor. The Prophet ﷺ sent him to teach Islam in Madinah, and through him almost every household there accepted Islam before the Hijrah. He carried the flag at Uhud and was killed. Khabbab reported that his only garment was so short that when it covered his head his feet showed, so they covered his feet with grass.",
s:["B:1276","M:940","Q:33:23"],
a:"Give up one comfort today for the sake of Allah.",
q:["What was Mus'ab's mission in Madinah?",["To teach Islam before the Hijrah","To trade","To fight the Jews"],0]},
{t:"Salman al-Farisi",

s:["B:4897","M:2546","Ahmad 23737 (long narration of Salman; graded hasan)"],
a:"Ask Allah sincerely: \"O Allah, show me the truth as truth and help me follow it.\"",
q:["What was Salman searching for?",["The true religion","Wealth","A homeland"],0]},
{t:"Abu Hurayrah",

s:["B:118","B:119"],
a:"Pick one short hadith from this app and memorise it word for word today.",

s:["B:75","T:2516"],
a:"Memorise: \"Ihfadh Allaha yahfadhk\" (Be mindful of Allah, He will protect you).",

{t:"Mu'adh ibn Jabal",

tl:"Allahumma a'inni 'ala dhikrika wa shukrika wa husni 'ibadatik",

{t:"Khalid ibn al-Walid",

{t:"Abu 'Ubaydah ibn al-Jarrah",

a:"Be trustworthy with something small today: return a borrowed item, keep a secret, or arrive on time.",

{t:"'Ammar ibn Yasir",
