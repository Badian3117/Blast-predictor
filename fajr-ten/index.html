 ٱلۡقَتۡلِ وَإِذٗا لَّا تُمَتَّعُونَ إِلَّا قَلِيلٗا","Qul lan yanfaAAakumu alfiraru in farartum mina almawti awi alqatli waithan la tumattaAAoona illa qaleelan","Say, [O Muhammad], \"Never will fleeing benefit you if you should flee from death or killing; and then [if you did], you would not be given enjoyment [of life] except for a little","Dis: «Jamais la fuite ne vous sera utile si c'est la mort (sans combat) ou le meurtre (dans le combat) que vous fuyez; dans ce cas, vous ne jouirez (de la vie) que peu (de temps)»"],[17,"قُلۡ مَن ذَا ٱلَّذِي يَعۡصِمُكُم مِّنَ ٱللَّهِ إِنۡ أَرَادَ بِكُمۡ سُوٓءًا أَوۡ أَرَادَ بِكُمۡ رَحۡمَةٗۚ وَلَا يَجِدُونَ لَهُم مِّن دُونِ ٱللَّهِ وَلِيّٗا وَلَا نَصِيرٗا","Qul man tha allathee yaAAsimukum mina Allahi in arada bikum sooan aw arada bikum rahmatan wala yajidoona lahum min dooni Allahi waliyyan wala naseeran","Say, \"Who is it that can protect you from Allah if He intends for you an ill or intends for you a mercy?\" And they will not find for themselves besides Allah any protector or any helper","Dis: «Quel est celui qui peut vous protéger d'Allah, s'Il vous veut du mal ou s'Il veut vous accorder une miséricorde?» Et ils ne trouveront pour eux-mêmes en dehors d'Allah, ni allié ni secoureur"],[18,"۞قَدۡ يَعۡلَمُ ٱللَّهُ ٱلۡمُعَوِّقِينَ مِنكُمۡ وَٱلۡقَآئِلِينَ لِإِخۡوَٰنِهِمۡ هَلُمَّ إِلَيۡنَاۖ وَلَا يَأۡتُونَ ٱلۡبَأۡسَ إِلَّا قَلِيلًا","Qad yaAAlamu Allahu almuAAawwiqeena minkum waalqaileena liikhwanihim halumma ilayna wala yatoona albasa illa qaleelan","Already Allah knows the hinderers among you and those [hypocrites] who say to their brothers, \"Come to us,\" and do not go to battle, except for a few","Certes, Allah connaît ceux d'entre vous qui suscitent des obstacles, ainsi que ceux qui disent à leurs frères: «Venez à nous», tandis qu'ils ne déploient que peu d'ardeur au combat"],[19,"أَشِحَّةً عَلَيۡكُمۡۖ فَإِذَا جَآءَ ٱلۡخَوۡفُ رَأَيۡتَهُمۡ يَنظُرُونَ إِلَيۡكَ تَدُورُ أَعۡيُنُهُمۡ كَٱلَّذِي يُغۡشَىٰ عَلَيۡهِ مِنَ ٱلۡمَوۡتِۖ فَإِذَا ذَهَبَ ٱلۡخَوۡفُ سَلَقُوكُم بِأَلۡسِنَةٍ حِدَادٍ أَشِحَّةً عَلَى ٱلۡخَيۡرِۚ أُوْلَـٰٓئِكَ لَمۡ يُؤۡمِنُواْ فَأَحۡبَطَ ٱللَّهُ أَعۡمَٰلَهُمۡۚ وَكَانَ ذَٰلِكَ عَلَى ٱللَّهِ يَسِيرٗا","Ashihhatan AAalaykum faitha jaa alkhawfu raaytahum yanthuroona ilayka tadooru aAAyunuhum kaallathee yughsha AAalayhi mina almawti faitha thahaba alkhawfu salaqookum bialsinatin hidadin ashihhatan AAala alkhayri olaika lam yuminoo faahbata Allahu aAAmalahum wakana thalika AAala Allahi yaseeran","Indisposed toward you. And when fear comes, you see them looking at you, their eyes revolving like one being overcome by death. But when fear departs, they lash you with sharp tongues, indisposed toward [any] good. Those have not believed, so Allah has rendered their deeds worthless, and ever is that, for Allah, easy","avares à votre égard. Puis, quand leur vient la peur, tu les vois te regarder avec des yeux révulsés, comme ceux de quelqu'un qui s'est évanoui par peur de la mort. Une fois la peur passée, ils vous lacèrent avec des langues affilées, alors qu'ils sont chiches à faire le bien. Ceux-là n'ont jamais cru. Allah donc, rend vaines leurs actions. Et cela est facile à Allah"],[20,"يَحۡسَبُونَ ٱلۡأَحۡزَابَ لَمۡ يَذۡهَبُواْۖ وَإِن يَأۡتِ ٱلۡأَحۡزَابُ يَوَدُّواْ لَوۡ أَنَّهُم بَادُونَ فِي ٱلۡأَعۡرَابِ يَسۡـَٔلُونَ عَنۡ أَنۢبَآئِكُمۡۖ وَلَوۡ كَانُواْ فِيكُم مَّا قَٰتَلُوٓاْ إِلَّا قَلِيلٗا","Yahsaboona alahzaba lam yathhaboo wain yati alahzabu yawaddoo law annahum badoona fee alaAArabi yasaloona AAan anbaikum walaw kanoo feekum ma qataloo illa qaleelan","They think the companies have not [yet] withdrawn. And if the companies should come [again], they would wish they were in the desert among the bedouins, inquiring [from afar] about your news. And if they should be among you, they would not fight except for a little","Ils pensent que les coalisés ne sont pas partis. Or si les coalisés revenaient, [ces gens-là] souhaiteraient être des nomades parmi les Bédouins et [se contenteraient] de demander de vos nouvelles. S'ils étaient parmi vous, ils n'auraient combattu que très peu"],[21,"لَّقَدۡ كَانَ لَكُمۡ فِي رَسُولِ ٱللَّهِ أُسۡوَةٌ حَسَنَةٞ لِّمَن كَانَ يَرۡجُواْ ٱللَّهَ وَٱلۡيَوۡمَ ٱلۡأٓخِرَ وَذَكَرَ ٱللَّهَ كَثِيرٗا","Laqad kana lakum fee rasooli Allahi oswatun hasanatun liman kana yarjoo Allaha waalyawma alakhira wathakara Allaha katheeran","There has certainly been for you in the Messenger of Allah an excellent pattern for anyone whose hope is in Allah and the Last Day and [who] remembers Allah often","En effet, vous avez dans le Messager d'Allah un excellent modèle [à suivre], pour quiconque espère en Allah et au Jour dernier et invoque Allah fréquemment"],[22,"وَلَمَّا رَءَا ٱلۡمُؤۡمِنُونَ ٱلۡأَحۡزَابَ قَالُواْ هَٰذَا مَا وَعَدَنَا ٱللَّهُ وَرَسُولُهُۥ وَصَدَقَ ٱللَّهُ وَرَسُولُهُۥۚ وَمَا زَادَهُمۡ إِلَّآ إِيمَٰنٗا وَتَسۡلِيمٗا","Walamma raa almuminoona alahzaba qaloo hatha ma waAAadana Allahu warasooluhu wasadaqa Allahu warasooluhu wama zadahum illa eemanan watasleeman","And when the believers saw the companies, they said, \"This is what Allah and His Messenger had promised us, and Allah and His Messenger spoke the truth.\" And it increased them only in faith and acceptance","Et quand les croyants virent les coalisés, ils dirent: «Voilà ce qu'Allah et Son messager nous avaient promis; et Allah et Son messager disaient la vérité». Et cela ne fit que croître leur foi et leur soumission"]]},"37:99-111":{"s":37,"name":"As-Saffat","ar":"الصافات","en":"Those who set the Ranks","fr":"Les rangés","v":[[99,"وَقَالَ إِنِّي ذَاهِبٌ إِلَىٰ رَبِّي سَيَهۡدِينِ","Waqala innee thahibun ila rabbee sayahdeeni","And [then] he said, \"Indeed, I will go to [where I am ordered by] my Lord; He will guide me","Et il dit: «Moi, je pars vers mon Seigneur et Il me guidera"],[100,"رَبِّ هَبۡ لِي مِنَ ٱلصَّـٰلِحِينَ","Rabbi hab lee mina alssaliheena","My Lord, grant me [a child] from among the righteous","Seigneur, fais-moi don d'une [progéniture] d'entre les vertueux»"],[101,"فَبَشَّرۡنَٰهُ بِغُلَٰمٍ حَلِيمٖ","Fabashsharnahu bighulamin haleemin","So We gave him good tidings of a forbearing boy","Nous lui fîmes donc la bonne annonce d'un garçon (Ismaël) longanime"],[102,"فَلَمَّا بَلَغَ مَعَهُ ٱلسَّعۡيَ قَالَ يَٰبُنَيَّ إِنِّيٓ أَرَىٰ فِي ٱلۡمَنَامِ أَنِّيٓ أَذۡبَحُكَ فَٱنظُرۡ مَاذَا تَرَىٰۚ قَالَ يَـٰٓأَبَتِ ٱفۡعَلۡ مَا تُؤۡمَرُۖ سَتَجِدُنِيٓ إِن شَآءَ ٱللَّهُ مِنَ ٱلصَّـٰبِرِينَ","Falamma balagha maAAahu alssaAAya qala ya bunayya innee ara fee almanami annee athbahuka faonthur matha tara qala ya abati ifAAal ma tumaru satajidunee in shaa Allahu mina alssabireena","And when he reached with him [the age of] exertion, he said, \"O my son, indeed I have seen in a dream that I [must] sacrifice you, so see what you think.\" He said, \"O my father, do as you are commanded. You will find me, if Allah wills, of the steadfast","Puis quand celui-ci fut en âge de l'accompagner, [Abraham] dit: «O mon fils, je me vois en songe en train de t'immoler. Vois donc ce que tu en penses». (Ismaël) dit: «O mon cher père, fais ce qui t'es commandé: tu me trouveras, s'il plaît à Allah, du nombre des endurants»"],[103,"فَلَمَّآ أَسۡلَمَا وَتَلَّهُۥ لِلۡجَبِينِ","Falamma aslama watallahu liljabeeni","And when they had both submitted and he put him down upon his forehead","Puis quand tous deux se furent soumis (à l'ordre d'Allah) et qu'il l'eut jeté sur le front"],[104,"وَنَٰدَيۡنَٰهُ أَن يَـٰٓإِبۡرَٰهِيمُ","Wanadaynahu an ya ibraheemu","We called to him, \"O Abraham","voilà que Nous l'appelâmes «Abraham"],[105,"قَدۡ صَدَّقۡتَ ٱلرُّءۡيَآۚ إِنَّا كَذَٰلِكَ نَجۡزِي ٱلۡمُحۡسِنِينَ","Qad saddaqta alrruya inna kathalika najzee almuhsineena","You have fulfilled the vision.\" Indeed, We thus reward the doers of good","Tu as confirmé la vision. C'est ainsi que Nous récompensons les bienfaisants»"],[106,"إِنَّ هَٰذَا لَهُوَ ٱلۡبَلَـٰٓؤُاْ ٱلۡمُبِينُ","Inna hatha lahuwa albalao almubeenu","Indeed, this was the clear trial","C'était là certes, l'épreuve manifeste"],[107,"وَفَدَيۡنَٰهُ بِذِبۡحٍ عَظِيمٖ","Wafadaynahu bithibhin AAatheemin","And We ransomed him with a great sacrifice","Et Nous le rançonnâmes d'une immolation généreuse"],[108,"وَتَرَكۡنَا عَلَيۡهِ فِي ٱلۡأٓخِرِينَ","Watarakna AAalayhi fee alakhireena","And We left for him [favorable mention] among later generations","Et Nous perpétuâmes son renom dans la postérité"],[109,"سَلَٰمٌ عَلَىٰٓ إِبۡرَٰهِيمَ","Salamun AAala ibraheema","Peace upon Abraham","«Paix sur Abraham»"],[110,"كَذَٰلِكَ نَجۡزِي ٱلۡمُحۡسِنِينَ","Kathalika najzee almuhsineena","Indeed, We thus reward the doers of good","Ainsi récompensons-Nous les bienfaisants"],[111,"إِنَّهُۥ مِنۡ عِبَادِنَا ٱلۡمُؤۡمِنِينَ","Innahu min AAibadina almumineena","Indeed, he was of Our believing servants","car il était de Nos serviteurs croyants"]]},"38:29":{"s":38,"name":"Sad","ar":"ص","en":"The Letter \"Saad\"","fr":"Sad","v":[[29,"كِتَٰبٌ أَنزَلۡنَٰهُ إِلَيۡكَ مُبَٰرَكٞ لِّيَدَّبَّرُوٓاْ ءَايَٰتِهِۦ وَلِيَتَذَكَّرَ أُوْلُواْ ٱلۡأَلۡبَٰبِ","Kitabun anzalnahu ilayka mubarakun liyaddabbaroo ayatihi waliyatathakkara oloo alalbabi","[This is] a blessed Book which We have revealed to you, [O Muhammad], that they might reflect upon its verses and that those of understanding would be reminded","[Voici] un Livre béni que Nous avons fait descendre vers toi, afin qu'ils méditent sur ses versets et que les doués d'intelligence réfléchissent"]]},"39:10":{"s":39,"name":"Az-Zumar","ar":"الزمر","en":"The Troops","fr":"Les groupes","v":[[10,"قُلۡ يَٰعِبَادِ ٱلَّذِينَ ءَامَنُواْ ٱتَّقُواْ رَبَّكُمۡۚ لِلَّذِينَ أَحۡسَنُواْ فِي هَٰذِهِ ٱلدُّنۡيَا حَسَنَةٞۗ وَأَرۡضُ ٱللَّهِ وَٰسِعَةٌۗ إِنَّمَا يُوَفَّى ٱلصَّـٰبِرُونَ أَجۡرَهُم بِغَيۡرِ حِسَابٖ","Qul ya AAibadi allatheena amanoo ittaqoo rabbakum lillatheena ahsanoo fee hathihi alddunya hasanatun waardu Allahi wasiAAatun innama yuwaffa alssabiroona ajrahum bighayri hisabin","Say, \"O My servants who have believed, fear your Lord. For those who do good in this world is good, and the earth of Allah is spacious. Indeed, the patient will be given their reward without account","Dis: «O Mes serviteurs qui avez cru! Craignez votre Seigneur». Ceux qui ici-bas font le bien, auront une bonne [récompense]. La terre d'Allah est vaste et les endurants auront leur pleine récompense sans compter"]]},"39:42":{"s":39,"name":"Az-Zumar","ar":"الزمر","en":"The Troops","fr":"Les groupes","v":[[42,"ٱللَّهُ يَتَوَفَّى ٱلۡأَنفُسَ حِينَ مَوۡتِهَا وَٱلَّتِي لَمۡ تَمُتۡ فِي مَنَامِهَاۖ فَيُمۡسِكُ ٱلَّتِي قَضَىٰ عَلَيۡهَا ٱلۡمَوۡتَ وَيُرۡسِلُ ٱلۡأُخۡرَىٰٓ إِلَىٰٓ أَجَلٖ مُّسَمًّىۚ إِنَّ فِي ذَٰلِكَ لَأٓيَٰتٖ لِّقَوۡمٖ يَتَفَكَّرُونَ","Allahu yatawaffa alanfusa heena mawtiha waallatee lam tamut fee manamiha fayumsiku allatee qada AAalayha almawta wayursilu alokhra ila ajalin musamman inna fee thalika laayatin liqawmin yatafakkaroona","Allah takes the souls at the time of their death, and those that do not die [He takes] during their sleep. Then He keeps those for which He has decreed death and releases the others for a specified term. Indeed in that are signs for a people who give thought","Allah reçoit les âmes au moment de leur mort ainsi que celles qui ne meurent pas au cours de leur sommeil. Il retient celles à qui Il a décrété la mort, tandis qu'Il renvoie les autres jusqu'à un terme fixé. Il y a certainement là des preuves pour des gens qui réfléchissent"]]},"39:53":{"s":39,"name":"Az-Zumar","ar":"الزمر","en":"The Troops","fr":"Les groupes","v":[[53,"۞قُلۡ يَٰعِبَادِيَ ٱلَّذِينَ أَسۡرَفُواْ عَلَىٰٓ أَنفُسِهِمۡ لَا تَقۡنَطُواْ مِن رَّحۡمَةِ ٱللَّهِۚ إِنَّ ٱللَّهَ يَغۡفِرُ ٱلذُّنُوبَ جَمِيعًاۚ إِنَّهُۥ هُوَ ٱلۡغَفُورُ ٱلرَّحِيمُ","Qul ya AAibadiya allatheena asrafoo AAala anfusihim la taqnatoo min rahmati Allahi inna Allaha yaghfiru alththunooba jameeAAan innahu huwa alghafooru alrraheemu","Say, \"O My servants who have transgressed against themselves [by sinning], do not despair of the mercy of Allah. Indeed, Allah forgives all sins. Indeed, it is He who is the Forgiving, the Merciful","Dis: «O Mes serviteurs qui avez commis des excès à votre propre détriment, ne désespérez pas de la miséricorde d'Allah. Car Allah pardonne tous les péchés. Oui, c'est Lui le Pardonneur, le Très Miséricordieux"]]},"39:68":{"s":39,"name":"Az-Zumar","ar":"الزمر","en":"The Troops","fr":"Les groupes","v":[[68,"وَنُفِخَ فِي ٱلصُّورِ فَصَعِقَ مَن فِي ٱلسَّمَٰوَٰتِ وَمَن فِي ٱلۡأَرۡضِ إِلَّا مَن شَآءَ ٱللَّهُۖ ثُمَّ نُفِخَ فِيهِ أُخۡرَىٰ فَإِذَا هُمۡ قِيَامٞ يَنظُرُونَ","Wanufikha fee alssoori fasaAAiqa man fee alssamawati waman fee alardi illa man shaa Allahu thumma nufikha feehi okhra faitha hum qiyamun yanthuroona","And the Horn will be blown, and whoever is in the heavens and whoever is on the earth will fall dead except whom Allah wills. Then it will be blown again, and at once they will be standing, looking on","Et on soufflera dans la Trompe, et voilà que ceux qui seront dans les cieux et ceux qui seront sur la terre seront foudroyés, sauf ceux qu'Allah voudra [épargner]. Puis on y soufflera de nouveau, et les voilà debout à regarder"]]},"39:9":{"s":39,"name":"Az-Zumar","ar":"الزمر","en":"The Troops","fr":"Les groupes","v":[[9,"أَمَّنۡ هُوَ قَٰنِتٌ ءَانَآءَ ٱلَّيۡلِ سَاجِدٗا وَقَآئِمٗا يَحۡذَرُ ٱلۡأٓخِرَةَ وَيَرۡجُواْ رَحۡمَةَ رَبِّهِۦۗ قُلۡ هَلۡ يَسۡتَوِي ٱلَّذِينَ يَعۡلَمُونَ وَٱلَّذِينَ لَا يَعۡلَمُونَۗ إِنَّمَا يَتَذَكَّرُ أُوْلُواْ ٱلۡأَلۡبَٰبِ","Amman huwa qanitun anaa allayli sajidan waqaiman yahtharu alakhirata wayarjoo rahmata rabbihi qul hal yastawee allatheena yaAAlamoona waallatheena la yaAAlamoona innama yatathakkaru oloo alalbabi","Is one who is devoutly obedient during periods of the night, prostrating and standing [in prayer], fearing the Hereafter and hoping for the mercy of his Lord, [like one who does not]? Say, \"Are those who know equal to those who do not know?\" Only they will remember [who are] people of understanding","Est-ce que celui qui, aux heures de la nuit, reste en dévotion, prosterné et debout, prenant garde à l'au-delà et espérant la miséricorde de son Seigneur... Dis: «Sont-ils égaux, ceux qui savent et ceux qui ne savent pas?» Seuls les doués d'intelligence se rappellent"]]},"40:60":{"s":40,"name":"Ghafir","ar":"غافر","en":"The Forgiver","fr":"Le Pardonneur","v":[[60,"وَقَالَ رَبُّكُمُ ٱدۡعُونِيٓ أَسۡتَجِبۡ لَكُمۡۚ إِنَّ ٱلَّذِينَ يَسۡتَكۡبِرُونَ عَنۡ عِبَادَتِي سَيَدۡخُلُونَ جَهَنَّمَ دَاخِرِينَ","Waqala rabbukumu odAAoonee astajib lakum inna allatheena yastakbiroona AAan AAibadatee sayadkhuloona jahannama dakhireena","And your Lord says, \"Call upon Me; I will respond to you.\" Indeed, those who disdain My worship will enter Hell [rendered] contemptible","Et votre Seigneur dit: «Appelez-Moi, Je vous répondrai. Ceux qui, par orgueil, se refusent à M'adorer entreront bientôt dans l'Enfer, humiliés»"]]},"42:11":{"s":42,"name":"Ash-Shuraa","ar":"الشورى","en":"The Consultation","fr":"La concertation","v":[[11,"فَاطِرُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِۚ جَعَلَ لَكُم مِّنۡ أَنفُسِكُمۡ أَزۡوَٰجٗا وَمِنَ ٱلۡأَنۡعَٰمِ أَزۡوَٰجٗا يَذۡرَؤُكُمۡ فِيهِۚ لَيۡسَ كَمِثۡلِهِۦ شَيۡءٞۖ وَهُوَ ٱلسَّمِيعُ ٱلۡبَصِيرُ","Fatiru alssamawati waalardi jaAAala lakum min anfusikum azwajan wamina alanAAami azwajan yathraokum feehi laysa kamithlihi shayon wahuwa alssameeAAu albaseeru","[He is] Creator of the heavens and the earth. He has made for you from yourselves, mates, and among the cattle, mates; He multiplies you thereby. There is nothing like unto Him, and He is the Hearing, the Seeing","Créateur des cieux et de la terre. Il vous a donné des épouses [issues] de vous-mêmes et des bestiaux par couples; par ce moyen Il vous multiplie. Il n'y a rien qui Lui ressemble; et c'est Lui l'Audient, le Clairvoyant"]]},"43:13-14":{"s":43,"name":"Az-Zukhruf","ar":"الزخرف","en":"The Ornaments of Gold","fr":"L'ornement","v":[[13,"لِتَسۡتَوُۥاْ عَلَىٰ ظُهُورِهِۦ ثُمَّ تَذۡكُرُواْ نِعۡمَةَ رَبِّكُمۡ إِذَا ٱسۡتَوَيۡتُمۡ عَلَيۡهِ وَتَقُولُواْ سُبۡحَٰنَ ٱلَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُۥ مُقۡرِنِينَ","Litastawoo AAala thuhoorihi thumma tathkuroo niAAmata rabbikum itha istawaytum AAalayhi wataqooloo subhana allathee sakhkhara lana hatha wama kunna lahu muqrineena","That you may settle yourselves upon their backs and then remember the favor of your Lord when you have settled upon them and say. \"Exalted is He who has subjected this to us, and we could not have [otherwise] subdued it","afin que vous vous installiez sur leurs dos, et qu'ensuite, après vous y être installés, vous vous rappeliez le bienfait de votre Seigneur et que vous disiez: «Gloire à Celui qui nous a soumis tout cela alors que nous n'étions pas capables de les dominer"],[14,"وَإِنَّآ إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ","Wainna ila rabbina lamunqaliboona","And indeed we, to our Lord, will [surely] return","C'est vers notre Seigneur que nous retournerons»"]]},"46:35":{"s":46,"name":"Al-Ahqaf","ar":"الأحقاف","en":"The Wind-Curved Sandhills","fr":"Al-Ahqaf","v":[[35,"فَٱصۡبِرۡ كَمَا صَبَرَ أُوْلُواْ ٱلۡعَزۡمِ مِنَ ٱلرُّسُلِ وَلَا تَسۡتَعۡجِل لَّهُمۡۚ كَأَنَّهُمۡ يَوۡمَ يَرَوۡنَ مَا يُوعَدُونَ لَمۡ يَلۡبَثُوٓاْ إِلَّا سَاعَةٗ مِّن نَّهَارِۭۚ بَلَٰغٞۚ فَهَلۡ يُهۡلَكُ إِلَّا ٱلۡقَوۡمُ ٱلۡفَٰسِقُونَ","Faisbir kama sabara oloo alAAazmi mina alrrusuli wala tastaAAjil lahum kaannahum yawma yarawna ma yooAAadoona lam yalbathoo illa saAAatan min naharin balaghun fahal yuhlaku illa alqawmu alfasiqoona","So be patient, [O Muhammad], as were those of determination among the messengers and do not be impatient for them. It will be - on the Day they see that which they are promised - as though they had not remained [in the world] except an hour of a day. [This is] notification. And will [any] be destroyed except the defiantly disobedient people","Endure (Muhammad) donc, comme ont enduré les messagers doués de fermeté; et ne te montre pas trop pressé de les voir subir [leur châtiment]. Le jour où ils verront ce qui leur est promis, il leur semblera qu'ils n'étaient restés [sur terre] qu'une heure d'un jour. Voilà une communication. Qui sera donc anéanti sinon les gens pervers"]]},"48:1":{"s":48,"name":"Al-Fath","ar":"الفتح","en":"The Victory","fr":"La victoire éclatante","v":[[1,"إِنَّا فَتَحۡنَا لَكَ فَتۡحٗا مُّبِينٗا","Inna fatahna laka fathan mubeenan","Indeed, We have given you, [O Muhammad], a clear conquest","En vérité Nous t'avons accordé une victoire éclatante"]]},"48:18":{"s":48,"name":"Al-Fath","ar":"الفتح","en":"The Victory","fr":"La victoire éclatante","v":[[18,"۞لَّقَدۡ رَضِيَ ٱللَّهُ عَنِ ٱلۡمُؤۡمِنِينَ إِذۡ يُبَايِعُونَكَ تَحۡتَ ٱلشَّجَرَةِ فَعَلِمَ مَا فِي قُلُوبِهِمۡ فَأَنزَلَ ٱلسَّكِينَةَ عَلَيۡهِمۡ وَأَثَٰبَهُمۡ فَتۡحٗا قَرِيبٗا","Laqad radiya Allahu AAani almumineena ith yubayiAAoonaka tahta alshshajarati faAAalima ma fee quloobihim faanzala alsakeenata AAalayhim waathabahum fathan qareeban","Certainly was Allah pleased with the believers when they pledged allegiance to you, [O Muhammad], under the tree, and He knew what was in their hearts, so He sent down tranquillity upon them and rewarded them with an imminent conquest","Allah a très certainement agréé les croyants quand ils t'ont prêté le serment d'allégeance sous l'arbre. Il a su ce qu'il y avait dans leurs cœurs, et a fait descendre sur eux la quiétude, et Il les a récompensés par une victoire proche"]]},"49:12":{"s":49,"name":"Al-Hujurat","ar":"الحجرات","en":"The Rooms","fr":"Les appartements","v":[[12,"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱجۡتَنِبُواْ كَثِيرٗا مِّنَ ٱلظَّنِّ إِنَّ بَعۡضَ ٱلظَّنِّ إِثۡمٞۖ وَلَا تَجَسَّسُواْ وَلَا يَغۡتَب بَّعۡضُكُم بَعۡضًاۚ أَيُحِبُّ أَحَدُكُمۡ أَن يَأۡكُلَ لَحۡمَ أَخِيهِ مَيۡتٗا فَكَرِهۡتُمُوهُۚ وَٱتَّقُواْ ٱللَّهَۚ إِنَّ ٱللَّهَ تَوَّابٞ رَّحِيمٞ","Ya ayyuha allatheena amanoo ijtaniboo katheeran mina alththanni inna baAAda alththanni ithmun wala tajassasoo wala yaghtab baAAdukum baAAdan ayuhibbu ahadukum an yakula lahma akheehi maytan fakarihtumoohu waittaqoo Allaha inna Allaha tawwabun raheemun","O you who have believed, avoid much [negative] assumption. Indeed, some assumption is sin. And do not spy or backbite each other. Would one of you like to eat the flesh of his brother when dead? You would detest it. And fear Allah; indeed, Allah is Accepting of repentance and Merciful","O vous qui avez cru! Evitez de trop conjecturer [sur autrui] car une partie des conjectures est péché. Et n'espionnez pas; et ne médisez pas les uns des autres. L'un de vous aimerait-il manger la chair de son frère mort? (Non!) vous en aurez horreur. Et craignez Allah. Car Allah est Grand Accueillant au repentir, Très Miséricordieux"]]},"50:17-18":{"s":50,"name":"Qaf","ar":"ق","en":"The Letter \"Qaf\"","fr":"Qaf","v":[[17,"إِذۡ يَتَلَقَّى ٱلۡمُتَلَقِّيَانِ عَنِ ٱلۡيَمِينِ وَعَنِ ٱلشِّمَالِ قَعِيدٞ","Ith yatalaqqa almutalaqqiyani AAani alyameeni waAAani alshshimali qaAAeedun","When the two receivers receive, seated on the right and on the left","quand les deux recueillants, assis à droite et à gauche, recueillent"],[18,"مَّا يَلۡفِظُ مِن قَوۡلٍ إِلَّا لَدَيۡهِ رَقِيبٌ عَتِيدٞ","Ma yalfithu min qawlin illa ladayhi raqeebun AAateedun","Man does not utter any word except that with him is an observer prepared [to record]","Il ne prononce pas une parole sans avoir auprès de lui un observateur prêt à l'inscrire"]]},"54:49":{"s":54,"name":"Al-Qamar","ar":"القمر","en":"The Moon","fr":"La lune","v":[[49,"إِنَّا كُلَّ شَيۡءٍ خَلَقۡنَٰهُ بِقَدَرٖ","Inna kulla shayin khalaqnahu biqadarin","Indeed, all things We created with predestination","Nous avons créé toute chose avec mesure"]]},"57:22-23":{"s":57,"name":"Al-Hadid","ar":"الحديد","en":"The Iron","fr":"Le fer","v":[[22,"مَآ أَصَابَ مِن مُّصِيبَةٖ فِي ٱلۡأَرۡضِ وَلَا فِيٓ أَنفُسِكُمۡ إِلَّا فِي كِتَٰبٖ مِّن قَبۡلِ أَن نَّبۡرَأَهَآۚ إِنَّ ذَٰلِكَ عَلَى ٱللَّهِ يَسِيرٞ","Ma asaba min museebatin fee alardi wala fee anfusikum illa fee kitabin min qabli an nabraaha inna thalika AAala Allahi yaseerun","No disaster strikes upon the earth or among yourselves except that it is in a register before We bring it into being - indeed that, for Allah, is easy","Nul malheur n'atteint la terre ni vos personnes, qui ne soit enregistré dans un Livre avant que Nous ne l'ayons créé; et cela est certes facile à Allah"],[23,"لِّكَيۡلَا تَأۡسَوۡاْ عَلَىٰ مَا فَاتَكُمۡ وَلَا تَفۡرَحُواْ بِمَآ ءَاتَىٰكُمۡۗ وَٱللَّهُ لَا يُحِبُّ كُلَّ مُخۡتَالٖ فَخُورٍ","Likayla tasaw AAala ma fatakum wala tafrahoo bima atakum waAllahu la yuhibbu kulla mukhtalin fakhoorin","In order that you not despair over what has eluded you and not exult [in pride] over what He has given you. And Allah does not like everyone self-deluded and boastful","afin que vous ne vous tourmentiez pas au sujet de ce qui vous a échappé, ni n'exultiez pour ce qu'Il vous a donné. Et Allah n'aime point tout présomptueux plein de gloriole"]]},"59:10":{"s":59,"name":"Al-Hashr","ar":"الحشر","en":"The Exile","fr":"L'exode","v":[[10,"وَٱلَّذِينَ جَآءُو مِنۢ بَعۡدِهِمۡ يَقُولُونَ رَبَّنَا ٱغۡفِرۡ لَنَا وَلِإِخۡوَٰنِنَا ٱلَّذِينَ سَبَقُونَا بِٱلۡإِيمَٰنِ وَلَا تَجۡعَلۡ فِي قُلُوبِنَا غِلّٗا لِّلَّذِينَ ءَامَنُواْ رَبَّنَآ إِنَّكَ رَءُوفٞ رَّحِيمٌ","Waallatheena jaoo min baAAdihim yaqooloona rabbana ighfir lana waliikhwanina allatheena sabaqoona bialeemani wala tajAAal fee quloobina ghillan lillatheena amanoo rabbana innaka raoofun raheemun","And [there is a share for] those who came after them, saying, \"Our Lord, forgive us and our brothers who preceded us in faith and put not in our hearts [any] resentment toward those who have believed. Our Lord, indeed You are Kind and Merciful","Et [il appartient également] à ceux qui sont venus après eux en disant: «Seigneur, pardonne-nous, ainsi qu'à nos frères qui nous ont précédés dans la foi; et ne mets dans nos cœurs aucune rancœur pour ceux qui ont cru. Seigneur, Tu es Compatissant et Très Miséricordieux»"]]},"59:22-24":{"s":59,"name":"Al-Hashr","ar":"الحشر","en":"The Exile","fr":"L'exode","v":[[22,"هُوَ ٱللَّهُ ٱلَّذِي لَآ إِلَٰهَ إِلَّا هُوَۖ عَٰلِمُ ٱلۡغَيۡبِ وَٱلشَّهَٰدَةِۖ هُوَ ٱلرَّحۡمَٰنُ ٱلرَّحِيمُ","Huwa Allahu allathee la ilaha illa huwa AAalimu alghaybi waalshshahadati huwa alrrahmanu alrraheemu","He is Allah, other than whom there is no deity, Knower of the unseen and the witnessed. He is the Entirely Merciful, the Especially Merciful","C'est Lui Allah. Nulle divinité autre que Lui, le Connaisseur de l'Invisible tout comme du visible. C'est Lui, le Tout Miséricordieux, le Très Miséricordieux"],[23,"هُوَ ٱللَّهُ ٱلَّذِي لَآ إِلَٰهَ إِلَّا هُوَ ٱلۡمَلِكُ ٱلۡقُدُّوسُ ٱلسَّلَٰمُ ٱلۡمُؤۡمِنُ ٱلۡمُهَيۡمِنُ ٱلۡعَزِيزُ ٱلۡجَبَّارُ ٱلۡمُتَكَبِّرُۚ سُبۡحَٰنَ ٱللَّهِ عَمَّا يُشۡرِكُونَ","Huwa Allahu allathee la ilaha illa huwa almaliku alquddoosu alssalamu almuminu almuhayminu alAAazeezu aljabbaru almutakabbiru subhana Allahi AAamma yushrikoona","He is Allah, other than whom there is no deity, the Sovereign, the Pure, the Perfection, the Bestower of Faith, the Overseer, the Exalted in Might, the Compeller, the Superior. Exalted is Allah above whatever they associate with Him","C'est Lui, Allah. Nulle divinité autre que Lui; Le Souverain, Le Pur, L'Apaisant, Le Rassurant, Le Prédominant, Le Tout Puissant, Le Contraignant, L'Orgueilleux. Gloire à Allah! Il transcende ce qu'ils Lui associent"],[24,"هُوَ ٱللَّهُ ٱلۡخَٰلِقُ ٱلۡبَارِئُ ٱلۡمُصَوِّرُۖ لَهُ ٱلۡأَسۡمَآءُ ٱلۡحُسۡنَىٰۚ يُسَبِّحُ لَهُۥ مَا فِي ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِۖ وَهُوَ ٱلۡعَزِيزُ ٱلۡحَكِيمُ","Huwa Allahu alkhaliqu albario almusawwiru lahu alasmao alhusna yusabbihu lahu ma fee alssamawati waalardi wahuwa alAAazeezu alhakeemu","He is Allah, the Creator, the Inventor, the Fashioner; to Him belong the best names. Whatever is in the heavens and earth is exalting Him. And He is the Exalted in Might, the Wise","C'est Lui Allah, le Créateur, Celui qui donne un commencement à toute chose, le Formateur. A Lui les plus beaux noms. Tout ce qui est dans les cieux et la terre Le glorifie. Et c'est Lui le Puissant, le Sage"]]},"62:9-10":{"s":62,"name":"Al-Jumu'ah","ar":"الجمعة","en":"The Congregation, Friday","fr":"Le vendredi","v":[[9,"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِذَا نُودِيَ لِلصَّلَوٰةِ مِن يَوۡمِ ٱلۡجُمُعَةِ فَٱسۡعَوۡاْ إِلَىٰ ذِكۡرِ ٱللَّهِ وَذَرُواْ ٱلۡبَيۡعَۚ ذَٰلِكُمۡ خَيۡرٞ لَّكُمۡ إِن كُنتُمۡ تَعۡلَمُونَ","Ya ayyuha allatheena amanoo itha noodiya lilssalati min yawmi aljumuAAati faisAAaw ila thikri Allahi watharoo albayAAa thalikum khayrun lakum in kuntum taAAlamoona","O you who have believed, when [the adhan] is called for the prayer on the day of Jumu'ah [Friday], then proceed to the remembrance of Allah and leave trade. That is better for you, if you only knew","O vous qui avez cru! Quand on appelle à la Salât du jour du Vendredi, accourez à l'invocation d'Allah et laissez tout négoce. Cela est bien meilleur pour vous, si vous saviez"],[10,"فَإِذَا قُضِيَتِ ٱلصَّلَوٰةُ فَٱنتَشِرُواْ فِي ٱلۡأَرۡضِ وَٱبۡتَغُواْ مِن فَضۡلِ ٱللَّهِ وَٱذۡكُرُواْ ٱللَّهَ كَثِيرٗا لَّعَلَّكُمۡ تُفۡلِحُونَ","Faitha qudiyati alssalatu faintashiroo fee alardi waibtaghoo min fadli Allahi waothkuroo Allaha katheeran laAAallakum tuflihoona","And when the prayer has been concluded, disperse within the land and seek from the bounty of Allah, and remember Allah often that you may succeed","Puis quand la Salât est achevée, dispersez-vous sur terre et recherchez [quelque effet] de la grâce d'Allah, et invoquez beaucoup Allah afin que vous réussissiez"]]},"66:6":{"s":66,"name":"At-Tahrim","ar":"التحريم","en":"The Prohibition","fr":"L'interdiction","v":[[6,"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ قُوٓاْ أَنفُسَكُمۡ وَأَهۡلِيكُمۡ نَارٗا وَقُودُهَا ٱلنَّاسُ وَٱلۡحِجَارَةُ عَلَيۡهَا مَلَـٰٓئِكَةٌ غِلَاظٞ شِدَادٞ لَّا يَعۡصُونَ ٱللَّهَ مَآ أَمَرَهُمۡ وَيَفۡعَلُونَ مَا يُؤۡمَرُونَ","Ya ayyuha allatheena amanoo qoo anfusakum waahleekum naran waqooduha alnnasu waalhijaratu AAalayha malaikatun ghilathun shidadun la yaAAsoona Allaha ma amarahum wayafAAaloona ma yumaroona","O you who have believed, protect yourselves and your families from a Fire whose fuel is people and stones, over which are [appointed] angels, harsh and severe; they do not disobey Allah in what He commands them but do what they are commanded","O vous qui avez cru! Préservez vos personnes et vos familles, d'un Feu dont le combustible sera les gens et les pierres, surveillé par des Anges rudes, durs, ne désobéissant jamais à Allah en ce qu'Il leur commande, et faisant strictement ce qu'on leur ordonne"]]},"66:8":{"s":66,"name":"At-Tahrim","ar":"التحريم","en":"The Prohibition","fr":"L'interdiction","v":[[8,"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ تُوبُوٓاْ إِلَى ٱللَّهِ تَوۡبَةٗ نَّصُوحًا عَسَىٰ رَبُّكُمۡ أَن يُكَفِّرَ عَنكُمۡ سَيِّـَٔاتِكُمۡ وَيُدۡخِلَكُمۡ جَنَّـٰتٖ تَجۡرِي مِن تَحۡتِهَا ٱلۡأَنۡهَٰرُ يَوۡمَ لَا يُخۡزِي ٱللَّهُ ٱلنَّبِيَّ وَٱلَّذِينَ ءَامَنُواْ مَعَهُۥۖ نُورُهُمۡ يَسۡعَىٰ بَيۡنَ أَيۡدِيهِمۡ وَبِأَيۡمَٰنِهِمۡ يَقُولُونَ رَبَّنَآ أَتۡمِمۡ لَنَا نُورَنَا وَٱغۡفِرۡ لَنَآۖ إِنَّكَ عَلَىٰ كُلِّ شَيۡءٖ قَدِيرٞ","Ya ayyuha allatheena amanoo tooboo ila Allahi tawbatan nasoohan AAasa rabbukum an yukaffira AAankum sayyiatikum wayudkhilakum jannatin tajree min tahtiha alanharu yawma la yukhzee Allahu alnnabiyya waallatheena amanoo maAAahu nooruhum yasAAa bayna aydeehim wabiaymanihim yaqooloona rabbana atmim lana noorana waighfir lana innaka AAala kulli shayin qadeerun","O you who have believed, repent to Allah with sincere repentance. Perhaps your Lord will remove from you your misdeeds and admit you into gardens beneath which rivers flow [on] the Day when Allah will not disgrace the Prophet and those who believed with him. Their light will proceed before them and on their right; they will say, \"Our Lord, perfect for us our light and forgive us. Indeed, You are over all things competent","O vous qui avez cru! Repentez-vous à Allah d'un repentir sincère. Il se peut que votre Seigneur vous efface vos fautes et qu'Il vous fasse entrer dans des Jardins sous lesquels coulent les ruisseaux, le jour où Allah épargnera l'ignominie au Prophète et à ceux qui croient avec lui. Leur lumière courra devant eux et à leur droite; ils diront: «Seigneur, parfais-nous notre lumière et pardonne-nous. Car Tu es Omnipotent»"]]},"68:4":{"s":68,"name":"Al-Qalam","ar":"القلم","en":"The Pen","fr":"La plume","v":[[4,"وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٖ","Wainnaka laAAala khuluqin AAatheemin","And indeed, you are of a great moral character","Et tu es certes, d'une moralité éminente"]]},"69:19-29":{"s":69,"name":"Al-Haqqah","ar":"الحاقة","en":"The Reality","fr":"L'inéluctable","v":[[19,"فَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ بِيَمِينِهِۦ فَيَقُولُ هَآؤُمُ ٱقۡرَءُواْ كِتَٰبِيَهۡ","Faamma man ootiya kitabahu biyameenihi fayaqoolu haomu iqraoo kitabiyah","So as for he who is given his record in his right hand, he will say, \"Here, read my record","Quant à celui à qui on aura remis le Livre en sa main droite, il dira: «Tenez! lisez mon livre"],[20,"إِنِّي ظَنَنتُ أَنِّي مُلَٰقٍ حِسَابِيَهۡ","Innee thanantu annee mulaqin hisabiyah","Indeed, I was certain that I would be meeting my account","J'étais sûr d'y trouver mon compte»"],[21,"فَهُوَ فِي عِيشَةٖ رَّاضِيَةٖ","Fahuwa fee AAeeshatin radiyatin","So he will be in a pleasant life","Il jouira d'une vie agréable"],[22,"فِي جَنَّةٍ عَالِيَةٖ","Fee jannatin AAaliyatin","In an elevated garden","dans un Jardin haut placé"],[23,"قُطُوفُهَا دَانِيَةٞ","Qutoofuha daniyatun","Its [fruit] to be picked hanging near","dont les fruits sont à portée de la main"],[24,"كُلُواْ وَٱشۡرَبُواْ هَنِيٓـَٔۢا بِمَآ أَسۡلَفۡتُمۡ فِي ٱلۡأَيَّامِ ٱلۡخَالِيَةِ","Kuloo waishraboo haneean bima aslaftum fee alayyami alkhaliyati","[They will be told], \"Eat and drink in satisfaction for what you put forth in the days past","«Mangez et buvez agréablement pour ce que vous avez avancé dans les jours passés»"],[25,"وَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ بِشِمَالِهِۦ فَيَقُولُ يَٰلَيۡتَنِي لَمۡ أُوتَ كِتَٰبِيَهۡ","Waamma man ootiya kitabahu bishimalihi fayaqoolu ya laytanee lam oota kitabiyah","But as for he who is given his record in his left hand, he will say, \"Oh, I wish I had not been given my record","Quant à celui à qui on aura remis le Livre en sa main gauche, il dira: «Hélas pour moi! J'aurai souhaité qu'on ne m'ait pas remis mon livre"],[26,"وَلَمۡ أَدۡرِ مَا حِسَابِيَهۡ","Walam adri ma hisabiyah","And had not known what is my account","et ne pas avoir connu mon compte"],[27,"يَٰلَيۡتَهَا كَانَتِ ٱلۡقَاضِيَةَ","Ya laytaha kanati alqadiyatu","I wish my death had been the decisive one","Hélas, comme j'aurai souhaité que [ma première mort] fût la définitive"],[28,"مَآ أَغۡنَىٰ عَنِّي مَالِيَهۡۜ","Ma aghna AAannee maliyah","My wealth has not availed me","Ma fortune ne m'a servi à rien"],[29,"هَلَكَ عَنِّي سُلۡطَٰنِيَهۡ","Halaka AAannee sultaniyah","Gone from me is my authority","Mon autorité est anéantie et m'a quitté!»"]]},"71:1-28":{"s":71,"name":"Nuh","ar":"نوح","en":"Noah","fr":"Noé","v":[[1,"إِنَّآ أَرۡسَلۡنَا نُوحًا إِلَىٰ قَوۡمِهِۦٓ أَنۡ أَنذِرۡ قَوۡمَكَ مِن قَبۡلِ أَن يَأۡتِيَهُمۡ عَذَابٌ أَلِيمٞ","Inna arsalna noohan ila qawmihi an anthir qawmaka min qabli an yatiyahum AAathabun aleemun","Indeed, We sent Noah to his people, [saying], \"Warn your people before there comes to them a painful punishment","Nous avons envoyé Noé vers son peuple: «Avertis ton peuple, avant que leur vienne un châtiment douloureux»"],[2,"قَالَ يَٰقَوۡمِ إِنِّي لَكُمۡ نَذِيرٞ مُّبِينٌ","Qala ya qawmi innee lakum natheerun mubeenun","He said, \"O my people, indeed I am to you a clear warner","Il [leur] dit: «O mon peuple, je suis vraiment pour vous, un avertisseur clair"],[3,"أَنِ ٱعۡبُدُواْ ٱللَّهَ وَٱتَّقُوهُ وَأَطِيعُونِ","Ani oAAbudoo Allaha waittaqoohu waateeAAooni","[Saying], 'Worship Allah, fear Him and obey me","Adorez Allah, craignez-Le et obéissez-moi"],[4,"يَغۡفِرۡ لَكُم مِّن ذُنُوبِكُمۡ وَيُؤَخِّرۡكُمۡ إِلَىٰٓ أَجَلٖ مُّسَمًّىۚ إِنَّ أَجَلَ ٱللَّهِ إِذَا جَآءَ لَا يُؤَخَّرُۚ لَوۡ كُنتُمۡ تَعۡلَمُونَ","Yaghfir lakum min thunoobikum wayuakhkhirkum ila ajalin musamman inna ajala Allahi itha jaa la yuakhkharu law kuntum taAAlamoona","Allah will forgive you of your sins and delay you for a specified term. Indeed, the time [set by] Allah, when it comes, will not be delayed, if you only knew","pour qu'Il vous pardonne vos péchés et qu'Il vous donne un délai jusqu'à un terme fixé. Mais quand vient le terme fixé par Allah, il ne saurait être différé si vous saviez!»"],[5,"قَالَ رَبِّ إِنِّي دَعَوۡتُ قَوۡمِي لَيۡلٗا وَنَهَارٗا","Qala rabbi innee daAAawtu qawmee laylan wanaharan","He said, \"My Lord, indeed I invited my people [to truth] night and day","Il dit: «Seigneur! J'ai appelé mon peuple, nuit et jour"],[6,"فَلَمۡ يَزِدۡهُمۡ دُعَآءِيٓ إِلَّا فِرَارٗا","Falam yazidhum duAAaee illa firaran","But my invitation increased them not except in flight","Mais mon appel n'a fait qu'accroître leur fuite"],[7,"وَإِنِّي كُلَّمَا دَعَوۡتُهُمۡ لِتَغۡفِرَ لَهُمۡ جَعَلُوٓاْ أَصَٰبِعَهُمۡ فِيٓ ءَاذَانِهِمۡ وَٱسۡتَغۡشَوۡاْ ثِيَابَهُمۡ وَأَصَرُّواْ وَٱسۡتَكۡبَرُواْ ٱسۡتِكۡبَارٗا","Wainnee kullama daAAawtuhum litaghfira lahum jaAAaloo asabiAAahum fee athanihim waistaghshaw thiyabahum waasarroo waistakbaroo istikbaran","And indeed, every time I invited them that You may forgive them, they put their fingers in their ears, covered themselves with their garments, persisted, and were arrogant with [great] arrogance","Et chaque fois que je les ai appelés pour que Tu leur pardonnes, ils ont mis leurs doigts dans leurs oreilles. se sont enveloppés de leurs vêtements, se sont entêtés et se sont montrés extrêmement orgueilleux"],[8,"ثُمَّ إِنِّي دَعَوۡتُهُمۡ جِهَارٗا","Thumma innee daAAawtuhum jiharan","Then I invited them publicly","Ensuite, je les ai appelés ouvertement"],[9,"ثُمَّ إِنِّيٓ أَعۡلَنتُ لَهُمۡ وَأَسۡرَرۡتُ لَهُمۡ إِسۡرَارٗا","Thumma innee aAAlantu lahum waasrartu lahum israran","Then I announced to them and [also] confided to them secretly","Puis, je leur ai fait des proclamations publiques, et des confidences en secret"],[10,"فَقُلۡتُ ٱسۡتَغۡفِرُواْ رَبَّكُمۡ إِنَّهُۥ كَانَ غَفَّارٗا","Faqultu istaghfiroo rabbakum innahu kana ghaffaran","And said, 'Ask forgiveness of your Lord. Indeed, He is ever a Perpetual Forgiver","J'ai donc dit: «Implorez le pardon de votre Seigneur, car Il est grand Pardonneur"],[11,"يُرۡسِلِ ٱلسَّمَآءَ عَلَيۡكُم مِّدۡرَارٗا","Yursili alssamaa AAalaykum midraran","He will send [rain from] the sky upon you in [continuing] showers","pour qu'Il vous envoie du ciel, des pluies abondantes"],[12,"وَيُمۡدِدۡكُم بِأَمۡوَٰلٖ وَبَنِينَ وَيَجۡعَل لَّكُمۡ جَنَّـٰتٖ وَيَجۡعَل لَّكُمۡ أَنۡهَٰرٗا","Wayumdidkum biamwalin wabaneena wayajAAal lakum jannatin wayajAAal lakum anharan","And give you increase in wealth and children and provide for you gardens and provide for you rivers","et qu'Il vous accorde beaucoup de biens et d'enfants, et vous donne des jardins et vous donne des rivières"],[13,"مَّا لَكُمۡ لَا تَرۡجُونَ لِلَّهِ وَقَارٗا","Ma lakum la tarjoona lillahi waqaran","What is [the matter] with you that you do not attribute to Allah [due] grandeur","Qu'avez-vous à ne pas vénérer Allah comme il se doit"],[14,"وَقَدۡ خَلَقَكُمۡ أَطۡوَارًا","Waqad khalaqakum atwaran","While He has created you in stages","alors qu'Il vous a créés par phases successives"],[15,"أَلَمۡ تَرَوۡاْ كَيۡفَ خَلَقَ ٱللَّهُ سَبۡعَ سَمَٰوَٰتٖ طِبَاقٗا","Alam taraw kayfa khalaqa Allahu sabAAa samawatin tibaqan","Do you not consider how Allah has created seven heavens in layers","N'avez-vous pas vu comment Allah a créé sept cieux superposés"],[16,"وَجَعَلَ ٱلۡقَمَرَ فِيهِنَّ نُورٗا وَجَعَلَ ٱلشَّمۡسَ سِرَاجٗا","WajaAAala alqamara feehinna nooran wajaAAala alshshamsa sirajan","And made the moon therein a [reflected] light and made the sun a burning lamp","et y a fait de la lune une lumière et du soleil une lampe"],[17,"وَٱللَّهُ أَنۢبَتَكُم مِّنَ ٱلۡأَرۡضِ نَبَاتٗا","WaAllahu anbatakum mina alardi nabatan","And Allah has caused you to grow from the earth a [progressive] growth","Et c'est Allah qui, de la terre, vous a fait croître comme des plantes"],[18,"ثُمَّ يُعِيدُكُمۡ فِيهَا وَيُخۡرِجُكُمۡ إِخۡرَاجٗا","Thumma yuAAeedukum feeha wayukhrijukum ikhrajan","Then He will return you into it and extract you [another] extraction","puis Il vous y fera retourner et vous en fera sortir véritablement"],[19,"وَٱللَّهُ جَعَلَ لَكُمُ ٱلۡأَرۡضَ بِسَاطٗا","WaAllahu jaAAala lakumu alarda bisatan","And Allah has made for you the earth an expanse","Et c'est Allah qui vous a fait de la terre un tapis"],[20,"لِّتَسۡلُكُواْ مِنۡهَا سُبُلٗا فِجَاجٗا","Litaslukoo minha subulan fijajan","That you may follow therein roads of passage","pour que vous vous acheminiez par ses voies spacieuses»"],[21,"قَالَ نُوحٞ رَّبِّ إِنَّهُمۡ عَصَوۡنِي وَٱتَّبَعُواْ مَن لَّمۡ يَزِدۡهُ مَالُهُۥ وَوَلَدُهُۥٓ إِلَّا خَسَارٗا","Qala noohun rabbi innahum AAasawnee waittabaAAoo man lam yazidhu maluhu wawaladuhu illa khasaran","Noah said, \"My Lord, indeed they have disobeyed me and followed him whose wealth and children will not increase him except in loss","Noé dit: «Seigneur, ils m'ont désobéi et ils ont suivi celui dont les biens et les enfants n'ont fait qu'accroître la perte"],[22,"وَمَكَرُواْ مَكۡرٗا كُبَّارٗا","Wamakaroo makran kubbaran","And they conspired an immense conspiracy","Ils ont ourdi un immense stratagème"],[23,"وَقَالُواْ لَا تَذَرُنَّ ءَالِهَتَكُمۡ وَلَا تَذَرُنَّ وَدّٗا وَلَا سُوَاعٗا وَلَا يَغُوثَ وَيَعُوقَ وَنَسۡرٗا","Waqaloo la tatharunna alihatakum wala tatharunna waddan wala suwaAAan wala yaghootha wayaAAooqa wanasran","And said, 'Never leave your gods and never leave Wadd or Suwa' or Yaghuth and Ya'uq and Nasr","et ils ont dit: «N'abandonnez jamais vos divinités et n'abandonnez jamais Wadd, Suwâ, Yaghhû, Ya'ûq et Nasr"],[24,"وَقَدۡ أَضَلُّواْ كَثِيرٗاۖ وَلَا تَزِدِ ٱلظَّـٰلِمِينَ إِلَّا ضَلَٰلٗا","Waqad adalloo katheeran wala tazidi alththalimeena illa dalalan","And already they have misled many. And, [my Lord], do not increase the wrongdoers except in error","Elles [les idoles] ont déjà égaré plusieurs. Ne fais (Seigneur) croître les injustes qu'en égarement"],[25,"مِّمَّا خَطِيٓـَٰٔتِهِمۡ أُغۡرِقُواْ فَأُدۡخِلُواْ نَارٗا فَلَمۡ يَجِدُواْ لَهُم مِّن دُونِ ٱللَّهِ أَنصَارٗا","Mimma khateeatihim oghriqoo faodkhiloo naran falam yajidoo lahum min dooni Allahi ansaran","Because of their sins they were drowned and put into the Fire, and they found not for themselves besides Allah [any] helpers","A cause de leurs fautes, ils ont été noyés, puis on les a fait entrer au Feu, et ils n'ont pas trouvé en dehors d'Allah, de secoureurs»"],[26,"وَقَالَ نُوحٞ رَّبِّ لَا تَذَرۡ عَلَى ٱلۡأَرۡضِ مِنَ ٱلۡكَٰفِرِينَ دَيَّارًا","Waqala noohun rabbi la tathar AAala alardi mina alkafireena dayyaran","And Noah said, \"My Lord, do not leave upon the earth from among the disbelievers an inhabitant","Et Noé dit: «Seigneur, ne laisse sur la terre aucun infidèle"],[27,"إِنَّكَ إِن تَذَرۡهُمۡ يُضِلُّواْ عِبَادَكَ وَلَا يَلِدُوٓاْ إِلَّا فَاجِرٗا كَفَّارٗا","Innaka in tatharhum yudilloo AAibadaka wala yalidoo illa fajiran kaffaran","Indeed, if You leave them, they will mislead Your servants and not beget except [every] wicked one and [confirmed] disbeliever","Si Tu les laisses [en vie], ils égareront Tes serviteurs et n'engendreront que des pécheurs infidèles"],[28,"رَّبِّ ٱغۡفِرۡ لِي وَلِوَٰلِدَيَّ وَلِمَن دَخَلَ بَيۡتِيَ مُؤۡمِنٗا وَلِلۡمُؤۡمِنِينَ وَٱلۡمُؤۡمِنَٰتِۖ وَلَا تَزِدِ ٱلظَّـٰلِمِينَ إِلَّا تَبَارَۢا","Rabbi ighfir lee waliwalidayya waliman dakhala baytiya muminan walilmumineena waalmuminati wala tazidi alththalimeena illa tabaran","My Lord, forgive me and my parents and whoever enters my house a believer and the believing men and believing women. And do not increase the wrongdoers except in destruction","Seigneur! Pardonne-moi, et à mes père et mère et à celui qui entre dans ma demeure croyant, ainsi qu'aux croyants et croyantes; et ne fais croître les injustes qu'en perdition»"]]},"74:1-5":{"s":74,"name":"Al-Muddaththir","ar":"المدثر","en":"The Cloaked One","fr":"Celui qui se couvre","v":[[1,"يَـٰٓأَيُّهَا ٱلۡمُدَّثِّرُ","Ya ayyuha almuddaththiru","O you who covers himself [with a garment]","O, toi (Muhammad)! Le revêtu d'un manteau"],[2,"قُمۡ فَأَنذِرۡ","Qum faanthir","Arise and warn","Lève-toi et avertis"],[3,"وَرَبَّكَ فَكَبِّرۡ","Warabbaka fakabbir","And your Lord glorify","Et de ton Seigneur, célèbre la grandeur"],[4,"وَثِيَابَكَ فَطَهِّرۡ","Wathiyabaka fatahhir","And your clothing purify","Et tes vêtements, purifie-les"],[5,"وَٱلرُّجۡزَ فَٱهۡجُرۡ","Waalrrujza faohjur","And uncleanliness avoid","Et de tout péché, écarte-toi"]]},"81:8-9":{"s":81,"name":"At-Takwir","ar":"التكوير","en":"The Overthrowing","fr":"L'obscurcissement","v":[[8,"وَإِذَا ٱلۡمَوۡءُۥدَةُ سُئِلَتۡ","Waitha almawoodatu suilat","And when the girl [who was] buried alive is asked","et qu'on demandera à la fillette enterrée vivante"],[9,"بِأَيِّ ذَنۢبٖ قُتِلَتۡ","Biayyi thanbin qutilat","For what sin she was killed","pour quel péché elle a été tuée"]]},"85:14":{"s":85,"name":"Al-Buruj","ar":"البروج","en":"The Mansions of the Stars","fr":"Les constellations","v":[[14,"وَهُوَ ٱلۡغَفُورُ ٱلۡوَدُودُ","Wahuwa alghafooru alwadoodu","And He is the Forgiving, the Affectionate","Et c'est Lui le Pardonneur, le Tout-Affectueux"]]},"87:18-19":{"s":87,"name":"Al-A'la","ar":"الأعلى","en":"The Most High","fr":"Le Très-Haut","v":[[18,"إِنَّ هَٰذَا لَفِي ٱلصُّحُفِ ٱلۡأُولَىٰ","Inna hatha lafee alssuhufi aloola","Indeed, this is in the former scriptures","Ceci se trouve, certes, dans les Feuilles anciennes"],[19,"صُحُفِ إِبۡرَٰهِيمَ وَمُوسَىٰ","Suhufi ibraheema wamoosa","The scriptures of Abraham and Moses","les Feuilles d'Abraham et de Moïse"]]},"93:6-11":{"s":93,"name":"Ad-Duhaa","ar":"الضحى","en":"The Morning Hours","fr":"Le jour montant","v":[[6,"أَلَمۡ يَجِدۡكَ يَتِيمٗا فَـَٔاوَىٰ","Alam yajidka yateeman faawa","Did He not find you an orphan and give [you] refuge","Ne t'a-t-Il pas trouvé orphelin? Alors Il t'a accueilli"],[7,"وَوَجَدَكَ ضَآلّٗا فَهَدَىٰ","Wawajadaka dallan fahada","And He found you lost and guided [you]","Ne t'a-t-Il pas trouvé égaré? Alors Il t'a guidé"],[8,"وَوَجَدَكَ عَآئِلٗا فَأَغۡنَىٰ","Wawajadaka AAailan faaghna","And He found you poor and made [you] self-sufficient","Ne t'a-t-Il pas trouvé pauvre? Alors Il t'a enrichi"],[9,"فَأَمَّا ٱلۡيَتِيمَ فَلَا تَقۡهَرۡ","Faamma alyateema fala taqhar","So as for the orphan, do not oppress [him]","Quant à l'orphelin, donc, ne le maltraite pas"],[10,"وَأَمَّا ٱلسَّآئِلَ فَلَا تَنۡهَرۡ","Waamma alssaila fala tanhar","And as for the petitioner, do not repel [him]","Quant au demandeur, ne le repousse pas"],[11,"وَأَمَّا بِنِعۡمَةِ رَبِّكَ فَحَدِّثۡ","Waamma biniAAmati rabbika fahaddith","But as for the favor of your Lord, report [it]","Et quant au bienfait de ton Seigneur, proclame-le"]]},"96:1-5":{"s":96,"name":"Al-'Alaq","ar":"العلق","en":"The Clot","fr":"L'adhérence","v":[[1,"ٱقۡرَأۡ بِٱسۡمِ رَبِّكَ ٱلَّذِي خَلَقَ","Iqra biismi rabbika allathee khalaqa","Recite in the name of your Lord who created","Lis, au nom de ton Seigneur qui a créé"],[2,"خَلَقَ ٱلۡإِنسَٰنَ مِنۡ عَلَقٍ","Khalaqa alinsana min AAalaqin","Created man from a clinging substance","qui a créé l'homme d'une adhérence"],[3,"ٱقۡرَأۡ وَرَبُّكَ ٱلۡأَكۡرَمُ","Iqra warabbuka alakramu","Recite, and your Lord is the most Generous","Lis! Ton Seigneur est le Très Noble"],[4,"ٱلَّذِي عَلَّمَ بِٱلۡقَلَمِ","Allathee AAallama bialqalami","Who taught by the pen","qui a enseigné par la plume [le calame]"],[5,"عَلَّمَ ٱلۡإِنسَٰنَ مَا لَمۡ يَعۡلَمۡ","AAallama alinsana ma lam yaAAlam","Taught man that which he knew not","a enseigné à l'homme ce qu'il ne savait pas"]]},"97:1":{"s":97,"name":"Al-Qadr","ar":"القدر","en":"The Power","fr":"La destinée","v":[[1,"إِنَّآ أَنزَلۡنَٰهُ فِي لَيۡلَةِ ٱلۡقَدۡرِ","Inna anzalnahu fee laylati alqadri","Indeed, We sent the Qur'an down during the Night of Decree","Nous l'avons certes, fait descendre (le Coran) pendant la nuit d'Al-Qadr"]]},"97:1-5":{"s":97,"name":"Al-Qadr","ar":"القدر","en":"The Power","fr":"La destinée","v":[[1,"إِنَّآ أَنزَلۡنَٰهُ فِي لَيۡلَةِ ٱلۡقَدۡرِ","Inna anzalnahu fee laylati alqadri","Indeed, We sent the Qur'an down during the Night of Decree","Nous l'avons certes, fait descendre (le Coran) pendant la nuit d'Al-Qadr"],[2,"وَمَآ أَدۡرَىٰكَ مَا لَيۡلَةُ ٱلۡقَدۡرِ","Wama adraka ma laylatu alqadri","And what can make you know what is the Night of Decree","Et qui te dira ce qu'est la nuit d'Al-Qadr"],[3,"لَيۡلَةُ ٱلۡقَدۡرِ خَيۡرٞ مِّنۡ أَلۡفِ شَهۡرٖ","Laylatu alqadri khayrun min alfi shahrin","The Night of Decree is better than a thousand months","La nuit d'Al-Qadr est meilleure que mille mois"],[4,"تَنَزَّلُ ٱلۡمَلَـٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذۡنِ رَبِّهِم مِّن كُلِّ أَمۡرٖ","Tanazzalu almalaikatu waalrroohu feeha biithni rabbihim min kulli amrin","The angels and the Spirit descend therein by permission of their Lord for every matter","Durant celle-ci descendent les Anges ainsi que l'Esprit, par permission de leur Seigneur pour tout ordre"],[5,"سَلَٰمٌ هِيَ حَتَّىٰ مَطۡلَعِ ٱلۡفَجۡرِ","Salamun hiya hatta matlaAAi alfajri","Peace it is until the emergence of dawn","Elle est paix et salut jusqu'à l'apparition de l'aube"]]},"99:1-8":{"s":99,"name":"Az-Zalzalah","ar":"الزلزلة","en":"The Earthquake","fr":"Le séisme","v":[[1,"إِذَا زُلۡزِلَتِ ٱلۡأَرۡضُ زِلۡزَالَهَا","Itha zulzilati alardu zilzalaha","When the earth is shaken with its [final] earthquake","Quand la terre tremblera d'un violent tremblement"],[2,"وَأَخۡرَجَتِ ٱلۡأَرۡضُ أَثۡقَالَهَا","Waakhrajati alardu athqalaha","And the earth discharges its burdens","et que la terre fera sortir ses fardeaux"],[3,"وَقَالَ ٱلۡإِنسَٰنُ مَا لَهَا","Waqala alinsanu ma laha","And man says, \"What is [wrong] with it","et que l'homme dira: «Qu'a-t-elle?»"],[4,"يَوۡمَئِذٖ تُحَدِّثُ أَخۡبَارَهَا","Yawmaithin tuhaddithu akhbaraha","That Day, it will report its news","ce jour-là, elle contera son histoire"],[5,"بِأَنَّ رَبَّكَ أَوۡحَىٰ لَهَا","Bianna rabbaka awha laha","Because your Lord has commanded it","selon ce que ton Seigneur lui aura révélé [ordonné]"],[6,"يَوۡمَئِذٖ يَصۡدُرُ ٱلنَّاسُ أَشۡتَاتٗا لِّيُرَوۡاْ أَعۡمَٰلَهُمۡ","Yawmaithin yasduru alnnasu ashtatan liyuraw aAAmalahum","That Day, the people will depart separated [into categories] to be shown [the result of] their deeds","Ce jour-là, les gens sortiront séparément pour que leur soient montrées leurs œuvres"],[7,"فَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٍ خَيۡرٗا يَرَهُۥ","Faman yaAAmal mithqala tharratin khayran yarahu","So whoever does an atom's weight of good will see it","Quiconque fait un bien fût-ce du poids d'un atome, le verra"],[8,"وَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٖ شَرّٗا يَرَهُۥ","Waman yaAAmal mithqala tharratin sharran yarahu","And whoever does an atom's weight of evil will see it","et quiconque fait un mal fût-ce du poids d'un atome, le verra"]]},"103:1-3":{"s":103,"name":"Al-'Asr","ar":"العصر","en":"The Declining Day","fr":"Le temps","v":[[1,"وَٱلۡعَصۡرِ","WaalAAasri","By time","Par le Temps"],[2,"إِنَّ ٱلۡإِنسَٰنَ لَفِي خُسۡرٍ","Inna alinsana lafee khusrin","Indeed, mankind is in loss","L'homme est certes, en perdition"],[3,"إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ وَتَوَاصَوۡاْ بِٱلۡحَقِّ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ","Illa allatheena amanoo waAAamiloo alssalihati watawasaw bialhaqqi watawasaw bialssabri","Except for those who have believed and done righteous deeds and advised each other to truth and advised each other to patience","sauf ceux qui croient et accomplissent les bonnes œuvres, s'enjoignent mutuellement la vérité et s'enjoignent mutuellement l'endurance"]]},"105:1-5":{"s":105,"name":"Al-Fil","ar":"الفيل","en":"The Elephant","fr":"L'éléphant","v":[[1,"أَلَمۡ تَرَ كَيۡفَ فَعَلَ رَبُّكَ بِأَصۡحَٰبِ ٱلۡفِيلِ","Alam tara kayfa faAAala rabbuka biashabi alfeeli","Have you not considered, [O Muhammad], how your Lord dealt with the companions of the elephant","N'as-tu pas vu comment ton Seigneur a agi envers les gens de l'Eléphant"],[2,"أَلَمۡ يَجۡعَلۡ كَيۡدَهُمۡ فِي تَضۡلِيلٖ","Alam yajAAal kaydahum fee tadleelin","Did He not make their plan into misguidance","N'a-t-Il pas rendu leur ruse complètement vaine"],[3,"وَأَرۡسَلَ عَلَيۡهِمۡ طَيۡرًا أَبَابِيلَ","Waarsala AAalayhim tayran ababeela","And He sent against them birds in flocks","et envoyé sur eux des oiseaux par volées"],[4,"تَرۡمِيهِم بِحِجَارَةٖ مِّن سِجِّيلٖ","Tarmeehim bihijaratin min sijjeelin","Striking them with stones of hard clay","qui leur lançaient des pierres d'argile"],[5,"فَجَعَلَهُمۡ كَعَصۡفٖ مَّأۡكُولِۭ","FajaAAalahum kaAAasfin makoolin","And He made them like eaten straw","Et Il les a rendus semblables à une paille mâchée"]]},"107:4-5":{"s":107,"name":"Al-Ma'un","ar":"الماعون","en":"The Small kindnesses","fr":"L'entraide","v":[[4,"فَوَيۡلٞ لِّلۡمُصَلِّينَ","Fawaylun lilmusalleena","So woe to those who pray","Malheur donc, à ceux qui prient"],[5,"ٱلَّذِينَ هُمۡ عَن صَلَاتِهِمۡ سَاهُونَ","Allatheena hum AAan salatihim sahoona","[But] who are heedless of their prayer","tout en négligeant (et retardant) leur Salât"]]},"110:1-3":{"s":110,"name":"An-Nasr","ar":"النصر","en":"The Divine Support","fr":"Le secours","v":[[1,"إِذَا جَآءَ نَصۡرُ ٱللَّهِ وَٱلۡفَتۡحُ","Itha jaa nasru Allahi waalfathu","When the victory of Allah has come and the conquest","Lorsque vient le secours d'Allah ainsi que la victoire"],[2,"وَرَأَيۡتَ ٱلنَّاسَ يَدۡخُلُونَ فِي دِينِ ٱللَّهِ أَفۡوَاجٗا","Waraayta alnnasa yadkhuloona fee deeni Allahi afwajan","And you see the people entering into the religion of Allah in multitudes","et que tu vois les gens entrer en foule dans la religion d'Allah"],[3,"فَسَبِّحۡ بِحَمۡدِ رَبِّكَ وَٱسۡتَغۡفِرۡهُۚ إِنَّهُۥ كَانَ تَوَّابَۢا","Fasabbih bihamdi rabbika waistaghfirhu innahu kana tawwaban","Then exalt [Him] with praise of your Lord and ask forgiveness of Him. Indeed, He is ever Accepting of repentance","alors, par la louange, célèbre la gloire de ton Seigneur et implore Son pardon. Car c'est Lui le grand Accueillant au repentir"]]},"111:1-5":{"s":111,"name":"Al-Masad","ar":"المسد","en":"The Palm Fiber","fr":"Les fibres","v":[[1,"تَبَّتۡ يَدَآ أَبِي لَهَبٖ وَتَبَّ","Tabbat it settles","contre le mal de l'obscurité quand elle s'approfondit"],[4,"وَمِن شَرِّ ٱلنَّفَّـٰثَٰتِ فِي ٱلۡعُقَدِ","Wamin sharri alnnaffathati fee alAAuqadi","And from the evil of the blowers in knots","contre le mal de celles qui soufflent [les sorcières] sur les nœuds"],[5,"وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","Wamin sharri hasidin itha hasada","And from the evil of an envier when he envies","et contre le mal de l'envieux quand il envie»"]]},"114:1-6":{"s":114,"name":"An-Nas","ar":"الناس","en":"Mankind","fr":"Les humains","v":[[1,"قُلۡ أَعُوذُ بِرَبِّ ٱلنَّاسِ","Qul aAAoothu birabbi alnnasi","Say, \"I seek refuge in the Lord of mankind","Dis: «Je cherche protection auprès du Seigneur des hommes"],[2,"مَلِكِ ٱلنَّاسِ","Maliki alnnasi","The Sovereign of mankind","Le Souverain des hommes"],[3,"إِلَٰهِ ٱلنَّاسِ","Ilahi alnnasi","The God of mankind","Dieu des hommes"],[4,"مِن شَرِّ ٱلۡوَسۡوَاسِ ٱلۡخَنَّاسِ","Min sharri alwaswasi alkhannasi","From the evil of the retreating whisperer","contre le mal du mauvais conseiller, furtif"],[5,"ٱلَّذِي يُوَسۡوِسُ فِي صُدُورِ ٱلنَّاسِ","Allathee yuwaswisu fee sudoori alnnasi","Who whispers [evil] into the breasts of mankind","qui souffle le mal dans les poitrines des hommes"],[6,"مِنَ ٱلۡجِنَّةِ وَٱلنَّاسِ","Mina aljinnati wa alnnasm","From among the jinn and mankind","qu'il (le conseiller) soit un djinn, ou un être humain»"]]}};

// ---------- State ----------
const LS="fajr-ten-v1";
let S={start:null,done:{},scores:{},acts:{},answers:{},lang:null,alarm:{on:true,t:"06:30"},fired:null};
try{const raw=localStorage.getItem(LS);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
if(!S.lang)S.lang=(navigator.language||"").toLowerCase().startsWith("fr")?"fr":"en";
if(!S.alarm)S.alarm={on:true,t:"06:30"};
const tr=()=>STR[S.lang]||STR.en;
let syncMode="device", dbRef=null, saveTimer=null;
function persist(){
 try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
 if(dbRef){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{dbRef.set(JSON.parse(JSON.stringify(S))).then(()=>{syncMode="account";paintStatus();}).catch(()=>{syncMode="device";paintStatus();});},600);}
}
function merge(r){
 if(!r)return;
 S.start=r.start||S.start; if(r.lang)S.lang=r.lang; if(r.audio)S.audio=r.audio; if(r.alarm)S.alarm=r.alarm; if(r.fired&&(!S.fired||r.fired>S.fired))S.fired=r.fired;
 for(const k of ["done","scores","acts","answers"])S[k]=Object.assign({},r[k]||{},S[k]||{});
}
(async()=>{
 try{
  if(!window.claude||!window.claude.use)return;
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db||!user)return;
  const id=await user.id(); if(!id)return;
  dbRef=db.doc("data/users/"+id+"/progress");
  const snap=await Promise.race([dbRef.get(),new Promise(r=>setTimeout(()=>r("timeout"),10000))]);
  if(snap==="timeout"){dbRef=null;return;}
  if(snap&&snap.data&&snap.data())merge(snap.data());
  syncMode="account"; persist(); render();
 }catch(e){dbRef=null;}
})();

// ---------- Curriculum access ----------
function lessonOf(ti,w){const en=TRACK_DATA[ti][0][w-1];if(S.lang!=="fr")return en;const fr=TRACK_DATA[ti][1][w-1]||{};return Object.assign({},en,fr);}
// Passages named in an action but not in the source list
SEERAH[10].s.push("Q:3:173"); SEERAH[21].s.push("Q:2:216"); WORSHIP[24].s.push("Q:85:14");
WORSHIP[14].s.unshift("Q:1:1-7"); DUA[23].s.unshift("Q:112:1-4","Q:113:1-5","Q:114:1-6");

// Transliteration adapted for French readers (from the tanzil.net scheme)
function phon(t){return t.replace(/AA/g,"ʿ");}
function frPhon(t){return phon(t).replace(/oo/g,"\u0001").replace(/ee/g,"\u0002").replace(/u/g,"ou")
 .replace(/\u0001/g,"oû").replace(/\u0002/g,"î");}
function passages(L){const ps=L.s.filter(c=>c.startsWith("Q:")).map(c=>c.slice(2)).filter(k=>QURAN[k]).map(k=>({k,...QURAN[k]}));
 const act=(L.a||"")+" "+(TRACK_DATA.flatMap(x=>x[0]).find(x=>x.t===L.t)||{}).a;
 ps.forEach(p=>{p.m=new RegExp("(^|[^\\d:])"+p.s+"(?![\\d])").test(act);});
 return ps.sort((a,b)=>b.m-a.m);}
// ---------- Recitation player (verse by verse) ----------
const RECITERS={husary:{ea:"Husary_128kbps",inet:"ar.husary"},minshawi:{ea:"Minshawy_Murattal_128kbps",inet:"ar.minshawi"},alafasy:{ea:"Alafasy_128kbps",inet:"ar.alafasy"}};
if(!S.audio)S.audio={rec:"husary",rep:1,gap:true,rate:1,hideTr:false};
const pad3=n=>String(n).padStart(3,"0");
function gnum(s,a){let n=0;for(let i=0;i<s-1;i++)n+=SURAH_LEN[i];return n+a;}
function audioUrls(s,a){const r=RECITERS[S.audio.rec]||RECITERS.husary;return[`https://everyayah.com/data/${r.ea}/${pad3(s)}${pad3(a)}.mp3`,`https://cdn.islamic.network/quran/audio/128/${r.inet}/${gnum(s,a)}.mp3`];}
const player={audio:new Audio(),q:[],i:0,rep:0,key:null,timer:null,try:0,waiting:false};
player.audio.preload="auto";
function pEls(sel){return document.querySelectorAll(sel);}
function pState(msg){pEls(`[data-pk]`).forEach(e=>{e.textContent=e.dataset.pk===player.key?msg:"";});}
function pSync(){
 pEls(".verse.playing").forEach(e=>e.classList.remove("playing"));
 pEls("[data-act=pplay]").forEach(b=>{const on=b.dataset.k===player.key;b.textContent=on?"■ "+tr().stopL:"▶ "+tr().playAll;b.classList.toggle("ghost",on);});
 if(!player.key)return;
 const it=player.q[player.i];if(!it)return;
 const el=document.querySelector(`[data-vk="${player.key}|${it.a}"]`);
 if(el){el.classList.add("playing");}
}
function pStop(){clearTimeout(player.timer);player.audio.pause();player.audio.removeAttribute("src");player.q=[];player.key=null;player.waiting=false;pSync();pState("");}
function pStart(key,from,only){
 unlockAudio(); pStop();
 const p=QURAN[key]; player.key=key;
 player.q=(only?[p.v[from]]:p.v.slice(from)).map(v=>({s:p.s,a:v[0]}));
 player.i=0;player.rep=0;pPlayCurrent();
}
function pPlayCurrent(){
 const it=player.q[player.i];
 if(!it){const k=player.key;pStop();return;}
 player.try=0;player.waiting=false;
 const p=QURAN[player.key],R=S.audio.rep;
 pState(tr().stVerse(player.i+1,player.q.length,player.rep+1,R));
 pSync();
 const el=document.querySelector(`[data-vk="${player.key}|${it.a}"]`);
 if(el)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
 try{if("mediaSession" in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:`${tr().surah} ${p.name} · ${it.s}:${it.a}`,artist:tr().recNames[S.audio.rec],album:"Fajr Ten"});}catch(e){}
 player.audio.src=audioUrls(it.s,it.a)[0];
 player.audio.playbackRate=S.audio.rate;
 player.audio.play().catch(()=>{});
}
player.audio.addEventListener("error",()=>{
 if(!player.key)return;
 const it=player.q[player.i];if(!it)return;
 player.try++;
 const u=audioUrls(it.s,it.a);
 if(player.try<u.length){player.audio.src=u[player.try];player.audio.playbackRate=S.audio.rate;player.audio.play().catch(()=>{});}
 else{const k=player.key;pStop();player.key=k;pState(tr().audErr);player.key=null;}
});
player.audio.addEventListener("ended",()=>{
 if(!player.key)return;
 const dur=(player.audio.duration||3)*1000/S.audio.rate;
 player.rep++;
 const again=player.rep<S.audio.rep;
 if(!again){player.rep=0;player.i++;}
 const wait=S.audio.gap?dur+600:450;
 if(S.audio.gap){player.waiting=true;pState(tr().yourTurn);}
 player.timer=setTimeout(pPlayCurrent,wait);
});
function aSet(f,v){
 if(f==="rep"||f==="rate")v=+v; if(f==="gap"||f==="hideTr")v=!S.audio[f];
 S.audio[f]=v; persist();
 if(f==="rate")player.audio.playbackRate=v;
 if(f==="hideTr")document.body.classList.toggle("hidetr",v);
 pEls(`[data-act=aset][data-f="${f}"]`).forEach(b=>b.setAttribute("aria-pressed",(f==="gap"||f==="hideTr")?String(S.audio[f]):String(String(S.audio[f])===b.dataset.v)));
}
function chipRow(){
 const U=tr(),A=S.audio;
 const ch=(f,v,l)=>`<button class="pchip" data-act="aset" data-f="${f}" data-v="${v}" aria-pressed="${String(A[f])===String(v)}">${l}</button>`;
 const tg=(f,l)=>`<button class="pchip" data-act="aset" data-f="${f}" aria-pressed="${!!A[f]}">${l}</button>`;
 const rec=Object.keys(RECITERS).map(k=>`<option value="${k}"${A.rec===k?" selected":""}>${esc(U.recNames[k])}</option>`).join("");
 return `<div class="pchips"><span class="plab">${U.repL}</span>${ch("rep",1,"1×")}${ch("rep",3,"3×")}${ch("rep",5,"5×")}
 <span class="plab">${U.speedL}</span>${ch("rate",1,"1×")}${ch("rate",0.75,"0,75×")}
 ${tg("gap",U.gapL)}${tg("hideTr",U.hideL)}
 <label class="plab">${U.recL} <select class="psel" data-act="arec">${rec}</select></label></div>`;
}
function passageView(p,open){
 const U=tr(),fr=S.lang==="fr";
 const [a,b]=[p.v[0][0],p.v[p.v.length-1][0]];
 const range=a===b?`${a}`:`${a}–${b}`;
 const verses=p.v.map((v,i)=>`<div class="verse" data-vk="${p.k}|${v[0]}"><div class="qar" lang="ar" dir="rtl">${esc(v[1])} <span class="vno">﴿${v[0].toLocaleString("ar-EG")}﴾</span></div>
  <div class="qtl"><button class="vplay" data-act="vplay" data-k="${p.k}" data-i="${i}" aria-label="${U.playOne} ${p.s}:${v[0]}">▶</button><span class="vn">${p.s}:${v[0]}</span> ${esc(fr?frPhon(v[2]):phon(v[2]))}</div><div class="qtr">${esc(fr?v[4]:v[3])}</div></div>`).join("");
 return `<details class="passage"${open?" open":""}><summary><span><b>${U.surah} ${esc(p.name)}</b> <span lang="ar" class="sar">${esc(p.ar)}</span></span><span class="small muted">${fr?esc(p.fr):esc(p.en)} · ${p.s}:${range} · ${p.v.length} ${p.v.length>1?U.verses:U.verse}</span></summary>
 <div class="pbody"><div class="pctl"><button class="btn" data-act="pplay" data-k="${p.k}">▶ ${U.playAll}</button><span class="pstate small" data-pk="${p.k}" aria-live="polite"></span></div>${chipRow()}
 ${verses}<p class="small muted" style="margin:0">${U.qnote} ${U.audNote} <a href="https://quran.com/${fr?"fr/":""}${p.s}/${a===b?a:a+"-"+b}" target="_blank" rel="noopener">${U.listen}</a></p></div></details>`;
}
function trackOf(ti){return{name:tr().tracks[ti],c:TRACK_C[ti]};}
function info(d){const w=Math.ceil(d/7),pos=(d-1)%7;
 if(pos<5)return{d,w,pos,type:"lesson",track:trackOf(pos),L:lessonOf(pos,w)};
 return{d,w,pos,type:pos===5?"practice":"review"};}
function weekLessons(w){return [0,1,2,3,4].map(i=>({d:(w-1)*7+i+1,track:trackOf(i),L:lessonOf(i,w)}));}

// ---------- Sources ----------
const BOOKS={B:["Sahih al-Bukhari","bukhari","s"],M:["Sahih Muslim","muslim","s"],AD:["Sunan Abi Dawud","abudawud","h"],T:["Jami' at-Tirmidhi","tirmidhi","h"],N:["Sunan an-Nasa'i","nasai","h"],IM:["Sunan Ibn Majah","ibnmajah","h"]};
function src(code){
 const T=tr().tiers;
 let m=code.match(/^Q:(\d+):([\d-]+)$/);
 if(m)return{tier:"q",tl:T.q,label:`${tr().quran} ${m[1]}:${m[2]}`,url:`https://quran.com/${S.lang==="fr"?"fr/":""}${m[1]}/${m[2]}`};
 m=code.match(/^(B|M|AD|T|N|IM):(\d+)$/);
 if(m){const b=BOOKS[m[1]];return{tier:b[2],tl:T[b[2]],label:`${b[0]} ${m[2]}`,url:`https://sunnah.com/${b[1]}:${m[2]}`};}
 if(code==="IH")return{tier:"b",tl:T.b,label:"Ibn Hisham, as-Sirah an-Nabawiyyah"};
 if(code==="RM")return{tier:"b",tl:T.b,label:S.lang==="fr"?"Safiur-Rahman al-Mubarakpuri, ar-Rahiq al-Makhtum (Le Nectar cacheté)":"Safiur-Rahman al-Mubarakpuri, ar-Rahiq al-Makhtum (The Sealed Nectar)"};
 if(/^(Sahih al-Bukhari|Bukhari)/.test(code))return{tier:"s",tl:T.s,label:code};
 if(/Ahmad/.test(code))return{tier:"h",tl:T.m,label:code};
 return{tier:"b",tl:T.r,label:code};
}

// ---------- Dates ----------
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const utc=s=>{const[y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d);};
function todayDay(){const st=S.start||iso(new Date());return Math.floor((utc(iso(new Date()))-utc(st))/864e5)+1;}
function loc(){return S.lang==="fr"?"fr-FR":"en-GB";}
function dateOfDay(d){const st=S.start||iso(new Date());return new Date(utc(st)+(d-1)*864e5).toLocaleDateString(loc(),{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"});}
function alarmMins(){const[h,m]=(S.alarm.t||"06:30").split(":").map(Number);return h*60+m;}
function fmtTime(mins){const h=Math.floor(mins/60),m=mins%60;return S.lang==="fr"?`${h} h ${pad(m)}`:`${h}:${pad(m)}`;}
function windowLabel(){const a=alarmMins();return `${fmtTime(a)} – ${fmtTime(a+10)}`;}

// ---------- Helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function seeded(n){let x=Math.sin(n*9301+49297)*233280;return x-Math.floor(x);}
function order(n,seed){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(seeded(seed+i)*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

 $("#meterR").textContent=L.daysDone(doneN);

 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===S.lang));

 else m.innerHTML=aboutView();
 paintStatus(); paintClock(); paintTimer();
 document.body.classList.toggle("hidetr",!!(S.audio&&S.audio.hideTr)); if(typeof pSync==="function"){pSync();if(player.key){const it=player.q[player.i];pState(player.waiting?tr().yourTurn:(it?tr().stVerse(player.i+1,player.q.length,player.rep+1,S.audio.rep):""));}}

function lessonView(I){
 const L=I.L,t=I.track,U=tr();
 const ord=order(3,I.d*7); const ans=S.answers[I.d];
 const opts=ord.map(i=>{let cls="";if(ans!==undefined){if(i===L.q[2])cls="right";else if(i===ans)cls="wrong";}
  return `<button class="opt ${cls}" data-act="ans" data-d="${I.d}" data-i="${i}" ${ans!==undefined?"disabled":""}>${esc(L.q[1][i])}</button>`;}).join("");

 return `<article style="display:grid;gap:16px"><div>${eyebrow(I,t.name,t.c)}<h2 class="title">${esc(L.t)}</h2></div>
 <div class="body">${paras}</div>${ar}

function reviewQs(w){
 const U=tr(); const qs=weekLessons(w).map(x=>({...x,from:U.thisWeek}));
 for(const back of [1,3,7,15]){const ww=w-back;if(ww<1)continue;const ls=weekLessons(ww);const x=ls[Math.floor(seeded(w*31+back)*5)];qs.push({...x,from:`${U.week} ${ww}`});}
 return qs;
}
function reviewView(I){
 const U=tr(); const qs=reviewQs(I.w); const got=S.answers["r"+I.w]||{};
 let right=0,answered=0;
 const items=qs.map((x,qi)=>{const L=x.L;const ord=order(3,I.d*13+qi);const a=got[qi];
  if(a!==undefined){answered++;if(a===L.q[2])right++;}
  const opts=ord.map(i=>{let cls="";if(a!==undefined){if(i===L.q[2])cls="right";else if(i===a)cls="wrong";}
   return `<button class="opt ${cls}" data-act="rans" data-w="${I.w}" data-q="${qi}" data-i="${i}" ${a!==undefined?"disabled":""}>${esc(L.q[1][i])}</button>`;}).join("");
  return `<div class="quiz"><div class="eyebrow"><span class="chip" style="--tc:${x.track.c}">${x.from}</span><button class="linkbtn small" data-act="open" data-d="${x.d}">${esc(L.t)}</button></div><p class="qq">${esc(L.q[0])}</p><div class="opts">${opts}</div></div>`;}).join("");
 const total=qs.length;
 const sc=answered===total?`<div class="panel"><div class="score">${right}/${total}</div><p class="small muted" style="margin:0">${right===total?U.excellent:U.missed}</p></div>`:"";
 return `<div>${eyebrow(I,U.review,"var(--accent)")}<h2 class="title">${U.reviewH(I.w)}</h2></div><p class="muted small" style="margin:0">${U.reviewP}</p>${items}${sc}`;
}
function journeyView(td){
 const U=tr(); const started=!!S.start; let rows="";
 for(let w=1;w<=WEEKS;w++){let cells="";
  for(let p=0;p<7;p++){const d=(w-1)*7+p+1;const I=info(d);
   const locked=started?d>td:d>1;const c=I.type==="lesson"?I.track.c:"var(--muted)";
   const cls=["cell",S.done[d]?"done":"",d===td&&started?"today":"",locked?"locked":"",I.type==="practice"?"pr":"",I.type==="review"?"rv":""].join(" ");
   const lab=I.type==="lesson"?I.L.t:(I.type==="practice"?U.practice:U.review);
   cells+=`<button class="${cls}" style="--tc:${c}" ${locked?"disabled":""} data-act="open" data-d="${d}" title="${U.day} ${d} : ${esc(lab)}" aria-label="${U.day} ${d} : ${esc(lab)}">${d}</button>`;}
  rows+=`<div class="wk"><span class="lab">${U.week.slice(0,3)}. ${w}</span><div class="cells">${cells}</div></div>`;}
 const doneN=Object.keys(S.done).length;
 let streak=0;for(let d=Math.min(td,TOTAL);d>=1;d--){if(S.done[d])streak++;else if(d===td)continue;else break;}
 const sc=Object.values(S.scores);const avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length*100)+" %":"–";
 const legend=U.tracks.map((t,i)=>`<span><i style="--tc:${TRACK_C[i]}"></i>${U.day} ${i+1} : ${t}</span>`).join("")+`<span><i style="--tc:var(--muted)"></i>${U.legend67}</span>`;
 return `<div class="stats"><div class="stat"><b>${doneN}</b><span>${U.stDays}</span></div><div class="stat"><b>${streak}</b><span>${U.stStreak}</span></div><div class="stat"><b>${avg}</b><span>${U.stAvg}</span></div></div>
 <div class="legend">${legend}</div><div class="weeks">${rows}</div>`;
}

// ---------- Sound (generated, no files) ----------
let actx=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){}}
function chime(rounds=3){
 if(!actx)return;
 const notes=[659.25,783.99,987.77];
 for(let r=0;r<rounds;r++)notes.forEach((f,i)=>{const t=actx.currentTime+r*2.2+i*0.45;
  const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
  o.connect(g).connect(actx.destination);o.start(t);o.stop(t+1.7);});
}

// ---------- Timer ----------
let tRun=null,tEnd=0,lock=null,tFinished=false,armed=false;
async function keepAwake(){try{if(!lock||lock.released)lock=await navigator.wakeLock.request("screen");}catch(e){}}
function paintTimer(){const v=$("#tVal"),b=$("#tBtn"),l=$("#tLbl");if(!v)return;const U=tr();
 if(tRun){const s=Math.ceil(Math.max(0,tEnd-Date.now())/1000);v.textContent=pad(Math.floor(s/60))+":"+pad(s%60);if(b)b.textContent=U.stop;if(l)l.textContent=U.bism;}
 else if(tFinished){v.textContent="00:00";if(b)b.textContent=U.again;if(l)l.textContent=U.tdone;}}
function tick(){if(Date.now()>=tEnd){clearInterval(tRun);tRun=null;tFinished=true;chime(1);if(!armed)try{lock&&lock.release();}catch(e){}}paintTimer();}
function startTimer(ms){tFinished=false;clearInterval(tRun);tEnd=Date.now()+ms;tRun=setInterval(tick,500);keepAwake();paintTimer();}
function toggleTimer(){unlockAudio();
 if(tRun){clearInterval(tRun);tRun=null;tFinished=false;const v=$("#tVal");if(v)v.textContent="10:00";const b=$("#tBtn");if(b)b.textContent=tr().start10;paintClock();return;}
 startTimer(600000);}

// ---------- Alarm and auto-start ----------
function checkAlarm(){
 if(!S.alarm.on)return;
 const n=new Date(),mins=n.getHours()*60+n.getMinutes(),a=alarmMins(),today=iso(n);
 if(mins>=a&&mins<a+10&&S.fired!==today){
  S.fired=today;persist();
  const end=new Date(n);end.setHours(Math.floor((a+10)/60),(a+10)%60,0,0);
  view="today";openDay=null;autoNote=true;render();window.scrollTo(0,0);
  startTimer(Math.max(60000,end-Date.now()));
  chime(3);
  if(window.onAlarmFire)window.onAlarmFire();
 }
}
setInterval(()=>{paintClock();checkAlarm();},15000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){checkAlarm();if(armed||tRun)keepAwake();}});

 "BEGIN:VEVENT","UID:fajr-ten-"+st+"@fajr-ten","DTSTAMP:"+stamp,"DTSTART;TZID=Africa/Bamako:"+st+"T"+hm(a),"DTEND;TZID=Africa/Bamako:"+st+"T"+hm(b),"RRULE:FREQ=DAILY;COUNT=182",

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
 if(a==="tab"){view=b.dataset.v;openDay=null;render();window.scrollTo(0,0);}
 else if(a==="open"){view="today";openDay=+b.dataset.d;render();window.scrollTo(0,0);}
 else if(a==="lang"){S.lang=b.dataset.l;persist();render();}
 else if(a==="begin"){const v=$("#startIn").value;if(v){S.start=v;S.done={};persist();openDay=null;render();}}
 else if(a==="setstart"){const v=$("#startEdit").value;if(v){S.start=v;persist();render();}}
 else if(a==="done"){S.done[b.dataset.d]=Date.now();persist();render();}
 else if(a==="undone"){delete S.done[b.dataset.d];persist();render();}
 else if(a==="ans"){S.answers[b.dataset.d]=+b.dataset.i;persist();render();}
 else if(a==="rans"){const w=+b.dataset.w,key="r"+w;S.answers[key]=S.answers[key]||{};S.answers[key][b.dataset.q]=+b.dataset.i;
  const qs=reviewQs(w);const got=S.answers[key];if(Object.keys(got).length===qs.length){let r=0;qs.forEach((x,i)=>{if(got[i]===x.L.q[2])r++;});S.scores[w]=r/qs.length;}
  persist();const y=window.scrollY;render();window.scrollTo(0,y);}
 else if(a==="pplay"){if(player.key===b.dataset.k)pStop();else pStart(b.dataset.k,0,false);}
 else if(a==="vplay"){pStart(b.dataset.k,+b.dataset.i,true);}
 else if(a==="aset"){aSet(b.dataset.f,b.dataset.v);}
 else if(a==="flip"){const s=b.querySelector("[data-show]"),h=b.querySelector("[data-hide]");const open=s.hidden;s.hidden=!open;h.hidden=open;b.setAttribute("aria-expanded",open);}
 else if(a==="timer")toggleTimer();
 else if(a==="arm"){unlockAudio();armed=true;S.alarm.on=true;persist();keepAwake();if(window.onArm)window.onArm();render();}
 else if(a==="testsound"){unlockAudio();chime(1);}
 else if(a==="ics")downloadIcs(b);
 else if(a==="reset1"){const U=tr();$("#resetBox").innerHTML=`<span class="small">${U.resetQ}</span><button class="btn" data-act="reset2" style="background:var(--bad)">${U.erase}</button><button class="btn ghost" data-act="tab" data-v="about">${U.cancel}</button>`;}
 else if(a==="reset2"){S={start:null,done:{},scores:{},acts:{},answers:{},lang:S.lang,alarm:S.alarm,audio:S.audio,fired:null};persist();view="today";render();}
});
document.addEventListener("change",e=>{const c=e.target;if(!c.dataset)return;
 if(c.dataset.act==="actchk"){const w=c.dataset.w;S.acts[w]=S.acts[w]||{};S.acts[w][+c.dataset.j]=c.checked;persist();}
 else if(c.dataset.act==="alarmchk"){S.alarm.on=c.checked;if(!c.checked)armed=false;persist();render();}
 else if(c.dataset.act==="arec"){S.audio.rec=c.value;persist();pEls("select[data-act=arec]").forEach(x=>x.value=c.value);}
 else if(c.dataset.act==="alarmtime"&&c.value){S.alarm.t=c.value;S.fired=null;persist();render();}
});
render();
checkAlarm();
// ---------- Installed-app (PWA) extras ----------
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));

// Install button (Chrome on Android shows it when the app can be installed)
let installEvt = null;
addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault(); installEvt = e;
  if (document.getElementById("installBtn")) return;
  const b = document.createElement("button");
  b.id = "installBtn"; b.className = "installbtn";
  b.textContent = S.lang === "fr" ? "Installer" : "Install";
  b.addEventListener("click", async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; b.remove(); });
  document.querySelector(".brandright").appendChild(b);
});

// Ask for notification permission when the alarm is armed; notify when it fires
window.onArm = () => { try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); } catch (e) {} };
window.onAlarmFire = () => {
  try {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    navigator.serviceWorker.ready.then((r) => r.showNotification("Fajr Ten", {
      body: S.lang === "fr" ? "C'est l'heure de votre leçon : dix minutes." : "Time for your lesson: ten minutes.",
      icon: "icons/icon-192.png", badge: "icons/icon-192.png", tag: "fajr-ten", requireInteraction: true, vibrate: [300, 150, 300, 150, 300]
    }));
  } catch (e) {}
};

// Calendar file: a normal download in the installed app
async function downloadIcs(btn) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buildIcs()], { type: "text/calendar" }));
  a.download = "fajr-ten-rappel.ics"; document.body.appendChild(a); a.click(); a.remove();
  btn.textContent = tr().icsSaved;
}
</script>
